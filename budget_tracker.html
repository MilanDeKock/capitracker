/* ============================================================================
   Budget editor (also handles net income + anchor day)
   ========================================================================== */
function BudgetEditor({ budget, budgetOverrides, onSaveOverrides, anchorDay, settings, onSave, saving }) {
  const [draftBudget, setDraftBudget]     = useState(budget);
  const [draftSettings, setDraftSettings] = useState(settings);
  const [newLine, setNewLine]             = useState('');

  // Per-cycle overrides editor state
  const today = toISO(new Date());
  const currentCycleKey = cycleKey(today, anchorDay || 25);
  const [selectedOverrideCycle, setSelectedOverrideCycle] = useState(currentCycleKey);
  const [draftOverrides, setDraftOverrides] = useState(budgetOverrides || []);
  const [newOverrideLine, setNewOverrideLine] = useState('');
  const [newOverrideLineCustom, setNewOverrideLineCustom] = useState('');
  const [newOverrideAmount, setNewOverrideAmount] = useState('');

  useEffect(() => setDraftBudget(budget),     [budget]);
  useEffect(() => setDraftSettings(settings), [settings]);
  useEffect(() => setDraftOverrides(budgetOverrides || []), [budgetOverrides]);

  const dirty =
    JSON.stringify(draftBudget) !== JSON.stringify(budget) ||
    JSON.stringify(draftSettings) !== JSON.stringify(settings);

  const setAmount  = (line, v) => setDraftBudget(draftBudget.map(b => b.line === line ? { ...b, amount: parseFloat(v) || 0 } : b));
  const renameLine = (oldLine, newName) => { if (!newName.trim() || newName === oldLine) return; setDraftBudget(draftBudget.map(b => b.line === oldLine ? { ...b, line: newName } : b)); };
  const deleteLine = (line)    => setDraftBudget(draftBudget.filter(b => b.line !== line));
  const addLine    = ()        => { if (!newLine.trim() || draftBudget.some(b => b.line === newLine)) return; setDraftBudget([...draftBudget, { line: newLine.trim(), amount: 0, forecast: '', l100: 0, kmPerDay: 0 }]); setNewLine(''); };
  // Forecast-type setters — used by the "Forecast" column in the editor.
  const setForecastType = (line, type) => setDraftBudget(draftBudget.map(b => b.line === line ? { ...b, forecast: type } : b));
  const setForecastNum  = (line, key, v) => setDraftBudget(draftBudget.map(b => b.line === line ? { ...b, [key]: parseFloat(v) || 0 } : b));

  const total = draftBudget.reduce((s, b) => s + b.amount, 0);
  const surplus = draftSettings.netIncome - total;

  // Cycle options for the override picker: 2 past, current, 2 future
  const overrideCycleOptions = (() => {
    const cycles = [];
    for (let i = -2; i <= 2; i++) {
      const k = shiftCycle(currentCycleKey, i);
      if (k) cycles.push({
        key: k,
        label: prettyCycle(k, anchorDay || 25) + (i === 0 ? ' · current' : i < 0 ? ' · past' : ' · future'),
      });
    }
    return cycles;
  })();

  const overridesForSelected = draftOverrides.filter(o => o.cycle === selectedOverrideCycle);
  const overridesDirty = JSON.stringify(draftOverrides) !== JSON.stringify(budgetOverrides || []);

  const updateOverride = (line, amount) =>
    setDraftOverrides(draftOverrides.map(o =>
      (o.cycle === selectedOverrideCycle && o.line === line) ? { ...o, amount } : o
    ));
  const removeOverride = (line) =>
    setDraftOverrides(draftOverrides.filter(o => !(o.cycle === selectedOverrideCycle && o.line === line)));
  const addOverride = () => {
    const line = (newOverrideLineCustom.trim() || newOverrideLine).trim();
    if (!line) return;
    if (overridesForSelected.find(o => o.line === line)) return;
    setDraftOverrides([...draftOverrides, {
      cycle: selectedOverrideCycle, line, amount: parseFloat(newOverrideAmount) || 0,
    }]);
    setNewOverrideLine('');
    setNewOverrideLineCustom('');
    setNewOverrideAmount('');
  };
  const saveOverrides = () => onSaveOverrides && onSaveOverrides(draftOverrides);

  return (
    <div className="space-y-4">
      <div className="grid md:grid-cols-3 gap-3">
        <KPI label="Net income"       value={draftSettings.netIncome} tone="neutral" />
        <KPI label="Total budget"     value={total}                   tone="neutral" />
        <KPI label="Surplus on paper" value={surplus}                 tone={surplus < 0 ? 'over' : 'under'} sub={surplus < 0 ? 'budget exceeds income' : 'within income'} />
      </div>

      <div className="bg-white border border-stone-300 rounded-sm p-5">
        <div className="flex items-center justify-between mb-3">
          <h2 className="font-display text-lg">Income & cycle</h2>
          <button onClick={() => onSave(draftBudget, draftSettings)} disabled={!dirty || saving} className={`px-3 py-1.5 text-xs uppercase tracking-wider font-medium border ${dirty && !saving ? 'border-slate-800 bg-slate-800 text-white hover:bg-slate-700' : 'border-stone-300 text-stone-400 cursor-not-allowed'}`}>
            {saving ? 'Saving…' : dirty ? 'Save to Sheet' : 'Saved'}
          </button>
        </div>
        <div className="flex items-end gap-6 flex-wrap">
          <Field label="Net income (monthly)">
            <input type="number" value={draftSettings.netIncome} onChange={e => setDraftSettings({ ...draftSettings, netIncome: parseFloat(e.target.value) || 0 })} className="px-3 py-2 border border-stone-300 font-num text-lg w-48" />
          </Field>
          <Field label="Cycle anchor day (1–28)">
            <input type="number" min="1" max="28" value={draftSettings.anchorDay} onChange={e => setDraftSettings({ ...draftSettings, anchorDay: Math.max(1, Math.min(28, parseInt(e.target.value, 10) || 25)) })} className="px-3 py-2 border border-stone-300 font-num text-lg w-24" />
          </Field>
          <div className="text-xs text-stone-500 max-w-md">Each cycle runs from the anchor day of one month to the day before the anchor in the next month. You're paid on the 25th, so 25 is the natural choice.</div>
        </div>
      </div>

      <div className="bg-white border border-stone-300 rounded-sm overflow-hidden">
        <div className="px-5 py-3 border-b border-stone-200 flex items-center justify-between">
          <h2 className="font-display text-lg">Budget lines</h2>
          {dirty && <span className="text-xs text-amber-700">unsaved changes</span>}
        </div>
        <div className="px-5 py-3 border-b border-stone-200 flex items-center gap-2 bg-stone-50">
          <input value={newLine} onChange={e => setNewLine(e.target.value)} onKeyDown={e => e.key === 'Enter' && addLine()} placeholder="Add new budget line…" className="px-2 py-1.5 border border-stone-300 text-sm w-60 bg-white" />
          <button onClick={addLine} className="px-3 py-1.5 text-xs uppercase tracking-wider font-medium border border-slate-800 text-slate-800 hover:bg-slate-800 hover:text-stone-50 flex items-center gap-1.5"><IconPlus className="w-3.5 h-3.5" />Add line</button>
        </div>
        <table className="w-full text-sm">
          <thead>
            <tr className="text-xs uppercase tracking-wider text-stone-500 border-b border-stone-200">
              <th className="text-left px-5 py-2 font-medium">Line</th>
              <th className="text-right px-3 py-2 font-medium">Monthly budget (R)</th>
              <th className="text-left px-3 py-2 font-medium" title="How this line is forecast on the dashboard. Daily = burn rate × days left. Fixed = one-off debit. Petrol = live price × your L/100 × km/day.">Forecast</th>
              <th className="text-right px-5 py-2 font-medium" style={{ width: '4rem' }}></th>
            </tr>
          </thead>
          <tbody>
            {draftBudget.map(b => (
              <tr key={b.line} className="border-b border-stone-100 hover:bg-stone-50">
                <td className="px-5 py-1.5">
                  <input defaultValue={b.line} onBlur={e => renameLine(b.line, e.target.value)} className="px-2 py-1 border border-transparent hover:border-stone-300 focus:border-stone-300 text-sm w-44 bg-transparent" />
                </td>
                <td className="px-3 py-1.5 text-right">
                  <input type="number" value={b.amount} onChange={e => setAmount(b.line, e.target.value)} className="px-2 py-1 border border-stone-300 font-num text-sm w-32 text-right" />
                </td>
                <td className="px-3 py-1.5">
                  <div className="flex items-center gap-2 flex-wrap">
                    <select value={b.forecast || ''} onChange={e => setForecastType(b.line, e.target.value)}
                            className="px-2 py-1 border border-stone-300 text-xs bg-white">
                      <option value="">— none —</option>
                      <option value="daily">Daily burn</option>
                      <option value="fixed">Fixed debit</option>
                      <option value="petrol">Petrol (live)</option>
                    </select>
                    {b.forecast === 'petrol' && (
                      <>
                        <input type="number" step="0.1" value={b.l100 || ''} placeholder="L/100"
                               onChange={e => setForecastNum(b.line, 'l100', e.target.value)}
                               title="Litres per 100 km — check your car's spec or your driving history."
                               className="px-2 py-1 border border-stone-300 text-xs font-num w-16" />
                        <input type="number" step="1" value={b.kmPerDay || ''} placeholder="km/day"
                               onChange={e => setForecastNum(b.line, 'kmPerDay', e.target.value)}
                               title="Average kilometres driven per day."
                               className="px-2 py-1 border border-stone-300 text-xs font-num w-16" />
                      </>
                    )}
                  </div>
                </td>
                <td className="px-5 py-1.5 text-right">
                  <button onClick={() => deleteLine(b.line)} className="text-stone-400 hover:text-red-700"><IconTrash className="w-3.5 h-3.5" /></button>
                </td>
              </tr>
            ))}
            <tr className="bg-stone-100 font-medium">
              <td className="px-5 py-2">Total budget</td>
              <td className="px-3 py-2 text-right font-num">{fmt(total)}</td>
              <td colSpan="2"></td>
            </tr>
            <tr className="bg-stone-50 text-stone-600">
              <td className="px-5 py-1.5 text-sm">Net income</td>
              <td className="px-3 py-1.5 text-right font-num text-sm">{fmt(draftSettings.netIncome)}</td>
              <td colSpan="2"></td>
            </tr>
            <tr className={`font-medium ${surplus < 0 ? 'bg-red-50' : 'bg-emerald-50'}`}>
              <td className={`px-5 py-2 ${surplus < 0 ? 'text-red-800' : 'text-emerald-800'}`}>
                {surplus < 0 ? 'Over budget by' : 'Surplus left over'}
              </td>
              <td className={`px-3 py-2 text-right font-num ${surplus < 0 ? 'text-red-800' : 'text-emerald-800'}`}>
                {fmt(Math.abs(surplus))}
              </td>
              <td colSpan="2"></td>
            </tr>
          </tbody>
        </table>
      </div>

      {/* Per-cycle overrides — change a budget line just for one cycle, or
          add one-off lines (e.g. Mission Trip) that only apply to a single cycle. */}
      <div className="bg-white border border-stone-300 rounded-sm overflow-hidden">
        <div className="px-5 py-3 border-b border-stone-200 flex items-center justify-between flex-wrap gap-2">
          <div>
            <h2 className="font-display text-lg">Per-cycle overrides</h2>
            <div className="text-xs text-stone-500 mt-0.5">Tweak a budget line for one specific cycle without changing the default. Useful for one-offs like mission trips or holiday months.</div>
          </div>
          {overridesDirty && (
            <button onClick={saveOverrides}
                    className="px-3 py-1.5 text-xs uppercase tracking-wider font-medium border border-slate-800 bg-slate-800 text-white hover:bg-slate-700">
              Save overrides
            </button>
          )}
        </div>

        <div className="px-5 py-4 space-y-4">
          <div className="flex items-end gap-3 flex-wrap">
            <div>
              <label className="text-xs uppercase tracking-wider text-stone-500 block mb-1">Apply to cycle</label>
              <select value={selectedOverrideCycle} onChange={e => setSelectedOverrideCycle(e.target.value)}
                      className="px-2 py-1.5 border border-stone-300 text-sm bg-white">
                {overrideCycleOptions.map(c => (
                  <option key={c.key} value={c.key}>{c.label}</option>
                ))}
              </select>
            </div>
          </div>

          {overridesForSelected.length > 0 ? (
            <table className="w-full text-sm">
              <thead>
                <tr className="text-xs uppercase tracking-wider text-stone-500 border-b border-stone-200">
                  <th className="text-left py-2 font-medium">Line</th>
                  <th className="text-right py-2 font-medium">Default</th>
                  <th className="text-right py-2 font-medium">Override</th>
                  <th></th>
                </tr>
              </thead>
              <tbody>
                {overridesForSelected.map(o => {
                  const def = draftBudget.find(b => b.line === o.line);
                  return (
                    <tr key={o.line} className="border-b border-stone-100">
                      <td className="py-1.5 text-sm">
                        {o.line}
                        {!def && <span className="text-[10px] uppercase tracking-wider text-indigo-700 ml-1.5 px-1.5 py-0.5 border border-indigo-300 bg-indigo-50">one-off</span>}
                      </td>
                      <td className="py-1.5 text-right font-num text-stone-500 text-xs">{def ? fmt(def.amount) : '—'}</td>
                      <td className="py-1.5 text-right">
                        <input type="number" value={o.amount} onChange={e => updateOverride(o.line, parseFloat(e.target.value) || 0)}
                               className="px-2 py-1 border border-stone-300 text-sm font-num w-28 text-right" />
                      </td>
                      <td className="py-1.5 text-right pr-1">
                        <button onClick={() => removeOverride(o.line)} title="Remove override"
                                className="text-stone-400 hover:text-red-700">
                          <IconTrash className="w-3.5 h-3.5" />
                        </button>
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          ) : (
            <div className="text-xs text-stone-500 italic">No overrides for this cycle. The default budget applies.</div>
          )}

          <div className="border-t border-stone-200 pt-3">
            <div className="text-xs uppercase tracking-wider text-stone-500 mb-2">Add an override</div>
            <div className="flex items-end gap-2 flex-wrap">
              <div>
                <label className="text-[10px] text-stone-500 block mb-0.5">Pick existing line</label>
                <select value={newOverrideLine} onChange={e => { setNewOverrideLine(e.target.value); setNewOverrideLineCustom(''); }}
                        className="px-2 py-1 border border-stone-300 text-sm bg-white">
                  <option value="">— pick —</option>
                  {draftBudget.map(b => <option key={b.line} value={b.line}>{b.line}</option>)}
                </select>
              </div>
              <div className="text-xs text-stone-500 pb-1.5">or</div>
              <div>
                <label className="text-[10px] text-stone-500 block mb-0.5">Custom one-off line</label>
                <input value={newOverrideLineCustom} onChange={e => { setNewOverrideLineCustom(e.target.value); setNewOverrideLine(''); }}
                       placeholder="e.g. Mission Trip"
                       className="px-2 py-1 border border-stone-300 text-sm" />
              </div>
              <div>
                <label className="text-[10px] text-stone-500 block mb-0.5">Amount</label>
                <input type="number" value={newOverrideAmount} onChange={e => setNewOverrideAmount(e.target.value)}
                       placeholder="0"
                       className="px-2 py-1 border border-stone-300 text-sm font-num w-24 text-right" />
              </div>
              <button onClick={addOverride}
                      className="px-3 py-1 text-xs uppercase tracking-wider font-medium border border-slate-800 text-slate-800 hover:bg-slate-800 hover:text-stone-50 flex items-center gap-1.5">
                <IconPlus className="w-3.5 h-3.5" />Add
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ============================================================================
   Setup panel
   ========================================================================== */
function SetupPanel({ config, setConfig, onSync, onReload, loading, hasData }) {
  const [draft, setDraft] = useState(config);
  useEffect(() => setDraft(config), [config]);
  const dirty = draft.sheetUrl !== config.sheetUrl || draft.sheetToken !== config.sheetToken;

  return (
    <div className="space-y-4 max-w-3xl">
      <div className="bg-white border border-stone-300 rounded-sm p-5">
        <h2 className="font-display text-lg mb-2">Sheet connection</h2>
        <p className="text-xs text-stone-500 mb-4">Paste the Web app URL from your Apps Script deployment, and the same SHARED_TOKEN string you set inside the script. Both are saved in this browser only.</p>

        <div className="space-y-3">
          <Field label="Apps Script web-app URL">
            <input value={draft.sheetUrl} onChange={e => setDraft({ ...draft, sheetUrl: e.target.value })} placeholder="https://script.google.com/macros/s/.../exec" className="px-2 py-1.5 border border-stone-300 text-sm font-num w-full" />
          </Field>
          <Field label="Shared token">
            <input type="password" value={draft.sheetToken} onChange={e => setDraft({ ...draft, sheetToken: e.target.value })} placeholder="paste SHARED_TOKEN from apps_script.gs" className="px-2 py-1.5 border border-stone-300 text-sm font-num w-full" />
          </Field>
        </div>

        <div className="mt-4 flex items-center gap-2 flex-wrap">
          <button onClick={() => setConfig(draft)} disabled={!dirty} className={`px-3 py-1.5 text-xs uppercase tracking-wider font-medium border ${dirty ? 'border-slate-800 bg-slate-800 text-white hover:bg-slate-700' : 'border-stone-300 text-stone-400 cursor-not-allowed'}`}>
            {dirty ? 'Save & connect' : 'Saved'}
          </button>
          <button onClick={onReload} disabled={loading || !config.sheetUrl} className="px-3 py-1.5 text-xs uppercase tracking-wider font-medium border border-stone-300 text-stone-700 hover:bg-stone-100 disabled:opacity-50">
            Reload sheet
          </button>
          <button onClick={onSync} disabled={loading || !config.sheetUrl} className="px-3 py-1.5 text-xs uppercase tracking-wider font-medium border border-slate-800 text-slate-800 hover:bg-slate-800 hover:text-stone-50 disabled:opacity-50 flex items-center gap-1.5">
            <IconRefresh className={`w-3.5 h-3.5 ${loading ? 'animate-spin' : ''}`} />Sync from Gmail now
          </button>
        </div>

        {hasData && config.sheetUrl && (
          <div className="mt-4 text-xs text-emerald-700 flex items-center gap-1.5">
            <IconCheck className="w-3.5 h-3.5" />Connected and data loaded.
          </div>
        )}
      </div>

      <div className="bg-white border border-stone-300 rounded-sm p-5 text-xs text-stone-600 space-y-3">
        <h3 className="font-display text-base text-stone-900">First-time setup</h3>
        <ol className="list-decimal pl-5 space-y-1.5">
          <li>Create a fresh Google Sheet, name it (e.g.) "Budget Tracker 2026".</li>
          <li>Inside the Sheet: <span className="font-num">Extensions → Apps Script</span>. Delete the placeholder code, paste in <span className="font-num bg-stone-100 px-1">apps_script.gs</span> from this folder.</li>
          <li>At the top of the script, set <span className="font-num bg-stone-100 px-1">SHARED_TOKEN</span> to a long random string (any password generator works). Save (Ctrl+S).</li>
          <li>Click <span className="font-num">Deploy → New deployment</span>. Gear icon → <span className="font-num">Web app</span>. Execute as: <em>Me</em>. Who has access: <em>Anyone with the link</em>. Click <span className="font-num">Deploy</span>.</li>
          <li>Google will show "this app isn't verified" the first time — click <span className="font-num">Advanced → Go to project (unsafe) → Allow</span>. This is normal for personal Apps Script projects (your own code, your own data).</li>
          <li>Copy the Web app URL. Paste it above. Paste the same SHARED_TOKEN string into the token field. Click <span className="font-num">Save &amp; connect</span>.</li>
          <li>Close + reopen the Sheet once. <span className="font-num">onOpen()</span> fires: the five tabs auto-create (<span className="font-num">Bank Statement, Transactions, Budget, Rules, Settings</span>) and Gmail starts getting pulled.</li>
          <li>Back here, click <span className="font-num">Reload sheet</span> — you should see your budget lines and rules appear.</li>
        </ol>
        <div className="pt-2 border-t border-stone-200 text-stone-500">
          <p>What goes where: raw Gmail pulls land in <span className="font-num">Bank Statement</span> (cleared & refilled every time the Sheet opens). Classified rows live in <span className="font-num">Transactions</span> (your long-term history; only this app's "Post to history" button writes here). Budget, Rules, and Settings each have their own tab.</p>
        </div>
      </div>
    </div>
  );
}

/* ============================================================================
   Boot
   ========================================================================== */
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<BudgetTracker />);
</script>
</body>
</html>
