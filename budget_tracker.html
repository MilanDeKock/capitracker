/* ============================================================================
   Storage keys & helpers (localStorage)
   ========================================================================== */
const K = {
  config:              'bt.config',              // {sheetUrl, sheetToken}
  cache:               'bt.cache',               // last loaded snapshot — offline fallback only
  overrides:           'bt.overrides',           // hash → line, for rows not yet posted to history
  splitOverrides:      'bt.splitOverrides',      // hash → splits[], for rows not yet posted to history
  budgetDateOverrides: 'bt.budgetDateOverrides', // hash → 'YYYY-MM-DD', for rows not yet posted to history
  tab:                 'bt.tab',                 // last selected tab
  privateMode:         'bt.privateMode',         // blur sensitive amounts (eye toggle)
  watchLine:           'bt.watchLine',           // which budget line the Running Watch panel is showing
};
const loadLS = (k, fallback) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : fallback; } catch { return fallback; } };
const saveLS = (k, v)        => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };

// Substrings (case-insensitive) used to hide internal transfers between your own accounts.
// Add more patterns here if Capitec uses different wording for any of your self-transfers.
const INTERNAL = [
  'transfer to credit card',
  'transfer received from main account',
  'transfer received from credit card',
  'transfer to main account',
  // Add patterns specific to your own self-transfers here, e.g.:
  // 'transfer received from <your-account-name>',
  // 'transfer to <your-account-name>',
];
const isInternalTx = t => {
  const d = (t.description || '').toLowerCase();
  const o = (t.originalDesc || '').toLowerCase();
  return INTERNAL.some(k => d.includes(k) || o.includes(k));
};

/* ============================================================================
   Date / cycle helpers
   ========================================================================== */
function parseISO(s) {
  if (!s) return null;
  const [y, m, d] = String(s).slice(0, 10).split('-').map(Number);
  if (!y || !m || !d) return null;
  return new Date(y, m - 1, d);
}
function toISO(d) {
  if (!(d instanceof Date) || isNaN(d)) return '';
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}
function cycleStartFor(dateStr, anchorDay) {
  const d = parseISO(dateStr) || new Date();
  if (d.getDate() >= anchorDay) return new Date(d.getFullYear(), d.getMonth(), anchorDay);
  return new Date(d.getFullYear(), d.getMonth() - 1, anchorDay);
}
function cycleEndFor(dateStr, anchorDay) {
  const s = cycleStartFor(dateStr, anchorDay);
  return new Date(s.getFullYear(), s.getMonth() + 1, anchorDay);
}
function cycleKey(dateStr, anchorDay) {
  return toISO(cycleStartFor(dateStr, anchorDay));
}
function prettyDate(iso) {
  const d = parseISO(iso);
  if (!d) return '—';
  return d.toLocaleDateString('en-ZA', { day: '2-digit', month: 'short', year: 'numeric' });
}
function prettyCycle(cycleStartISO, anchorDay) {
  const s = parseISO(cycleStartISO);
  if (!s) return '—';
  const e = new Date(s.getFullYear(), s.getMonth() + 1, s.getDate());
  e.setDate(e.getDate() - 1);
  const sStr = s.toLocaleDateString('en-ZA', { day: '2-digit', month: 'short' });
  const eStr = e.toLocaleDateString('en-ZA', { day: '2-digit', month: 'short', year: 'numeric' });
  return `${sStr} – ${eStr}`;
}
function shortCycleLabel(cycleStartISO) {
  const d = parseISO(cycleStartISO);
  if (!d) return '—';
  return d.toLocaleDateString('en-ZA', { month: 'short', year: '2-digit' });
}
function shiftCycle(cycleStartISO, months) {
  const d = parseISO(cycleStartISO);
  if (!d) return null;
  d.setMonth(d.getMonth() + months);
  return toISO(d);
}

/* ============================================================================
   Format helpers
   ========================================================================== */
const fmt = (n, dp = 0) => {
  if (!n || Math.abs(n) < 0.005) return '–';
  const v = Math.abs(n).toLocaleString('en-ZA', { minimumFractionDigits: dp, maximumFractionDigits: dp });
  return n < 0 ? `(${v})` : v;
};
const fmtSigned = n => {
  if (!n || Math.abs(n) < 0.5) return '0';
  const s = n > 0 ? '+' : '−';
  return s + Math.abs(n).toLocaleString('en-ZA', { maximumFractionDigits: 0 });
};

/* ============================================================================
   Splits — a transaction's amount can be allocated across multiple budget lines.
   Stored on the Sheet's Transactions tab as "Line1:Amount1|Line2:Amount2".
   Amounts in splits are positive numbers; the row's sign (negative = spend) is
   implicit. Empty/null splits → row uses its single Line as usual.
   ========================================================================== */
function parseSplits(s) {
  if (s === null || s === undefined) return null;
  const str = String(s).trim();
  if (!str) return null;
  const out = [];
  for (const part of str.split('|')) {
    const piece = part.trim();
    if (!piece) continue;
    const idx = piece.lastIndexOf(':');
    if (idx < 0) continue;
    const line = piece.slice(0, idx).trim();
    const amt  = Number(piece.slice(idx + 1));
    if (!line || !Number.isFinite(amt) || amt === 0) continue;
    out.push({ line, amount: Math.abs(amt) });
  }
  return out.length ? out : null;
}
function serializeSplits(arr) {
  if (!arr || !arr.length) return '';
  return arr.map(s => `${s.line}:${Math.abs(Number(s.amount) || 0)}`).join('|');
}
function splitsSum(arr) {
  if (!arr || !arr.length) return 0;
  return arr.reduce((s, x) => s + (Math.abs(Number(x.amount)) || 0), 0);
}

/* ============================================================================
   Row normalization (Sheet/CSV → JS tx shape)
   ========================================================================== */
function normalizeRow(r) {
  const mi = Number(r['Money In']) || 0;
  const mo = Number(r['Money Out']) || 0;
  const fe = Number(r['Fee']) || 0;
  return {
    account: String(r['Account'] || ''),
    date: String(r['Posting Date'] || '').slice(0, 10),
    transactionDate: String(r['Transaction Date'] || '').slice(0, 10),
    description: String(r['Description'] || ''),
    originalDesc: String(r['Original Description'] || r['Description'] || ''),
    parentCategory: String(r['Parent Category'] || ''),
    bankCategory: String(r['Category'] || ''),
    moneyIn: mi,
    moneyOut: mo,
    fee: fe,
    amount: mi + mo + fe,
    line: r['Line'] || null,
    splits: parseSplits(r['Splits']),
    budgetDate: (r['Budget Date'] ? String(r['Budget Date']).slice(0, 10) : '') || null,
    postedAt: r['Posted At'] || null,
  };
}
// Date used for budget/cycle calculations. Budget Date overrides Posting Date,
// letting a row count in a different cycle without changing its actual date.
const effectiveDate = t => t.budgetDate || t.date;
function denormalizeRow(t) {
  return {
    'Account': t.account,
    'Posting Date': t.date,
    'Transaction Date': t.transactionDate,
    'Description': t.description,
    'Original Description': t.originalDesc,
    'Parent Category': t.parentCategory,
    'Category': t.bankCategory,
    'Money In': t.moneyIn,
    'Money Out': t.moneyOut,
    'Fee': t.fee,
    'Line': t.line,
    'Splits': serializeSplits(t.splits),
    'Budget Date': t.budgetDate || '',
  };
}
const txHash = t => `${t.date}|${(t.originalDesc || t.description || '').toLowerCase()}|${(t.amount || 0).toFixed(2)}`;

/* ============================================================================
   Classifier
   ========================================================================== */
function classify(tx, rules) {
  if (tx.amount > 0) return tx.bankCategory === 'Salary' ? 'Salary' : 'Other Income';
  const desc = (tx.description || '').toLowerCase();
  const orig = (tx.originalDesc || '').toLowerCase();
  for (const r of rules) {
    const val = (r.value || '').toLowerCase();
    if (r.type === 'desc' && val && (desc.includes(val) || orig.includes(val))) return r.line;
    if (r.type === 'cat'  && tx.bankCategory  === r.value) return r.line;
    if (r.type === 'pcat' && tx.parentCategory === r.value) return r.line;
  }
  return 'Review';
}

/* ============================================================================
   CSV parser (fallback path, manual drop)
   ========================================================================== */
function parseCsvText(text) {
  const res = Papa.parse(text, { header: true, skipEmptyLines: true });
  return res.data
    .map(normalizeRow)
    .filter(t => t.date && t.amount !== 0)
    .filter(t => !INTERNAL.some(k => (t.description || '').toLowerCase().includes(k)));
}

/* ============================================================================
   Sheet I/O
   ========================================================================== */
async function sheetFetch(config, action, body) {
  if (!config.sheetUrl || !config.sheetToken) {
    throw new Error('Sheet not configured — set URL and token in the Setup tab.');
  }
  let res;
  if (body) {
    res = await fetch(config.sheetUrl, {
      method: 'POST',
      body: JSON.stringify({ token: config.sheetToken, action, ...body }),
      redirect: 'follow',
    });
  } else {
    const url = `${config.sheetUrl}?token=${encodeURIComponent(config.sheetToken)}&action=${action}`;
    res = await fetch(url, { redirect: 'follow' });
  }
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const data = await res.json();
  if (data && data.ok === false) throw new Error(data.error || 'Sheet error');
  return data;
}

/* ============================================================================
   Main app
   ========================================================================== */
function BudgetTracker() {
  const cached = loadLS(K.cache, {});
  const [config, setConfig]               = useState(() => loadLS(K.config, { sheetUrl: '', sheetToken: '' }));
  const [budget, setBudget]               = useState(cached.budget         || []);
  const [rules, setRules]                 = useState(cached.rules          || []);
  const [settings, setSettings]           = useState(cached.settings       || { netIncome: 0, anchorDay: 25 });
  const [rawStatements, setRawStatements] = useState(cached.rawStatements  || []);
  const [history, setHistory]             = useState(cached.history        || []);
  const [overrides, setOverrides]         = useState(() => loadLS(K.overrides, {}));
  const [splitOverrides, setSplitOverrides] = useState(() => loadLS(K.splitOverrides, {}));
  const [budgetDateOverrides, setBudgetDateOverrides] = useState(() => loadLS(K.budgetDateOverrides, {}));
  const [csvRows, setCsvRows]             = useState([]);
  const [fileNames, setFileNames]         = useState([]);
  const [tab, setTab]                     = useState(() => {
    const saved = loadLS(K.tab, null);
    const cfg = loadLS(K.config, { sheetUrl: '', sheetToken: '' });
    if (saved) return saved;
    return (cfg.sheetUrl && cfg.sheetToken) ? 'dashboard' : 'setup';
  });
  const [privateMode, setPrivateMode]     = useState(() => loadLS(K.privateMode, false));
  const [loading, setLoading]             = useState(false);
  const [syncStatus, setSyncStatus]       = useState(null); // {kind:'ok'|'err', message, when}
  const [importError, setImportError]     = useState(null);
  const [chatOpen, setChatOpen]           = useState(false);
  const [chatMessages, setChatMessages]   = useState([]);
  const [chatSending, setChatSending]     = useState(false);
  const [chatScope, setChatScope]         = useState('window'); // 'window' | 'last30' | 'last90' | 'all'

  useEffect(() => saveLS(K.config, config),       [config]);
  useEffect(() => saveLS(K.overrides, overrides), [overrides]);
  useEffect(() => saveLS(K.splitOverrides, splitOverrides), [splitOverrides]);
  useEffect(() => saveLS(K.budgetDateOverrides, budgetDateOverrides), [budgetDateOverrides]);
  useEffect(() => saveLS(K.tab, tab),             [tab]);
  useEffect(() => saveLS(K.privateMode, privateMode), [privateMode]);

  const cacheSnapshot = (next) => {
    saveLS(K.cache, {
      rawStatements: next.rawStatements ?? rawStatements,
      history:       next.history       ?? history,
      budget:        next.budget        ?? budget,
      rules:         next.rules         ?? rules,
      settings:      next.settings      ?? settings,
    });
  };

  // pullMode: null = just reload from Sheet (no Gmail fetch)
  //           'csv' = pull CSV statements only (fast, ~5s)
  //           'pdf' = parse PDFs via Gemini (slow, ~3min per PDF)
  //           'all' = both (legacy / mixed-source users)
  async function loadFromSheet({ pull = false, pullMode = null } = {}) {
    if (!config.sheetUrl || !config.sheetToken) {
      setSyncStatus({ kind: 'err', message: 'Configure Sheet URL & token in Setup first.', when: new Date() });
      return;
    }
    setLoading(true);
    setSyncStatus(null);
    const action = pullMode === 'csv' ? 'pull-csv'
                 : pullMode === 'pdf' ? 'pull-pdf'
                 : pull ? 'pull' : 'load';
    try {
      const data = await sheetFetch(config, action);
      const nRaw     = (data.rawStatements || []).map(normalizeRow).filter(t => t.date && t.amount !== 0);
      const nHist    = (data.transactions  || []).map(normalizeRow).filter(t => t.date);
      const nBudget  = (data.budget || []).map(r => ({ line: String(r.Line || ''), amount: Number(r.Amount) || 0 })).filter(b => b.line);
      const nRules   = (data.rules  || []).map(r => ({ line: String(r.Line || ''), type: String(r.Type || ''), value: String(r.Value || '') })).filter(r => r.line && r.type);
      const s = data.settings || {};
      const nSettings = {
        netIncome: Number(s['Net Income']) || 0,
        anchorDay: Number(s['Anchor Day']) || 25,
      };
      setRawStatements(nRaw);
      setHistory(nHist);
      setBudget(nBudget);
      setRules(nRules);
      setSettings(nSettings);
      saveLS(K.cache, { rawStatements: nRaw, history: nHist, budget: nBudget, rules: nRules, settings: nSettings });
      const sourceLabel = pullMode === 'csv' ? 'CSV statements'
                        : pullMode === 'pdf' ? 'PDF statements (AI-parsed)'
                        : pull ? 'Gmail' : null;
      setSyncStatus({
        kind: 'ok',
        message: sourceLabel
          ? `Pulled ${sourceLabel}. ${nRaw.length} raw rows, ${nHist.length} in history.`
          : `Loaded. ${nRaw.length} raw rows, ${nHist.length} in history.`,
        when: new Date(),
      });
    } catch (e) {
      setSyncStatus({ kind: 'err', message: e.message || String(e), when: new Date() });
    } finally {
      setLoading(false);
    }
  }

  // Initial load when config is set
  useEffect(() => {
    if (config.sheetUrl && config.sheetToken) {
      void loadFromSheet();
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [config.sheetUrl, config.sheetToken]);

  const handleFiles = async (files) => {
    if (!files || !files.length) return;
    setImportError(null);
    try {
      const all = [];
      const names = [];
      for (const f of Array.from(files)) {
        names.push(f.name);
        const text = await f.text();
        all.push(...parseCsvText(text));
      }
      setCsvRows(all);
      setFileNames(names);
    } catch (e) { setImportError(e.message || 'Could not parse file'); }
  };

  // Merged view: history (canonical) wins over raw/csv on hash collision.
  // Internal self-transfers between your own accounts are dropped at this layer.
  const allTxs = useMemo(() => {
    const seen = new Set();
    const out = [];
    for (const t of history) {
      if (isInternalTx(t)) continue;
      const h = txHash(t);
      if (seen.has(h)) continue;
      seen.add(h);
      out.push({ ...t, inHistory: true, hash: h, line: t.line || 'Review' });
    }
    const candidates = [...rawStatements, ...csvRows];
    for (const t of candidates) {
      if (!t.date) continue;
      if (isInternalTx(t)) continue;
      const h = txHash(t);
      if (seen.has(h)) continue;
      seen.add(h);
      const auto = classify(t, rules);
      const line = overrides[h] || auto;
      const splits = splitOverrides[h] || null;
      const budgetDate = budgetDateOverrides[h] || null;
      out.push({ ...t, inHistory: false, hash: h, line, splits, budgetDate });
    }
    out.sort((a, b) => b.date.localeCompare(a.date));
    return out;
  }, [history, rawStatements, csvRows, rules, overrides, splitOverrides, budgetDateOverrides]);

  // Default date range — current cycle
  const defaultRange = useMemo(() => {
    const today = toISO(new Date());
    const start = cycleStartFor(today, settings.anchorDay);
    const endExcl = new Date(start.getFullYear(), start.getMonth() + 1, settings.anchorDay);
    const endIncl = new Date(endExcl);
    endIncl.setDate(endIncl.getDate() - 1);
    return { from: toISO(start), to: toISO(endIncl) };
  }, [settings.anchorDay]);

  const [dateRange, setDateRange] = useState(defaultRange);
  useEffect(() => { setDateRange(defaultRange); }, [defaultRange]);

  const windowTxs = useMemo(
    () => allTxs.filter(t => {
      const d = effectiveDate(t);
      return d >= dateRange.from && d <= dateRange.to;
    }),
    [allTxs, dateRange],
  );

  // Aggregate net spend per budget line. Spends (amount < 0) add to the line's
  // actual; credits/income (amount > 0) subtract. Splits distribute across
  // multiple lines, with the row's sign carrying the direction.
  // Income explicitly tagged as Salary/Other Income (or any line not in the
  // budget) simply doesn't appear in the Budget vs Actual table — the user
  // chooses by classification whether a deposit should offset a budget line.
  const actuals = useMemo(() => {
    const a = {};
    for (const b of budget) a[b.line] = 0;
    for (const t of windowTxs) {
      if (!t.amount) continue;
      const sign = t.amount < 0 ? 1 : -1;
      if (t.splits && t.splits.length) {
        for (const s of t.splits) {
          if (a[s.line] === undefined) a[s.line] = 0;
          a[s.line] += sign * Math.abs(s.amount);
        }
      } else {
        if (a[t.line] === undefined) a[t.line] = 0;
        a[t.line] -= t.amount;
      }
    }
    return a;
  }, [windowTxs, budget]);

  const allCycles = useMemo(() => {
    const set = new Set();
    for (const t of allTxs) {
      const d = effectiveDate(t);
      if (d) set.add(cycleKey(d, settings.anchorDay));
    }
    return Array.from(set).sort();
  }, [allTxs, settings.anchorDay]);

  const cycleActuals = useMemo(() => {
    const result = {};
    for (const cy of allCycles) result[cy] = {};
    for (const t of allTxs) {
      if (!t.amount) continue;
      const sign = t.amount < 0 ? 1 : -1;
      const cy = cycleKey(effectiveDate(t), settings.anchorDay);
      if (!result[cy]) result[cy] = {};
      if (t.splits && t.splits.length) {
        for (const s of t.splits) {
          if (!result[cy][s.line]) result[cy][s.line] = 0;
          result[cy][s.line] += sign * Math.abs(s.amount);
        }
      } else {
        if (!result[cy][t.line]) result[cy][t.line] = 0;
        result[cy][t.line] -= t.amount;
      }
    }
    return result;
  }, [allTxs, allCycles, settings.anchorDay]);

  const lineNames           = budget.map(b => b.line);
  const newTxs              = allTxs.filter(t => !t.inHistory);
  // A row counts as classified if either its Line is set (not "Review") OR it
  // has splits configured — splits override the single line for budgeting,
  // so a Review row with splits is effectively classified across those lines.
  const newClassified       = newTxs.filter(t => t.line !== 'Review' || (t.splits && t.splits.length));
  const stillNeedingReview  = newTxs.length - newClassified.length;

  async function handlePostToHistory() {
    if (!newClassified.length) return;
    setLoading(true);
    setSyncStatus(null);
    try {
      const rows = newClassified.map(t => denormalizeRow(t));
      const res = await sheetFetch(config, null, { action: 'append-history', rows });
      const now = new Date().toISOString();
      const appended = newClassified.map(t => ({
        account: t.account, date: t.date, transactionDate: t.transactionDate,
        description: t.description, originalDesc: t.originalDesc,
        parentCategory: t.parentCategory, bankCategory: t.bankCategory,
        moneyIn: t.moneyIn, moneyOut: t.moneyOut, fee: t.fee, amount: t.amount,
        line: t.line, postedAt: now,
      }));
      const nextHistory = [...history, ...appended];
      setHistory(nextHistory);
      cacheSnapshot({ history: nextHistory });
      const newOv = { ...overrides };
      const newSplitOv = { ...splitOverrides };
      const newBudgetDateOv = { ...budgetDateOverrides };
      for (const t of newClassified) {
        delete newOv[t.hash];
        delete newSplitOv[t.hash];
        delete newBudgetDateOv[t.hash];
      }
      setOverrides(newOv);
      setSplitOverrides(newSplitOv);
      setBudgetDateOverrides(newBudgetDateOv);
      setSyncStatus({ kind: 'ok', message: `Posted ${res.appended} row(s) to history.`, when: new Date() });
    } catch (e) {
      setSyncStatus({ kind: 'err', message: e.message || String(e), when: new Date() });
    } finally {
      setLoading(false);
    }
  }

  async function handleSaveBudget(newBudget, newSettings) {
    setLoading(true);
    setSyncStatus(null);
    try {
      const rows = newBudget.map(b => ({ Line: b.line, Amount: b.amount }));
      await sheetFetch(config, null, { action: 'save-budget', rows });
      await sheetFetch(config, null, { action: 'save-settings', settings: { 'Net Income': newSettings.netIncome, 'Anchor Day': newSettings.anchorDay } });
      setBudget(newBudget);
      setSettings(newSettings);
      cacheSnapshot({ budget: newBudget, settings: newSettings });
      setSyncStatus({ kind: 'ok', message: 'Budget saved to Sheet.', when: new Date() });
    } catch (e) {
      setSyncStatus({ kind: 'err', message: e.message || String(e), when: new Date() });
    } finally {
      setLoading(false);
    }
  }

  async function handleEditHistoryLine(hash, newLine) {
    // Functional setState — critical for bulk updates, where multiple calls fire
    // back-to-back. The non-functional form would have each call capture the same
    // pre-update history and last-write-wins, defeating the bulk edit.
    setHistory(h => h.map(t => txHash(t) === hash ? { ...t, line: newLine } : t));
    try {
      await sheetFetch(config, null, { action: 'update-history', hash, line: newLine });
      setSyncStatus({ kind: 'ok', message: 'Updated in history.', when: new Date() });
    } catch (e) {
      // Revert just this row's line if we have a way to know the old value.
      // Per-row revert without tracking is hard; surface the error and let the
      // user re-sync from Sheet if it matters.
      setSyncStatus({ kind: 'err', message: 'Edit failed: ' + (e.message || String(e)), when: new Date() });
    }
  }

  async function handleDeleteHistoryRow(hash) {
    // Same functional-setState reason as handleEditHistoryLine — bulk deletes
    // need each call to see the previous call's filter result.
    setHistory(h => h.filter(t => txHash(t) !== hash));
    try {
      await sheetFetch(config, null, { action: 'delete-history', hash });
      setSyncStatus({ kind: 'ok', message: 'Removed from history.', when: new Date() });
    } catch (e) {
      setSyncStatus({ kind: 'err', message: 'Delete failed: ' + (e.message || String(e)), when: new Date() });
    }
  }

  async function handleChatSend(text) {
    if (!text.trim() || chatSending) return;
    const userMsg = { role: 'user', text: text.trim() };
    const nextMessages = [...chatMessages, userMsg];
    setChatMessages(nextMessages);
    setChatSending(true);
    try {
      // Pick which transactions to send based on the scope dropdown. The
      // default ('window') sends what the Dashboard is showing — fast and
      // matches what the user is looking at. Other scopes let them ask
      // questions across more history without leaving the chat.
      const mapTx = t => ({
        date: t.date,
        description: t.description,
        amount: Math.round(t.amount * 100) / 100,
        line: t.line,
      });
      const today = new Date();
      const cutoffISO = (days) => {
        const d = new Date(today); d.setDate(today.getDate() - days);
        return toISO(d);
      };

      let scopeTxs, scopeFrom, scopeTo, scopeLabel;
      if (chatScope === 'last30') {
        scopeFrom = cutoffISO(30); scopeTo = toISO(today);
        scopeTxs = allTxs.filter(t => effectiveDate(t) >= scopeFrom);
        scopeLabel = 'last 30 days';
      } else if (chatScope === 'last90') {
        scopeFrom = cutoffISO(90); scopeTo = toISO(today);
        scopeTxs = allTxs.filter(t => effectiveDate(t) >= scopeFrom);
        scopeLabel = 'last 90 days';
      } else if (chatScope === 'all') {
        scopeFrom = ''; scopeTo = '';
        scopeTxs = allTxs;
        scopeLabel = 'all available history';
      } else {
        // default: 'window'
        scopeFrom = dateRange.from; scopeTo = dateRange.to;
        scopeTxs = windowTxs;
        scopeLabel = 'current cycle window';
      }

      // Hard cap so we don't blow the context window on big histories.
      const MAX_TX_IN_PROMPT = 600;
      const txs = scopeTxs.slice(0, MAX_TX_IN_PROMPT).map(mapTx);
      const truncated = scopeTxs.length > MAX_TX_IN_PROMPT;

      const res = await sheetFetch(config, null, {
        action: 'chat',
        messages: nextMessages.map(m => ({ role: m.role, text: m.text })),
        context: {
          budget,
          settings: { netIncome: settings.netIncome, anchorDay: settings.anchorDay },
          windowFrom: scopeFrom,
          windowTo: scopeTo,
          scopeLabel,
          truncated,
          totalCount: scopeTxs.length,
          transactions: txs,
        },
      });
      const reply = res && res.message ? res.message : '(no reply)';
      setChatMessages([...nextMessages, { role: 'assistant', text: reply }]);
    } catch (e) {
      setChatMessages([...nextMessages, { role: 'assistant', text: 'Error: ' + (e.message || String(e)), error: true }]);
    } finally {
      setChatSending(false);
    }
  }

  async function handleUpdateBudgetDate(hash, budgetDate) {
    // budgetDate is 'YYYY-MM-DD' or null/empty to clear.
    // In-history rows write straight to Sheet; new rows go to local
    // budgetDateOverrides state until posted.
    const isInHistory = history.some(t => txHash(t) === hash);
    const cleaned = budgetDate || null;
    if (isInHistory) {
      setHistory(h => h.map(t => txHash(t) === hash ? { ...t, budgetDate: cleaned } : t));
      try {
        await sheetFetch(config, null, { action: 'update-budget-date', hash, budgetDate: cleaned || '' });
        setSyncStatus({ kind: 'ok', message: cleaned ? 'Cycle override saved.' : 'Cycle override cleared.', when: new Date() });
      } catch (e) {
        setSyncStatus({ kind: 'err', message: 'Cycle override failed: ' + (e.message || String(e)), when: new Date() });
      }
    } else {
      setBudgetDateOverrides(o => {
        const n = { ...o };
        if (cleaned) n[hash] = cleaned;
        else         delete n[hash];
        return n;
      });
    }
  }

  async function handleUpdateSplits(hash, splits) {
    // splits is an array of {line, amount} or null/empty to clear.
    // In-history rows write straight to the Sheet. New (unposted) rows live
    // in local splitOverrides state and get serialised into Splits column
    // when the user clicks Post to history.
    const isInHistory = history.some(t => txHash(t) === hash);
    const cleaned = splits && splits.length ? splits : null;
    if (isInHistory) {
      setHistory(h => h.map(t => txHash(t) === hash ? { ...t, splits: cleaned } : t));
      try {
        await sheetFetch(config, null, { action: 'update-splits', hash, splits: serializeSplits(splits) });
        setSyncStatus({ kind: 'ok', message: cleaned ? 'Splits saved.' : 'Splits cleared.', when: new Date() });
      } catch (e) {
        setSyncStatus({ kind: 'err', message: 'Split update failed: ' + (e.message || String(e)), when: new Date() });
      }
    } else {
      // Local-only — staged until the row is posted to history.
      setSplitOverrides(o => {
        const n = { ...o };
        if (cleaned) n[hash] = cleaned;
        else         delete n[hash];
        return n;
      });
    }
  }

  async function handleSaveRules(newRules) {
    setLoading(true);
    setSyncStatus(null);
    try {
      const rows = newRules.map(r => ({ Line: r.line, Type: r.type, Value: r.value }));
      await sheetFetch(config, null, { action: 'save-rules', rows });
      setRules(newRules);
      cacheSnapshot({ rules: newRules });
      setSyncStatus({ kind: 'ok', message: 'Rules saved to Sheet.', when: new Date() });
    } catch (e) {
      setSyncStatus({ kind: 'err', message: e.message || String(e), when: new Date() });
    } finally {
      setLoading(false);
    }
  }

  const setOverride   = (hash, line) => setOverrides(o => ({ ...o, [hash]: line }));
  const clearOverride = (hash)       => setOverrides(o => { const n = { ...o }; delete n[hash]; return n; });

  const configured = !!(config.sheetUrl && config.sheetToken);

  return (
    <div className="min-h-screen text-stone-900">
      <header style={{ backgroundColor: '#1A2540' }} className="border-b border-stone-300">
        <div className="max-w-7xl mx-auto px-6 py-5 text-stone-100">
          <div className="flex items-baseline justify-between flex-wrap gap-3">
            <div>
              <h1 className="font-display text-2xl font-medium tracking-tight flex items-center gap-2"><span className="text-2xl leading-none">🪙</span>CapiTracker</h1>
              <p className="text-stone-400 text-xs mt-0.5 tracking-wide uppercase">To Keep The Budget Lekker</p>
            </div>
            <div className="text-right text-xs text-stone-300">
              {configured ? (
                <>
                  <div className="font-num">{history.length} in history · {newTxs.length} new · {allCycles.length} cycles</div>
                  <div className="text-stone-400">Anchor day {settings.anchorDay} · net <span className={privateMode ? 'blur-sm select-none' : ''}>R{(settings.netIncome || 0).toLocaleString('en-ZA')}</span></div>
                </>
              ) : <div className="text-stone-400">No Sheet connection yet</div>}
            </div>
          </div>
        </div>
      </header>

      {syncStatus && (
        <div className="max-w-7xl mx-auto px-6 pt-3">
          <div className={`text-xs px-3 py-2 flex items-center justify-between gap-2 border ${syncStatus.kind === 'err' ? 'bg-red-50 text-red-800 border-red-200' : 'bg-emerald-50 text-emerald-800 border-emerald-200'}`}>
            <div className="flex items-center gap-2">
              {syncStatus.kind === 'err' ? <IconAlert className="w-3.5 h-3.5" /> : <IconCheck className="w-3.5 h-3.5" />}
              <span>{syncStatus.message}</span>
              <span className="text-stone-500 font-num">{syncStatus.when ? syncStatus.when.toLocaleTimeString('en-ZA') : ''}</span>
            </div>
            <button onClick={() => setSyncStatus(null)} className="hover:opacity-70"><IconX className="w-3.5 h-3.5" /></button>
          </div>
        </div>
      )}

      <div className="max-w-7xl mx-auto px-6 pt-4">
        <Uploader
          onFiles={handleFiles}
          fileNames={fileNames}
          error={importError}
          clear={() => { setCsvRows([]); setFileNames([]); }}
          configured={configured}
          loading={loading}
          onSyncCsv={() => loadFromSheet({ pullMode: 'csv' })}
          onSyncPdf={() => loadFromSheet({ pullMode: 'pdf' })}
          onReload={() => loadFromSheet()}
        />
      </div>

      <div className="max-w-7xl mx-auto px-6 mt-6 border-b border-stone-300">
        <nav className="flex gap-1 flex-wrap">
          <TabBtn id="dashboard"    cur={tab} set={setTab} Icon={IconChart} label="Dashboard" />
          <TabBtn id="transactions" cur={tab} set={setTab} Icon={IconFile}  label={`Transactions${newTxs.length ? ` · ${newTxs.length} new` : ''}`} />
          <TabBtn id="rules"        cur={tab} set={setTab} Icon={IconList}  label="Rules" />
          <TabBtn id="budget"       cur={tab} set={setTab} Icon={IconCog}   label="Budget" />
          <TabBtn id="setup"        cur={tab} set={setTab} Icon={IconLink}  label={configured ? 'Setup' : 'Setup — start here'} />
        </nav>
      </div>

      <main className="max-w-7xl mx-auto px-6 py-7">
        {tab === 'dashboard'    && <Dashboard
                                      budget={budget}
                                      actuals={actuals}
                                      settings={settings}
                                      dateRange={dateRange}
                                      setDateRange={setDateRange}
                                      defaultRange={defaultRange}
                                      windowTxs={windowTxs}
                                      allCycles={allCycles}
                                      cycleActuals={cycleActuals}
                                      hasData={allTxs.length > 0}
                                      privateMode={privateMode}
                                      setPrivateMode={setPrivateMode}
                                    />}
        {tab === 'transactions' && <Transactions
                                      allTxs={allTxs}
                                      lineNames={lineNames}
                                      overrides={overrides}
                                      setOverride={setOverride}
                                      clearOverride={clearOverride}
                                      anchorDay={settings.anchorDay}
                                      onPostToHistory={handlePostToHistory}
                                      onEditHistoryLine={handleEditHistoryLine}
                                      onDeleteHistoryRow={handleDeleteHistoryRow}
                                      onUpdateSplits={handleUpdateSplits}
                                      onUpdateBudgetDate={handleUpdateBudgetDate}
                                      posting={loading}
                                      newCount={newTxs.length}
                                      newClassifiedCount={newClassified.length}
                                      stillNeedingReview={stillNeedingReview}
                                    />}
        {tab === 'rules'        && <RulesEditor
                                      rules={rules}
                                      lineNames={lineNames}
                                      onSave={handleSaveRules}
                                      saving={loading}
                                    />}
        {tab === 'budget'       && <BudgetEditor
                                      budget={budget}
                                      settings={settings}
                                      onSave={handleSaveBudget}
                                      saving={loading}
                                    />}
        {tab === 'setup'        && <SetupPanel
                                      config={config}
                                      setConfig={setConfig}
                                      onSync={() => loadFromSheet({ pull: true })}
                                      onReload={() => loadFromSheet()}
                                      loading={loading}
                                      hasData={allTxs.length > 0}
                                    />}
      </main>

      <footer className="max-w-7xl mx-auto px-6 pb-10 text-xs text-stone-500">
        Sheet is canonical. localStorage caches the last snapshot for offline view. Overrides live locally until you post to history.
      </footer>

      {/* Floating chat toggle + panel — opt-in to AI by setting GEMINI_API_KEY */}
      {configured && (
        <button
          onClick={() => setChatOpen(!chatOpen)}
          title="Ask CapiTracker AI about your budget"
          className="fixed bottom-5 right-5 w-12 h-12 rounded-full bg-slate-800 hover:bg-slate-700 text-white shadow-lg flex items-center justify-center z-40">
          <span className="text-xl leading-none">{chatOpen ? '×' : '💬'}</span>
        </button>
      )}
      {chatOpen && configured && (
        <ChatBot
          messages={chatMessages}
          sending={chatSending}
          scope={chatScope}
          setScope={setChatScope}
          onSend={handleChatSend}
          onClose={() => setChatOpen(false)}
          onClear={() => setChatMessages([])}
        />
      )}
    </div>
  );
}

/* ============================================================================
   ChatBot — slide-in panel that talks to the user's Gemini via Apps Script.
   Requires GEMINI_API_KEY set as a Script Property; if not set, the first
   send will surface a clear error.
   ========================================================================== */
function ChatBot({ messages, sending, scope, setScope, onSend, onClose, onClear }) {
  const [input, setInput] = useState('');
  const listRef = React.useRef(null);

  // Auto-scroll to the latest message
  useEffect(() => {
    if (listRef.current) listRef.current.scrollTop = listRef.current.scrollHeight;
  }, [messages, sending]);

  const submit = () => {
    if (!input.trim() || sending) return;
    onSend(input);
    setInput('');
  };

  const scopeLabels = {
    'window':  'This cycle',
    'last30':  'Last 30 days',
    'last90':  'Last 90 days',
    'all':     'All history',
  };

  const suggested = [
    "How much have I spent on Eating Out this cycle?",
    "What's my biggest expense this cycle?",
    "Am I on track with my budget?",
    "Which budget lines am I over on?",
  ];

  return (
    <div className="fixed bottom-20 right-5 w-96 max-w-[calc(100vw-2.5rem)] bg-white border border-stone-300 rounded-sm shadow-xl z-40 flex flex-col"
         style={{ maxHeight: 'calc(100vh - 7rem)' }}>
      <div className="px-4 py-2.5 border-b border-stone-200 bg-slate-800 text-stone-100">
        <div className="flex items-center justify-between mb-1.5">
          <div>
            <div className="font-display text-sm">🪙 CapiTracker AI</div>
            <div className="text-[10px] text-stone-400">Asks Gemini using your transactions as context</div>
          </div>
          <div className="flex items-center gap-2">
            {messages.length > 0 && (
              <button onClick={onClear} className="text-[10px] uppercase tracking-wider text-stone-400 hover:text-stone-100">Clear</button>
            )}
            <button onClick={onClose} className="text-stone-400 hover:text-stone-100 text-xl leading-none px-1">×</button>
          </div>
        </div>
        <div className="flex items-center gap-2">
          <span className="text-[10px] uppercase tracking-wider text-stone-400">Scope:</span>
          <select value={scope} onChange={e => setScope(e.target.value)}
                  className="text-xs bg-slate-700 border border-slate-600 text-stone-100 px-2 py-0.5">
            {Object.entries(scopeLabels).map(([v, label]) => (
              <option key={v} value={v}>{label}</option>
            ))}
          </select>
        </div>
      </div>

      <div ref={listRef} className="flex-1 overflow-y-auto px-4 py-3 space-y-3" style={{ minHeight: '20rem' }}>
        {messages.length === 0 && (
          <div className="text-xs text-stone-500 space-y-2">
            <div>Ask anything about your budget. Examples:</div>
            <div className="flex flex-col gap-1.5">
              {suggested.map((s, i) => (
                <button key={i} onClick={() => onSend(s)}
                        className="text-left px-2 py-1.5 border border-stone-200 hover:bg-stone-50 text-stone-700 text-xs rounded-sm">
                  {s}
                </button>
              ))}
            </div>
            <div className="text-[10px] text-stone-400 pt-2 border-t border-stone-100">
              Privacy: your transactions are sent to Google's Gemini API for each question. No training, 30-day retention then deletion. Disable by removing GEMINI_API_KEY from Script Properties.
            </div>
          </div>
        )}
        {messages.map((m, i) => (
          <div key={i} className={m.role === 'user' ? 'flex justify-end' : 'flex justify-start'}>
            <div className={`max-w-[85%] px-3 py-2 text-sm rounded-sm whitespace-pre-wrap ${
              m.role === 'user' ? 'bg-slate-800 text-stone-100'
              : m.error ? 'bg-red-50 text-red-800 border border-red-200'
              : 'bg-stone-100 text-stone-800'
            }`}>
              {m.text}
            </div>
          </div>
        ))}
        {sending && (
          <div className="flex justify-start">
            <div className="bg-stone-100 text-stone-500 text-xs px-3 py-2 italic">Thinking…</div>
          </div>
        )}
      </div>

      <div className="px-3 py-2 border-t border-stone-200 flex items-center gap-2">
        <input
          value={input}
          onChange={e => setInput(e.target.value)}
          onKeyDown={e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submit(); } }}
          placeholder="Ask about your budget…"
          disabled={sending}
          className="flex-1 px-2 py-1.5 border border-stone-300 text-sm disabled:opacity-50"
        />
        <button onClick={submit} disabled={sending || !input.trim()}
                className="px-3 py-1.5 text-xs uppercase tracking-wider font-medium border border-slate-800 bg-slate-800 text-white hover:bg-slate-700 disabled:opacity-50">
          Send
        </button>
      </div>
    </div>
  );
}

/* ============================================================================
   Components
   ========================================================================== */
function Uploader({ onFiles, fileNames, error, clear, configured, loading, onSyncCsv, onSyncPdf, onReload }) {
  const [hover, setHover] = useState(false);
  return (
    <div
      onDragOver={e => { e.preventDefault(); setHover(true); }}
      onDragLeave={() => setHover(false)}
      onDrop={e => { e.preventDefault(); setHover(false); onFiles(e.dataTransfer.files); }}
      className={`border-2 border-dashed rounded-sm px-5 py-3 transition-colors ${hover ? 'border-slate-700 bg-stone-100' : 'border-stone-300 bg-white'}`}>
      <div className="flex items-center justify-between flex-wrap gap-3">
        <div className="flex items-center gap-3">
          <IconUpload className="w-5 h-5 text-slate-700" />
          <div>
            <div className="text-sm font-medium">CSV import (manual fallback)</div>
            <div className="text-xs text-stone-500">Sheet is the primary path. Drop a Capitec CSV here if you need to bring in transactions out-of-band.</div>
          </div>
        </div>
        <div className="flex items-center gap-2">
          {configured && (
            <>
              <button onClick={onSyncCsv} disabled={loading}
                      title="Pull CSV statements you've forwarded to Gmail. Fast (~5s)."
                      className="px-2.5 py-1 text-xs uppercase tracking-wider font-medium border border-slate-800 text-slate-800 hover:bg-slate-800 hover:text-stone-50 disabled:opacity-50 flex items-center gap-1.5">
                <IconRefresh className={`w-3.5 h-3.5 ${loading ? 'animate-spin' : ''}`} />Sync CSV
              </button>
              <button onClick={() => { if (confirm('PDF parsing via Gemini takes ~3 min per statement. Go make a coffee ☕')) onSyncPdf(); }} disabled={loading}
                      title="Parse Capitec PDF statements via Gemini AI. Slow (~3 min per PDF) — needs GEMINI_API_KEY set in Apps Script."
                      className="px-2.5 py-1 text-xs uppercase tracking-wider font-medium border border-indigo-700 text-indigo-700 hover:bg-indigo-700 hover:text-stone-50 disabled:opacity-50 flex items-center gap-1.5">
                <IconRefresh className={`w-3.5 h-3.5 ${loading ? 'animate-spin' : ''}`} />Sync PDF (AI)
              </button>
              <button onClick={onReload} disabled={loading} className="px-2.5 py-1 text-xs uppercase tracking-wider font-medium border border-stone-300 text-stone-700 hover:bg-stone-100 disabled:opacity-50">
                Reload sheet
              </button>
            </>
          )}
          <label className="cursor-pointer inline-block px-2.5 py-1 text-xs uppercase tracking-wider font-medium border border-stone-300 text-stone-700 hover:bg-stone-100">
            Drop CSV
            <input type="file" multiple accept=".csv" className="hidden" onChange={e => onFiles(e.target.files)} />
          </label>
          {fileNames.length > 0 && <button onClick={clear} className="text-xs text-stone-500 hover:text-stone-900 underline">clear</button>}
        </div>
      </div>
      {fileNames.length > 0 && (
        <div className="mt-2 flex flex-wrap gap-2">
          {fileNames.map((n, i) => <span key={i} className="text-xs px-2 py-0.5 bg-stone-100 border border-stone-200 font-num text-stone-700">{n}</span>)}
        </div>
      )}
      {error && <div className="mt-2 text-xs text-red-700 flex items-center gap-1.5"><IconAlert className="w-3.5 h-3.5"/>{error}</div>}
    </div>
  );
}

function TabBtn({ id, cur, set, Icon, label }) {
  const on = cur === id;
  return (
    <button onClick={() => set(id)}
      className={`px-4 py-2.5 text-xs uppercase tracking-wider font-medium flex items-center gap-2 border-b-2 -mb-px transition-colors ${on ? 'border-slate-900 text-slate-900' : 'border-transparent text-stone-500 hover:text-stone-900'}`}>
      <Icon className="w-3.5 h-3.5" />{label}
    </button>
  );
}

function EmptyState({ hint }) {
  return (
    <div className="bg-white border border-stone-300 rounded-sm p-12 text-center">
      <IconUpload className="w-8 h-8 mx-auto text-stone-400 mb-3" />
      <h2 className="font-display text-lg">No data yet</h2>
      <p className="text-sm text-stone-500 mt-1">{hint || 'Configure your Sheet in Setup, or drop a CSV to start.'}</p>
    </div>
  );
}

function KPI({ label, value, sub, tone, blurred }) {
  const colour = tone === 'over' ? 'text-red-700' : tone === 'under' ? 'text-emerald-700' : 'text-stone-900';
  const blurClass    = blurred ? 'blur-md select-none transition-all duration-200' : 'transition-all duration-200';
  const blurClassSub = blurred ? 'blur-sm select-none transition-all duration-200' : 'transition-all duration-200';
  return (
    <div className="bg-white border border-stone-300 rounded-sm p-4">
      <div className="text-xs uppercase tracking-wider text-stone-500">{label}</div>
      <div className={`font-num text-2xl mt-1 ${colour} ${blurClass}`}>{fmt(value)}</div>
      {sub && <div className={`text-xs text-stone-500 mt-1 ${blurClassSub}`}>{sub}</div>}
    </div>
  );
}

function StatusPill({ status }) {
  if (status === 'OVER')     return <span className="inline-block px-2 py-0.5 text-xs uppercase tracking-wider bg-red-50 text-red-800 border border-red-200">over</span>;
  if (status === 'under')    return <span className="inline-block px-2 py-0.5 text-xs uppercase tracking-wider bg-emerald-50 text-emerald-800 border border-emerald-200">under</span>;
  if (status === 'on track') return <span className="inline-block px-2 py-0.5 text-xs uppercase tracking-wider bg-stone-100 text-stone-700 border border-stone-200">on track</span>;
  return <span className="text-stone-400 text-xs">—</span>;
}

function Field({ label, children }) {
  return <div className="flex flex-col gap-1"><span className="text-xs uppercase tracking-wider text-stone-500">{label}</span>{children}</div>;
}

/* ============================================================================
   Dashboard
   ========================================================================== */
function Dashboard({ budget, actuals, settings, dateRange, setDateRange, defaultRange, windowTxs, allCycles, cycleActuals, hasData, privateMode, setPrivateMode }) {
  if (!hasData) return <EmptyState />;

  const stepCycle = (dir) => {
    const cur = parseISO(dateRange.from);
    if (!cur) return;
    const newStart = new Date(cur.getFullYear(), cur.getMonth() + dir, cur.getDate());
    const newEndExcl = new Date(newStart.getFullYear(), newStart.getMonth() + 1, newStart.getDate());
    const newEndIncl = new Date(newEndExcl);
    newEndIncl.setDate(newEndIncl.getDate() - 1);
    setDateRange({ from: toISO(newStart), to: toISO(newEndIncl) });
  };

  const totalBudget = budget.reduce((s, b) => s + b.amount, 0);
  const totalActual = budget.filter(b => b.line !== 'Reimbursable').reduce((s, b) => s + (actuals[b.line] || 0), 0);
  const gap         = settings.netIncome - totalActual;
  const budgetGap   = settings.netIncome - totalBudget;

  // Running watch — user picks any budget line; falls back gracefully if the
  // saved line no longer exists (e.g. user renamed/removed it).
  const budgetLineNames = budget.map(b => b.line);
  const [storedWatchLine, _setWatchLine] = useState(() => loadLS(K.watchLine, null));
  const setWatchLine = (v) => { _setWatchLine(v); saveLS(K.watchLine, v); };
  const watchLine = budgetLineNames.includes(storedWatchLine)
    ? storedWatchLine
    : (budgetLineNames.includes('Bok Fonds') ? 'Bok Fonds' : (budgetLineNames[0] || ''));
  // Build the watched-line activity list. Spends (negative) add to the running
  // total; credits/income (positive) subtract. Split rows contribute only their
  // portion of the watched line, with the row's sign preserved.
  const watchTx = windowTxs.flatMap(t => {
    if (!t.amount) return [];
    if (t.splits && t.splits.length) {
      const match = t.splits.find(s => s.line === watchLine);
      if (!match) return [];
      const signed = t.amount < 0 ? -Math.abs(match.amount) : Math.abs(match.amount);
      return [{ ...t, amount: signed, description: `${t.description} (split)` }];
    }
    return t.line === watchLine ? [t] : [];
  }).sort((a, b) => effectiveDate(a).localeCompare(effectiveDate(b)));
  const watchBudget = budget.find(b => b.line === watchLine)?.amount || 0;
  let watchRun = 0;
  const watchWithRun = watchTx.map(t => { watchRun -= t.amount; return { ...t, running: watchRun }; });

  return (
    <div className="space-y-6">
      <div className="bg-white border border-stone-300 rounded-sm p-4 flex items-center gap-3 flex-wrap">
        <div className="text-xs uppercase tracking-wider text-stone-500">Window</div>
        <input type="date" value={dateRange.from} onChange={e => setDateRange({ ...dateRange, from: e.target.value })} className="px-2 py-1 border border-stone-300 text-sm font-num" />
        <span className="text-stone-400">→</span>
        <input type="date" value={dateRange.to} onChange={e => setDateRange({ ...dateRange, to: e.target.value })} className="px-2 py-1 border border-stone-300 text-sm font-num" />
        <div className="flex items-center gap-1 ml-2">
          <button onClick={() => stepCycle(-1)} className="px-2 py-1 text-xs border border-stone-300 hover:bg-stone-100">← prev cycle</button>
          <button onClick={() => setDateRange(defaultRange)} className="px-2 py-1 text-xs border border-stone-300 hover:bg-stone-100">current</button>
          <button onClick={() => stepCycle(1)} className="px-2 py-1 text-xs border border-stone-300 hover:bg-stone-100">next cycle →</button>
        </div>
        <div className="ml-auto flex items-center gap-3">
          <span className="text-xs text-stone-500">{windowTxs.length} txs · anchor day {settings.anchorDay}</span>
          <button
            onClick={() => setPrivateMode(!privateMode)}
            title={privateMode ? 'Show amounts' : 'Hide amounts'}
            className="p-1.5 border border-stone-300 text-stone-600 hover:bg-stone-100 hover:text-stone-900">
            {privateMode ? <IconEyeOff className="w-4 h-4" /> : <IconEye className="w-4 h-4" />}
          </button>
        </div>
      </div>

      <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
        <KPI label="Net income"            value={settings.netIncome} tone="neutral"                                                              blurred={privateMode} />
        <KPI label="Budgeted spend"        value={totalBudget}        tone="neutral" sub={`Surplus on paper: ${fmtSigned(budgetGap)}`}            blurred={privateMode} />
        <KPI label="Actual spend (window)" value={totalActual}        tone={totalActual > totalBudget ? 'over' : 'under'} sub={`${prettyDate(dateRange.from)} → ${prettyDate(dateRange.to)}`} blurred={privateMode} />
        <KPI label="Real gap"              value={gap}                tone={gap < 0 ? 'over' : 'under'} sub={gap < 0 ? 'spending exceeds income' : 'within income'}                              blurred={privateMode} />
      </div>

      <div className="bg-white border border-stone-300 rounded-sm overflow-hidden">
        <div className="px-5 py-3 border-b border-stone-200 flex items-center justify-between">
          <h2 className="font-display text-lg">Budget vs Actual (selected window)</h2>
          <div className="text-xs text-stone-500">{prettyDate(dateRange.from)} → {prettyDate(dateRange.to)}</div>
        </div>
        <table className="w-full text-sm">
          <thead>
            <tr className="text-xs uppercase tracking-wider text-stone-500 border-b border-stone-200">
              <th className="text-left px-5 py-2 font-medium">Line</th>
              <th className="text-right px-3 py-2 font-medium">Budget</th>
              <th className="text-right px-3 py-2 font-medium">Actual</th>
              <th className="text-right px-3 py-2 font-medium">Variance</th>
              <th className="text-right px-3 py-2 font-medium">%</th>
              <th className="text-center px-5 py-2 font-medium">Status</th>
            </tr>
          </thead>
          <tbody>
            {budget.map(b => {
              const act = actuals[b.line] || 0;
              const variance = b.amount - act;
              const pct = b.amount > 0 ? (act / b.amount) : 0;
              let status = '—';
              if (b.amount > 0) {
                if (act > b.amount * 1.05) status = 'OVER';
                else if (act < b.amount * 0.95) status = 'under';
                else status = 'on track';
              }
              return (
                <tr key={b.line} className="border-b border-stone-100 hover:bg-stone-50">
                  <td className="px-5 py-2">{b.line}</td>
                  <td className="px-3 py-2 text-right font-num text-stone-700">{fmt(b.amount)}</td>
                  <td className="px-3 py-2 text-right font-num">{fmt(act)}</td>
                  <td className={`px-3 py-2 text-right font-num ${variance < 0 ? 'text-red-700' : 'text-stone-700'}`}>{fmtSigned(variance)}</td>
                  <td className="px-3 py-2 text-right font-num text-stone-500 text-xs">{b.amount > 0 ? `${(pct * 100).toFixed(0)}%` : '–'}</td>
                  <td className="px-5 py-2 text-center"><StatusPill status={status} /></td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>

      {allCycles.length > 1 && (
        <div className="bg-white border border-stone-300 rounded-sm overflow-hidden">
          <div className="px-5 py-3 border-b border-stone-200 flex items-center justify-between">
            <h2 className="font-display text-lg">By cycle</h2>
            <div className="text-xs text-stone-500">Pay-cycle totals (anchor day {settings.anchorDay})</div>
          </div>
          <div className="overflow-x-auto">
            <table className="w-full text-sm">
              <thead>
                <tr className="text-xs uppercase tracking-wider text-stone-500 border-b border-stone-200">
                  <th className="text-left px-5 py-2 font-medium">Line</th>
                  {allCycles.map(c => <th key={c} className="text-right px-3 py-2 font-medium whitespace-nowrap">{prettyCycle(c, settings.anchorDay)}</th>)}
                </tr>
              </thead>
              <tbody>
                {budget.map(b => (
                  <tr key={b.line} className="border-b border-stone-100">
                    <td className="px-5 py-1.5">{b.line}</td>
                    {allCycles.map(c => (
                      <td key={c} className="px-3 py-1.5 text-right font-num">
                        {fmt(cycleActuals[c]?.[b.line] || 0)}
                      </td>
                    ))}
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      )}

      {watchLine && (
        <div className="bg-white border border-stone-300 rounded-sm overflow-hidden">
          <div className="px-5 py-3 border-b border-stone-200 flex items-start gap-3 flex-wrap">
            <div className="min-w-0">
              <h2 className="font-display text-lg">Running watch</h2>
              <div className="text-xs text-stone-500 mt-0.5">
                Track running spend for one budget line.
                {watchBudget > 0 && <> Red row = running total has passed R{watchBudget.toLocaleString()} for the selected window.</>}
              </div>
            </div>
            <div className="ml-auto flex items-center gap-2">
              <label className="text-xs uppercase tracking-wider text-stone-500">Line</label>
              <select
                value={watchLine}
                onChange={e => setWatchLine(e.target.value)}
                className="px-2 py-1 border border-stone-300 text-sm bg-white">
                {budget.map(b => (
                  <option key={b.line} value={b.line}>{b.line}</option>
                ))}
              </select>
            </div>
          </div>
          {watchWithRun.length === 0 ? (
            <div className="px-5 py-8 text-center text-sm text-stone-500">
              No transactions tagged to <span className="font-medium text-stone-700">{watchLine}</span> in this cycle yet.
            </div>
          ) : (
            <div className="max-h-96 overflow-y-auto">
              <table className="w-full text-sm">
                <thead className="sticky top-0 bg-white">
                  <tr className="text-xs uppercase tracking-wider text-stone-500 border-b border-stone-200">
                    <th className="text-left px-5 py-2 font-medium">Date</th>
                    <th className="text-left px-3 py-2 font-medium">Description</th>
                    <th className="text-right px-3 py-2 font-medium">Amount</th>
                    <th className="text-right px-5 py-2 font-medium">Running</th>
                  </tr>
                </thead>
                <tbody>
                  {watchWithRun.map((t, i) => {
                    const over   = watchBudget > 0 && t.running > watchBudget;
                    const credit = t.amount > 0;
                    return (
                      <tr key={t.hash || i} className={`border-b border-stone-100 ${over ? 'bg-red-50' : ''}`}>
                        <td className="px-5 py-1.5 font-num text-stone-600 text-xs">{effectiveDate(t)}</td>
                        <td className="px-3 py-1.5 truncate max-w-md">{t.description}</td>
                        <td className={`px-3 py-1.5 text-right font-num ${credit ? 'text-emerald-700' : 'text-stone-900'}`}>
                          {credit ? '−' : ''}{fmt(Math.abs(t.amount))}
                        </td>
                        <td className={`px-5 py-1.5 text-right font-num font-medium ${over ? 'text-red-700' : ''}`}>{fmt(t.running)}</td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

/* ============================================================================
   Transactions
   ========================================================================== */
function Transactions({ allTxs, lineNames, overrides, setOverride, clearOverride, anchorDay, onPostToHistory, onEditHistoryLine, onDeleteHistoryRow, onUpdateSplits, onUpdateBudgetDate, posting, newCount, newClassifiedCount, stillNeedingReview }) {
  const [filterLine, setFL]     = useState('');
  const [filterCycle, setFC]    = useState('');
  const [filterStatus, setFS]   = useState('');
  const [search, setSearch]     = useState('');
  const [selected, setSelected] = useState(() => new Set());
  const [bulkLine, setBulkLine] = useState('');
  const [splitModalTx, setSplitModalTx] = useState(null);
  const [cycleEditorTx, setCycleEditorTx] = useState(null);

  const cycles = useMemo(() => {
    const s = new Set();
    for (const t of allTxs) if (t.date) s.add(cycleKey(t.date, anchorDay));
    return Array.from(s).sort().reverse();
  }, [allTxs, anchorDay]);

  const filtered = useMemo(() => allTxs
    .filter(t => !filterLine   || t.line === filterLine)
    .filter(t => !filterCycle  || cycleKey(t.date, anchorDay) === filterCycle)
    .filter(t => !filterStatus || (filterStatus === 'new' && !t.inHistory) || (filterStatus === 'history' && t.inHistory))
    .filter(t => !search       || (t.description || '').toLowerCase().includes(search.toLowerCase()) || (t.originalDesc || '').toLowerCase().includes(search.toLowerCase())),
    [allTxs, filterLine, filterCycle, filterStatus, search, anchorDay]);

  // Bulk-select helpers — operate on the *visible* (after-filter, after-slice) set
  const visible = filtered.slice(0, 500);
  const visibleHashes = visible.map(t => t.hash);
  const allVisibleSelected = visible.length > 0 && visibleHashes.every(h => selected.has(h));
  const someVisibleSelected = visibleHashes.some(h => selected.has(h));
  const selectedInHistoryCount = useMemo(
    () => allTxs.reduce((n, t) => n + (selected.has(t.hash) && t.inHistory ? 1 : 0), 0),
    [allTxs, selected]
  );

  const toggleOne = (hash) => {
    const next = new Set(selected);
    if (next.has(hash)) next.delete(hash); else next.add(hash);
    setSelected(next);
  };
  const toggleAllVisible = () => {
    const next = new Set(selected);
    if (allVisibleSelected) visibleHashes.forEach(h => next.delete(h));
    else                    visibleHashes.forEach(h => next.add(h));
    setSelected(next);
  };
  const clearSelection = () => setSelected(new Set());

  const applyBulkLine = () => {
    if (!bulkLine || !selected.size) return;
    for (const t of allTxs) {
      if (!selected.has(t.hash)) continue;
      if (t.inHistory) onEditHistoryLine(t.hash, bulkLine);
      else             setOverride(t.hash, bulkLine);
    }
    setSelected(new Set());
    setBulkLine('');
  };

  const deleteSelectedFromHistory = () => {
    if (!selectedInHistoryCount) return;
    if (!confirm(`Delete ${selectedInHistoryCount} row${selectedInHistoryCount === 1 ? '' : 's'} from history? This removes them from your Google Sheet.`)) return;
    for (const t of allTxs) {
      if (selected.has(t.hash) && t.inHistory) onDeleteHistoryRow(t.hash);
    }
    setSelected(new Set());
  };

  if (!allTxs.length) return <EmptyState />;

  return (
    <div className="space-y-4">
      <div className="bg-white border border-stone-300 rounded-sm p-4 flex items-center gap-3 flex-wrap">
        <button
          onClick={onPostToHistory}
          disabled={posting || newClassifiedCount === 0}
          className={`px-4 py-2 text-xs uppercase tracking-wider font-medium border flex items-center gap-1.5 ${newClassifiedCount > 0 && !posting ? 'border-slate-800 bg-slate-800 text-white hover:bg-slate-700' : 'border-stone-300 text-stone-400 cursor-not-allowed'}`}>
          <IconUpload className="w-3.5 h-3.5" />
          {posting ? 'Posting…' : `Post ${newClassifiedCount} classified row${newClassifiedCount === 1 ? '' : 's'} to history`}
        </button>
        <div className="text-xs text-stone-600">
          {newCount === 0
            ? 'Nothing new — everything visible is already in history.'
            : stillNeedingReview > 0
              ? <>still <span className="text-amber-700 font-medium">{stillNeedingReview}</span> tagged "Review" — classify them before posting</>
              : <>all {newClassifiedCount} new rows ready to post</>}
        </div>
      </div>

      <div className="bg-white border border-stone-300 rounded-sm overflow-hidden">
        <div className="px-5 py-3 border-b border-stone-200 flex items-center justify-between flex-wrap gap-2">
          <h2 className="font-display text-lg">Transactions</h2>
          <div className="flex items-center gap-2 flex-wrap text-xs">
            <input value={search} onChange={e => setSearch(e.target.value)} placeholder="Search description…" className="px-2 py-1 border border-stone-300 text-sm w-44" />
            <select value={filterCycle} onChange={e => setFC(e.target.value)} className="px-2 py-1 border border-stone-300 text-sm">
              <option value="">All cycles</option>{cycles.map(c => <option key={c} value={c}>{prettyCycle(c, anchorDay)}</option>)}
            </select>
            <select value={filterLine} onChange={e => setFL(e.target.value)} className="px-2 py-1 border border-stone-300 text-sm">
              <option value="">All lines</option>{lineNames.map(l => <option key={l}>{l}</option>)}
            </select>
            <select value={filterStatus} onChange={e => setFS(e.target.value)} className="px-2 py-1 border border-stone-300 text-sm">
              <option value="">All status</option>
              <option value="new">New (not posted)</option>
              <option value="history">In history</option>
            </select>
            <span className="text-stone-500 font-num">{filtered.length} of {allTxs.length}</span>
          </div>
        </div>
        {selected.size > 0 && (
          <div className="px-5 py-3 border-b border-stone-200 bg-amber-50 flex items-center gap-3 flex-wrap">
            <span className="text-xs font-medium text-stone-800">{selected.size} selected</span>
            <div className="flex items-center gap-2">
              <span className="text-xs uppercase tracking-wider text-stone-500">Apply line:</span>
              <select value={bulkLine} onChange={e => setBulkLine(e.target.value)} className="px-2 py-1 border border-stone-300 text-sm bg-white">
                <option value="">— pick a line —</option>
                {lineNames.map(l => <option key={l} value={l}>{l}</option>)}
                <option value="Salary">Salary</option>
                <option value="Other Income">Other Income</option>
              </select>
              <button onClick={applyBulkLine} disabled={!bulkLine}
                      className={`px-3 py-1 text-xs uppercase tracking-wider font-medium border ${bulkLine ? 'border-slate-800 bg-slate-800 text-white hover:bg-slate-700' : 'border-stone-300 text-stone-400 cursor-not-allowed'}`}>
                Apply
              </button>
            </div>
            {selectedInHistoryCount > 0 && (
              <button onClick={deleteSelectedFromHistory}
                      className="px-3 py-1 text-xs uppercase tracking-wider font-medium border border-red-300 text-red-700 hover:bg-red-50 flex items-center gap-1.5">
                <IconTrash className="w-3.5 h-3.5" />
                Delete {selectedInHistoryCount} from history
              </button>
            )}
            <button onClick={clearSelection} className="ml-auto px-3 py-1 text-xs uppercase tracking-wider text-stone-500 hover:text-stone-900">
              Clear
            </button>
          </div>
        )}
        <div className="overflow-x-auto" style={{ maxHeight: '70vh', overflowY: 'auto' }}>
          <table className="w-full text-sm">
            <thead className="sticky top-0 bg-white z-10">
              <tr className="text-xs uppercase tracking-wider text-stone-500 border-b border-stone-200">

                        const effCycle = cycleKey(effectiveDate(t), anchorDay);

                          <button onClick={() => setCycleEditorTx(t)}

                    <td className="px-3 py-1.5 text-xs text-stone-500">{t.bankCategory}</td>

                    <td className="px-5 py-1.5">

                                    title={t.splits.map(s => `${s.line}: R${Math.abs(s.amount).toLocaleString('en-ZA')}`).join('\n') + '\n\nClick to edit'}>

          tx={cycleEditorTx}

    </div>
  );
}

/* ============================================================================
   Cycle editor — move a transaction into a different pay cycle without
   touching its actual Posting Date. Internally we store a Budget Date in
   the picked cycle so all the existing date-based math keeps working.
   ========================================================================== */
function CycleEditor({ tx, anchorDay, onClose, onSave }) {
  const naturalCycleStart = cycleKey(tx.date, anchorDay);
  const currentCycleStart = cycleKey(effectiveDate(tx), anchorDay);
  const prevCycleStart    = shiftCycle(naturalCycleStart, -1);
  const nextCycleStart    = shiftCycle(naturalCycleStart, 1);
  const hasOverride       = !!tx.budgetDate;

  const optionClass = (isSelected) =>
    `w-full text-left px-3 py-2 border text-sm hover:bg-stone-50 ${
      isSelected ? 'border-indigo-400 bg-indigo-50' : 'border-stone-300'
    }`;

  return (
    <div className="fixed inset-0 bg-black/40 flex items-center justify-center z-50 p-4" onClick={onClose}>
      <div className="bg-white rounded-sm shadow-xl border border-stone-300 max-w-sm w-full" onClick={e => e.stopPropagation()}>
        <div className="px-5 py-3 border-b border-stone-200 flex items-center justify-between">
          <h3 className="font-display text-lg">Move to cycle</h3>
          <button onClick={onClose} className="text-stone-400 hover:text-stone-900"><IconX className="w-4 h-4" /></button>
        </div>
        <div className="px-5 py-4">
          <div className="text-xs text-stone-500 mb-1">{tx.date}</div>
          <div className="text-sm text-stone-700 mb-3 truncate">{tx.description}</div>
          <div className="text-xs text-stone-500 mb-3">
            Currently counts toward: <span className="font-medium text-stone-800">{prettyCycle(currentCycleStart, anchorDay)}</span>
          </div>

          <div className="space-y-2">
            <button onClick={() => onSave(prevCycleStart)}
                    className={optionClass(currentCycleStart === prevCycleStart)}>
              <div className="flex items-center justify-between gap-3">
                <span>← Previous cycle</span>
                <span className="text-xs text-stone-500 font-num">{prettyCycle(prevCycleStart, anchorDay)}</span>
              </div>
            </button>
            <button onClick={() => onSave(null)}
                    className={optionClass(!hasOverride)}>
              <div className="flex items-center justify-between gap-3">
                <span>Default <span className="text-stone-500 text-xs">(by actual date)</span></span>
                <span className="text-xs text-stone-500 font-num">{prettyCycle(naturalCycleStart, anchorDay)}</span>
              </div>
            </button>
            <button onClick={() => onSave(nextCycleStart)}
                    className={optionClass(currentCycleStart === nextCycleStart)}>
              <div className="flex items-center justify-between gap-3">
                <span>Next cycle →</span>
                <span className="text-xs text-stone-500 font-num">{prettyCycle(nextCycleStart, anchorDay)}</span>
              </div>
            </button>
          </div>

          <p className="text-[11px] text-stone-500 mt-3 leading-relaxed">
            The transaction's actual Posting Date never changes. We just remap which pay cycle it counts toward in budgets and dashboards.
          </p>
        </div>
      </div>
    </div>
  );
}

/* ============================================================================
   Split modal — break a single transaction's amount across N budget lines.
   ========================================================================== */
function SplitModal({ tx, lineNames, onClose, onSave }) {
  const totalAbs = Math.abs(tx.amount);
  const [draft, setDraft] = useState(() => {
    if (tx.splits && tx.splits.length) {
      return tx.splits.map(s => ({ line: s.line, amount: String(Math.abs(s.amount)) }));
    }
    // Default scaffold: two empty rows, the first preselects the current line.
    return [
      { line: tx.line && lineNames.includes(tx.line) ? tx.line : (lineNames[0] || ''), amount: '' },
      { line: '', amount: '' },
    ];
  });

  const updateRow = (i, field, value) => setDraft(draft.map((d, j) => j === i ? { ...d, [field]: value } : d));
  const addRow    = ()              => setDraft([...draft, { line: lineNames[0] || '', amount: '' }]);
  const removeRow = (i)             => setDraft(draft.filter((_, j) => j !== i));

  const draftSum  = draft.reduce((s, d) => s + (Math.abs(Number(d.amount)) || 0), 0);
  const remaining = totalAbs - draftSum;
  const isBalanced = Math.abs(remaining) < 0.005;
  const validRows = draft.filter(d => d.line && Number(d.amount) > 0);
  const canSave   = isBalanced && validRows.length >= 1;
  const hadSplits = !!(tx.splits && tx.splits.length);

  return (
    <div className="fixed inset-0 bg-black/40 flex items-center justify-center z-50 p-4" onClick={onClose}>
      <div className="bg-white rounded-sm shadow-xl border border-stone-300 max-w-lg w-full" onClick={e => e.stopPropagation()}>
        <div className="px-5 py-3 border-b border-stone-200 flex items-center justify-between">
          <h3 className="font-display text-lg">Split transaction</h3>
          <button onClick={onClose} className="text-stone-400 hover:text-stone-900"><IconX className="w-4 h-4" /></button>
        </div>
        <div className="px-5 py-4">
          <div className="text-xs text-stone-500 uppercase tracking-wider mb-1">{tx.date}</div>
          <div className="text-sm text-stone-700 mb-1 truncate">{tx.description}</div>
          <div className="font-num text-2xl mb-4">R{totalAbs.toLocaleString('en-ZA', { maximumFractionDigits: 2 })}</div>

          <div className="space-y-2 mb-3">
            {draft.map((d, i) => (
              <div key={i} className="flex items-center gap-2">
                <select value={d.line} onChange={e => updateRow(i, 'line', e.target.value)}
                        className="px-2 py-1.5 border border-stone-300 text-sm bg-white flex-1">
                  <option value="">— pick a line —</option>
                  {lineNames.map(l => <option key={l} value={l}>{l}</option>)}
                </select>
                <input type="number" step="0.01" value={d.amount}
                       onChange={e => updateRow(i, 'amount', e.target.value)}
                       placeholder="0.00"
                       className="px-2 py-1.5 border border-stone-300 text-sm font-num w-28 text-right" />
                <button onClick={() => removeRow(i)} disabled={draft.length <= 1}
                        className="text-stone-400 hover:text-red-700 disabled:opacity-30 disabled:cursor-not-allowed" title="Remove this split">
                  <IconX className="w-4 h-4" />
                </button>
              </div>
            ))}
          </div>

          <button onClick={addRow}
                  className="text-xs uppercase tracking-wider text-stone-600 hover:text-stone-900 flex items-center gap-1.5 mb-4">
            <IconPlus className="w-3.5 h-3.5" /> Add another split
          </button>

          <div className={`text-sm font-num px-3 py-2 border ${isBalanced ? 'bg-emerald-50 text-emerald-800 border-emerald-200' : 'bg-amber-50 text-amber-800 border-amber-200'}`}>
            {isBalanced
              ? <>✓ Balanced — splits total R{draftSum.toLocaleString('en-ZA', { maximumFractionDigits: 2 })}</>
              : remaining > 0
                ? <>Still <strong>R{remaining.toLocaleString('en-ZA', { maximumFractionDigits: 2 })}</strong> unallocated</>
                : <>Over by <strong>R{Math.abs(remaining).toLocaleString('en-ZA', { maximumFractionDigits: 2 })}</strong></>}
          </div>
        </div>
        <div className="px-5 py-3 border-t border-stone-200 flex items-center gap-2 flex-wrap">
          {hadSplits && (
            <button onClick={() => { if (confirm('Clear all splits and revert this transaction to its single budget line?')) onSave([]); }}
                    className="px-3 py-1.5 text-xs uppercase tracking-wider font-medium border border-stone-300 text-stone-600 hover:bg-stone-100">
              Clear splits
            </button>
          )}
          <button onClick={onClose}
                  className="ml-auto px-3 py-1.5 text-xs uppercase tracking-wider text-stone-500 hover:text-stone-900">
            Cancel
          </button>
          <button onClick={() => canSave && onSave(validRows.map(d => ({ line: d.line, amount: Math.abs(Number(d.amount)) })))}
                  disabled={!canSave}
                  className={`px-4 py-1.5 text-xs uppercase tracking-wider font-medium border ${canSave ? 'border-slate-800 bg-slate-800 text-white hover:bg-slate-700' : 'border-stone-300 text-stone-400 cursor-not-allowed'}`}>
            Save splits
          </button>
        </div>
      </div>
    </div>
  );
}

/* ============================================================================
   Rules editor
   ========================================================================== */
function RulesEditor({ rules, lineNames, onSave, saving }) {

  const [nr, setNr]         = useState({ line: lineNames[0] || 'Review', type: 'desc', value: '' });

  useEffect(() => setDraft(rules), [rules]);

  const dirty = JSON.stringify(draft) !== JSON.stringify(rules);

  const add = () => {
    if (!nr.value.trim()) return;
    setDraft([...draft, { ...nr, value: nr.value.trim() }]);
    setNr({ ...nr, value: '' });
  };
  const del = (i) => setDraft(draft.filter((_, j) => j !== i));

  return (
    <div className="space-y-4">
      <div className="bg-white border border-stone-300 rounded-sm p-5">
        <div className="flex items-center justify-between mb-1">
          <h2 className="font-display text-lg">Add a rule</h2>
          <button onClick={() => onSave(draft)} disabled={!dirty || saving} className={`px-3 py-1.5 text-xs uppercase tracking-wider font-medium border ${dirty && !saving ? 'border-slate-800 bg-slate-800 text-white hover:bg-slate-700' : 'border-stone-300 text-stone-400 cursor-not-allowed'}`}>
            {saving ? 'Saving…' : dirty ? 'Save to Sheet' : 'Saved'}
