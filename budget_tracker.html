/* ============================================================================
   Storage keys & helpers (localStorage)
   ========================================================================== */
const K = {
  config:              'bt.config',              // {sheetUrl, sheetToken}
  cache:               'bt.cache',               // last loaded snapshot — offline fallback only
  overrides:           'bt.overrides',           // hash → line, for rows not yet posted to history
  splitOverrides:      'bt.splitOverrides',      // hash → splits[], for rows not yet posted to history
  budgetDateOverrides: 'bt.budgetDateOverrides', // hash → 'YYYY-MM-DD', for rows not yet posted to history
  tab:                 'bt.tab',                 // last selected tab
  privateMode:         'bt.privateMode',         // blur sensitive amounts (eye toggle)
  watchLine:           'bt.watchLine',           // which budget line the Running Watch panel is showing
  balanceOverride:     'bt.balanceOverride',     // {amount, setAtMS} — manual current bank balance override
  byCycleExpanded:     'bt.byCycleExpanded',     // dashboard "By cycle" table collapsed/expanded
  hiddenHashes:        'bt.hiddenHashes',        // [hash, ...] — Bank Statement rows the user merged away locally
};
const loadLS = (k, fallback) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : fallback; } catch { return fallback; } };
const saveLS = (k, v)        => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };

// Substrings (case-insensitive) used to hide internal transfers between your own accounts.
// Add more patterns here if Capitec uses different wording for any of your self-transfers.
const INTERNAL = [
  'transfer to credit card',
  'transfer received from main account',
  'transfer received from credit card',
  'transfer to main account',
  // Add patterns specific to your own self-transfers here, e.g.:
  // 'transfer received from <your-account-name>',
  // 'transfer to <your-account-name>',
];
const isInternalTx = t => {
  const d = (t.description || '').toLowerCase();
  const o = (t.originalDesc || '').toLowerCase();
  return INTERNAL.some(k => d.includes(k) || o.includes(k));
};

/* ============================================================================
   Date / cycle helpers
   ========================================================================== */
function parseISO(s) {
  if (!s) return null;
  const [y, m, d] = String(s).slice(0, 10).split('-').map(Number);
  if (!y || !m || !d) return null;
  return new Date(y, m - 1, d);
}
function toISO(d) {
  if (!(d instanceof Date) || isNaN(d)) return '';
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}
function cycleStartFor(dateStr, anchorDay) {
  const d = parseISO(dateStr) || new Date();
  if (d.getDate() >= anchorDay) return new Date(d.getFullYear(), d.getMonth(), anchorDay);
  return new Date(d.getFullYear(), d.getMonth() - 1, anchorDay);
}
function cycleEndFor(dateStr, anchorDay) {
  const s = cycleStartFor(dateStr, anchorDay);
  return new Date(s.getFullYear(), s.getMonth() + 1, anchorDay);
}
function cycleKey(dateStr, anchorDay) {
  return toISO(cycleStartFor(dateStr, anchorDay));
}
function prettyDate(iso) {
  const d = parseISO(iso);
  if (!d) return '—';
  return d.toLocaleDateString('en-ZA', { day: '2-digit', month: 'short', year: 'numeric' });
}
function prettyCycle(cycleStartISO, anchorDay) {
  const s = parseISO(cycleStartISO);
  if (!s) return '—';
  const e = new Date(s.getFullYear(), s.getMonth() + 1, s.getDate());
  e.setDate(e.getDate() - 1);
  const sStr = s.toLocaleDateString('en-ZA', { day: '2-digit', month: 'short' });
  const eStr = e.toLocaleDateString('en-ZA', { day: '2-digit', month: 'short', year: 'numeric' });
  return `${sStr} – ${eStr}`;
}
function shortCycleLabel(cycleStartISO) {
  const d = parseISO(cycleStartISO);
  if (!d) return '—';
  return d.toLocaleDateString('en-ZA', { month: 'short', year: '2-digit' });
}
function shiftCycle(cycleStartISO, months) {
  const d = parseISO(cycleStartISO);
  if (!d) return null;
  d.setMonth(d.getMonth() + months);
  return toISO(d);
}

/* ============================================================================
   Format helpers
   ========================================================================== */
const fmt = (n, dp = 0) => {
  if (!n || Math.abs(n) < 0.005) return '–';
  const v = Math.abs(n).toLocaleString('en-ZA', { minimumFractionDigits: dp, maximumFractionDigits: dp });
  return n < 0 ? `(${v})` : v;
};
const fmtSigned = n => {
  if (!n || Math.abs(n) < 0.5) return '0';
  const s = n > 0 ? '+' : '−';
  return s + Math.abs(n).toLocaleString('en-ZA', { maximumFractionDigits: 0 });
};

/* ============================================================================
   Splits — a transaction's amount can be allocated across multiple budget lines.
   Stored on the Sheet's Transactions tab as "Line1:Amount1|Line2:Amount2".
   Amounts in splits are positive numbers; the row's sign (negative = spend) is
   implicit. Empty/null splits → row uses its single Line as usual.
   ========================================================================== */
function parseSplits(s) {
  if (s === null || s === undefined) return null;
  const str = String(s).trim();
  if (!str) return null;
  const out = [];
  for (const part of str.split('|')) {
    const piece = part.trim();
    if (!piece) continue;
    const idx = piece.lastIndexOf(':');
    if (idx < 0) continue;
    const line = piece.slice(0, idx).trim();
    const amt  = Number(piece.slice(idx + 1));
    if (!line || !Number.isFinite(amt) || amt === 0) continue;
    out.push({ line, amount: Math.abs(amt) });
  }
  return out.length ? out : null;
}
function serializeSplits(arr) {
  if (!arr || !arr.length) return '';
  return arr.map(s => `${s.line}:${Math.abs(Number(s.amount) || 0)}`).join('|');
}
function splitsSum(arr) {
  if (!arr || !arr.length) return 0;
  return arr.reduce((s, x) => s + (Math.abs(Number(x.amount)) || 0), 0);
}

/* ============================================================================
   Row normalization (Sheet/CSV → JS tx shape)
   ========================================================================== */
function normalizeRow(r) {
  const mi = Number(r['Money In']) || 0;
  const mo = Number(r['Money Out']) || 0;
  const fe = Number(r['Fee']) || 0;
  return {
    account: String(r['Account'] || ''),
    date: String(r['Posting Date'] || '').slice(0, 10),
    transactionDate: String(r['Transaction Date'] || '').slice(0, 10),
    description: String(r['Description'] || ''),
    originalDesc: String(r['Original Description'] || r['Description'] || ''),
    parentCategory: String(r['Parent Category'] || ''),
    bankCategory: String(r['Category'] || ''),
    moneyIn: mi,
    moneyOut: mo,
    fee: fe,
    amount: mi + mo + fe,
    balance: (r['Balance'] === '' || r['Balance'] == null) ? null : Number(r['Balance']),
    line: r['Line'] || null,
    splits: parseSplits(r['Splits']),
    budgetDate: (r['Budget Date'] ? String(r['Budget Date']).slice(0, 10) : '') || null,
    postedAt: r['Posted At'] || null,
  };
}
// Date used for budget/cycle calculations. Budget Date overrides Posting Date,
// letting a row count in a different cycle without changing its actual date.
const effectiveDate = t => t.budgetDate || t.date;
function denormalizeRow(t) {
  return {
    'Account': t.account,
    'Posting Date': t.date,
    'Transaction Date': t.transactionDate,
    'Description': t.description,
    'Original Description': t.originalDesc,
    'Parent Category': t.parentCategory,
    'Category': t.bankCategory,
    'Money In': t.moneyIn,
    'Money Out': t.moneyOut,
    'Fee': t.fee,
    'Line': t.line,
    'Splits': serializeSplits(t.splits),
    'Budget Date': t.budgetDate || '',
  };
}
// Strip transient bank markers (e.g. Capitec's "(Pending)" prefix on
// un-cleared rows) so the same transaction hashes the same whether it
// was imported as pending or after it cleared. Without this, the same
// purchase imported twice — once pending, once posted — would dedup as
// two separate rows.
const normalizeDesc = s => String(s || '').toLowerCase().replace(/^\s*\(pending\)\s*/i, '').trim();
// Anchor the hash on Transaction Date — it's stable across pending → cleared.
// Capitec shifts Posting Date when a pending row clears, but Transaction Date
// stays put, so hashing by Transaction Date keeps the same purchase looking
// like the same purchase regardless of clearance status.
const txHash = t => `${t.transactionDate || t.date}|${normalizeDesc(t.originalDesc || t.description)}|${(t.amount || 0).toFixed(2)}`;

/* ============================================================================
   Classifier
   ========================================================================== */
function classify(tx, rules) {
  if (tx.amount > 0) return tx.bankCategory === 'Salary' ? 'Salary' : 'Other Income';
  const desc = (tx.description || '').toLowerCase();
  const orig = (tx.originalDesc || '').toLowerCase();
  for (const r of rules) {
    const val = (r.value || '').toLowerCase();
    if (r.type === 'desc' && val && (desc.includes(val) || orig.includes(val))) return r.line;
    if (r.type === 'cat'  && tx.bankCategory  === r.value) return r.line;
    if (r.type === 'pcat' && tx.parentCategory === r.value) return r.line;
  }
  return 'Review';
}

/* ============================================================================
   CSV parser (fallback path, manual drop)
   ========================================================================== */
function parseCsvText(text) {
  const res = Papa.parse(text, { header: true, skipEmptyLines: true });
  return res.data
    .map(normalizeRow)
    .filter(t => t.date && t.amount !== 0)
    .filter(t => !INTERNAL.some(k => (t.description || '').toLowerCase().includes(k)));
}

/* ============================================================================
   Sheet I/O
   ========================================================================== */
async function sheetFetch(config, action, body) {
  if (!config.sheetUrl || !config.sheetToken) {
    throw new Error('Sheet not configured — set URL and token in the Setup tab.');
  }
  let res;
  // Everything goes through GET — Apps Script's POST → 302 redirect chain
  // is unreliable in multi-Google-account browsers and with some privacy
  // extensions, which silently drops the POST body. GETs handle the
  // same redirect cleanly. The token + action + body all go as query
  // params, with the body URL-encoded as JSON.
  //
  // URL length: most browsers handle 8K+. The biggest payload (save-rules
  // for a heavy ruleset) is ~4K. Append-history with many rows is the only
  // potential overflow case and falls back to POST below.
  const bodyParam = body ? '&body=' + encodeURIComponent(JSON.stringify(body)) : '';
  const finalAction = (body && body.action) || action;
  const url = `${config.sheetUrl}?token=${encodeURIComponent(config.sheetToken)}&action=${encodeURIComponent(finalAction)}${bodyParam}&_=${Date.now()}`;

  // If the URL is over 6K, fall back to POST. Above that some networking
  // gear truncates query strings.
  if (url.length > 6000) {
    res = await fetch(config.sheetUrl, {
      method: 'POST',
      body: JSON.stringify({ token: config.sheetToken, action: finalAction, ...body }),
      redirect: 'follow',
    });
  } else {
    res = await fetch(url, { redirect: 'follow', cache: 'no-store' });
  }
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const data = await res.json();
  if (data && data.ok === false) throw new Error(data.error || 'Sheet error');
  return data;
}

/* ============================================================================
   Main app
   ========================================================================== */
function BudgetTracker() {
  const cached = loadLS(K.cache, {});
  const [config, setConfig]               = useState(() => loadLS(K.config, { sheetUrl: '', sheetToken: '' }));
  const [budget, setBudget]               = useState(cached.budget         || []);
  const [budgetOverrides, setBudgetOverrides] = useState(cached.budgetOverrides || []);
  const [rules, setRules]                 = useState(cached.rules          || []);
  const [settings, setSettings]           = useState(cached.settings       || { netIncome: 0, anchorDay: 25 });
  const [rawStatements, setRawStatements] = useState(cached.rawStatements  || []);
  const [history, setHistory]             = useState(cached.history        || []);
  const [overrides, setOverrides]         = useState(() => loadLS(K.overrides, {}));
  const [splitOverrides, setSplitOverrides] = useState(() => loadLS(K.splitOverrides, {}));
  const [budgetDateOverrides, setBudgetDateOverrides] = useState(() => loadLS(K.budgetDateOverrides, {}));
  const [csvRows, setCsvRows]             = useState([]);
  const [fileNames, setFileNames]         = useState([]);
  const [tab, setTab]                     = useState(() => {
    const saved = loadLS(K.tab, null);
    const cfg = loadLS(K.config, { sheetUrl: '', sheetToken: '' });
    if (saved) return saved;
    return (cfg.sheetUrl && cfg.sheetToken) ? 'dashboard' : 'setup';
  });
  const [privateMode, setPrivateMode]     = useState(() => loadLS(K.privateMode, false));
  // Manual override of the bank balance for the Cashflow card. Statements lag
  // real life — Capitec emails today's PDF but transactions keep happening
  // after that, so the bank's "Balance" column is already stale by the time
  // you see it. User can tap in their actual current balance from the banking
  // app; it stays applied until they click clear or sync newer data.
  const [balanceOverride, setBalanceOverride] = useState(() => loadLS(K.balanceOverride, null));
  // Hashes of rows the user has merged away. PERSISTED TO THE SHEET (in
  // Settings → "HiddenHashes") so the choice survives across browsers and
  // CSV re-imports. localStorage is just a fast-path mirror — the source
  // of truth is the server. pullStatements_ on the Apps Script side reads
  // this set and skips matching rows on every sync, so the duplicate
  // never reappears.
  const [hiddenHashes, _setHiddenHashes] = useState(() => new Set(loadLS(K.hiddenHashes, [])));
  // Returns a promise that resolves once the server has persisted the hash.
  // Callers that subsequently call loadFromSheet must await this — otherwise
  // the reload races the persist and overwrites local state with stale data.
  const addHiddenHash = async (h) => {
    _setHiddenHashes(prev => {
      const next = new Set(prev); next.add(h);
      saveLS(K.hiddenHashes, Array.from(next));
      return next;
    });
    try {
      await sheetFetch(config, null, { action: 'add-hidden-hash', hash: h });
    } catch (e) {
      console.error('[hiddenHashes] failed to persist to server:', e);
    }
  };
  const [loading, setLoading]             = useState(false);
  const [syncStatus, setSyncStatus]       = useState(null); // {kind:'ok'|'err', message, when}
  // Pending-merge review modal: null when closed, otherwise an array of
  // merge proposals returned by the server. User unchecks rejections and
  // clicks Apply; on confirm we POST only the approved subset.
  const [mergeProposals, setMergeProposals] = useState(null);
  const [mergeApproved, setMergeApproved]   = useState(() => new Set());
  const [importError, setImportError]     = useState(null);
  const [chatOpen, setChatOpen]           = useState(false);
  const [chatMessages, setChatMessages]   = useState([]);
  const [chatSending, setChatSending]     = useState(false);
  const [chatScope, setChatScope]         = useState('window'); // 'window' | 'last30' | 'last90' | 'all'

  useEffect(() => saveLS(K.config, config),       [config]);
  useEffect(() => saveLS(K.overrides, overrides), [overrides]);
  useEffect(() => saveLS(K.splitOverrides, splitOverrides), [splitOverrides]);
  useEffect(() => saveLS(K.budgetDateOverrides, budgetDateOverrides), [budgetDateOverrides]);
  useEffect(() => saveLS(K.tab, tab),             [tab]);
  useEffect(() => saveLS(K.privateMode, privateMode), [privateMode]);
  useEffect(() => saveLS(K.balanceOverride, balanceOverride), [balanceOverride]);

  const cacheSnapshot = (next) => {
    saveLS(K.cache, {
      rawStatements:   next.rawStatements   ?? rawStatements,
      history:         next.history         ?? history,
      budget:          next.budget          ?? budget,
      budgetOverrides: next.budgetOverrides ?? budgetOverrides,
      rules:           next.rules           ?? rules,
      settings:        next.settings        ?? settings,
    });
  };

  // pullMode: null = just reload from Sheet (no Gmail fetch)
  //           'csv' = pull CSV statements only (fast, ~5s)
  //           'pdf' = parse PDFs via Gemini (slow, ~3min per PDF)
  //           'all' = both (legacy / mixed-source users)
  async function loadFromSheet({ pull = false, pullMode = null } = {}) {
    if (!config.sheetUrl || !config.sheetToken) {
      setSyncStatus({ kind: 'err', message: 'Configure Sheet URL & token in Setup first.', when: new Date() });
      return;
    }
    setLoading(true);
    setSyncStatus(null);
    const action = pullMode === 'csv' ? 'pull-csv'
                 : pullMode === 'pdf' ? 'pull-pdf'
                 : pull ? 'pull' : 'load';
    try {
      const data = await sheetFetch(config, action);
      const nRaw     = (data.rawStatements || []).map(normalizeRow).filter(t => t.date && t.amount !== 0);
      const nHist    = (data.transactions  || []).map(normalizeRow).filter(t => t.date);
      const nBudget  = (data.budget || []).map(r => ({
        line:      String(r.Line || ''),
        amount:    Number(r.Amount) || 0,
        // Forecast type: 'daily' | 'fixed' | 'petrol' | '' (none/auto)
        forecast:  String(r.Forecast || '').toLowerCase(),
        l100:      Number(r['L/100']) || 0,
        kmPerDay:  Number(r['Km/Day']) || 0,
      })).filter(b => b.line);
      const nOverrides = (data.budgetOverrides || []).map(r => ({
        cycle: String(r.Cycle || '').slice(0, 10),
        line: String(r.Line || ''),
        amount: Number(r.Amount) || 0,
      })).filter(o => o.cycle && o.line);
      const nRules   = (data.rules  || []).map(r => ({ line: String(r.Line || ''), type: String(r.Type || ''), value: String(r.Value || '') })).filter(r => r.line && r.type);
      const s = data.settings || {};
      const invertedRaw = String(s['Inverted Accounts'] || '');
      const nSettings = {
        netIncome: Number(s['Net Income']) || 0,
        anchorDay: Number(s['Anchor Day']) || 25,
        // Account numbers whose balance sign should flip — for banks that
        // represent credit-card debt with the opposite convention to Capitec.
        invertedAccounts: invertedRaw.split(',').map(x => x.trim()).filter(Boolean),
      };
      setRawStatements(nRaw);
      setHistory(nHist);
      setBudget(nBudget);
      setBudgetOverrides(nOverrides);
      setRules(nRules);
      setSettings(nSettings);
      // Hydrate hiddenHashes from the server's Settings → "HiddenHashes" key.
      // Survives across browsers + CSV re-imports because pullStatements_
      // on the server side reads the same list and skips matching rows.
      try {
        const hh = s['HiddenHashes'];
        if (hh) {
          const arr = JSON.parse(String(hh));
          if (Array.isArray(arr)) {
            const next = new Set(arr);
            _setHiddenHashes(next);
            saveLS(K.hiddenHashes, arr);
          }
        }
      } catch (_) {}
      saveLS(K.cache, { rawStatements: nRaw, history: nHist, budget: nBudget, budgetOverrides: nOverrides, rules: nRules, settings: nSettings });
      const sourceLabel = pullMode === 'csv' ? 'CSV statements'
                        : pullMode === 'pdf' ? 'PDF statements (AI-parsed)'
                        : pull ? 'Gmail' : null;
      setSyncStatus({
        kind: 'ok',
        message: sourceLabel
          ? `Pulled ${sourceLabel}. ${nRaw.length} raw rows, ${nHist.length} in history.`
          : `Loaded. ${nRaw.length} raw rows, ${nHist.length} in history.`,
        when: new Date(),
      });
    } catch (e) {
      setSyncStatus({ kind: 'err', message: e.message || String(e), when: new Date() });
    } finally {
      setLoading(false);
    }
  }

  // Initial load when config is set
  useEffect(() => {
    if (config.sheetUrl && config.sheetToken) {
      void loadFromSheet();
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [config.sheetUrl, config.sheetToken]);

  const handleFiles = async (files) => {
    if (!files || !files.length) return;
    setImportError(null);
    try {
      const all = [];
      const names = [];
      for (const f of Array.from(files)) {
        names.push(f.name);
        const text = await f.text();
        all.push(...parseCsvText(text));
      }
      setCsvRows(all);
      setFileNames(names);
    } catch (e) { setImportError(e.message || 'Could not parse file'); }
  };

  // Merged view: history (canonical) wins over raw/csv on hash collision.
  // Internal self-transfers between your own accounts are dropped at this layer.
  const allTxs = useMemo(() => {
    const seen = new Set();
    const out = [];
    for (const t of history) {
      if (isInternalTx(t)) continue;
      const h = txHash(t);
      if (seen.has(h)) continue;
      seen.add(h);
      out.push({ ...t, inHistory: true, hash: h, line: t.line || 'Review' });
    }
    const candidates = [...rawStatements, ...csvRows];
    for (const t of candidates) {
      if (!t.date) continue;
      if (isInternalTx(t)) continue;
      const h = txHash(t);
      if (seen.has(h)) continue;
      if (hiddenHashes.has(h)) continue;  // user merged this away locally
      seen.add(h);
      const auto = classify(t, rules);
      const line = overrides[h] || auto;
      const splits = splitOverrides[h] || null;
      const budgetDate = budgetDateOverrides[h] || null;
      out.push({ ...t, inHistory: false, hash: h, line, splits, budgetDate });
    }
    out.sort((a, b) => b.date.localeCompare(a.date));
    return out;
  }, [history, rawStatements, csvRows, rules, overrides, splitOverrides, budgetDateOverrides, hiddenHashes]);

  // Default date range — current cycle
  const defaultRange = useMemo(() => {
    const today = toISO(new Date());
    const start = cycleStartFor(today, settings.anchorDay);
    const endExcl = new Date(start.getFullYear(), start.getMonth() + 1, settings.anchorDay);
    const endIncl = new Date(endExcl);
    endIncl.setDate(endIncl.getDate() - 1);
    return { from: toISO(start), to: toISO(endIncl) };
  }, [settings.anchorDay]);

  const [dateRange, setDateRange] = useState(defaultRange);
  useEffect(() => { setDateRange(defaultRange); }, [defaultRange]);

  const windowTxs = useMemo(
    () => allTxs.filter(t => {
      const d = effectiveDate(t);
      return d >= dateRange.from && d <= dateRange.to;
    }),
    [allTxs, dateRange],
  );

  // Aggregate net spend per budget line. Spends (amount < 0) add to the line's
  // actual; credits/income (amount > 0) subtract. Splits distribute across
  // multiple lines, with the row's sign carrying the direction.
  // Income explicitly tagged as Salary/Other Income (or any line not in the
  // budget) simply doesn't appear in the Budget vs Actual table — the user
  // chooses by classification whether a deposit should offset a budget line.
  const actuals = useMemo(() => {
    const a = {};
    for (const b of budget) a[b.line] = 0;
    for (const t of windowTxs) {
      if (!t.amount) continue;
      const sign = t.amount < 0 ? 1 : -1;
      if (t.splits && t.splits.length) {
        for (const s of t.splits) {
          if (a[s.line] === undefined) a[s.line] = 0;
          a[s.line] += sign * Math.abs(s.amount);
        }
      } else {
        if (a[t.line] === undefined) a[t.line] = 0;
        a[t.line] -= t.amount;
      }
    }
    return a;
  }, [windowTxs, budget]);

  const allCycles = useMemo(() => {
    const set = new Set();
    for (const t of allTxs) {
      const d = effectiveDate(t);
      if (d) set.add(cycleKey(d, settings.anchorDay));
    }
    return Array.from(set).sort();
  }, [allTxs, settings.anchorDay]);

  const cycleActuals = useMemo(() => {
    const result = {};
    for (const cy of allCycles) result[cy] = {};
    for (const t of allTxs) {
      if (!t.amount) continue;
      const sign = t.amount < 0 ? 1 : -1;
      const cy = cycleKey(effectiveDate(t), settings.anchorDay);
      if (!result[cy]) result[cy] = {};
      if (t.splits && t.splits.length) {
        for (const s of t.splits) {
          if (!result[cy][s.line]) result[cy][s.line] = 0;
          result[cy][s.line] += sign * Math.abs(s.amount);
        }
      } else {
        if (!result[cy][t.line]) result[cy][t.line] = 0;
        result[cy][t.line] -= t.amount;
      }
    }
    return result;
  }, [allTxs, allCycles, settings.anchorDay]);

  // Default budget lines + any one-off lines added via per-cycle overrides.
  // Lets users tag transactions to temp lines (e.g. "Mission Trip") that
  // only exist in a single cycle. Order: defaults first, overrides appended.
  const lineNames = useMemo(() => {
    const seen = new Set(budget.map(b => b.line));
    const extra = [];
    for (const o of budgetOverrides) {
      if (o.line && !seen.has(o.line)) { seen.add(o.line); extra.push(o.line); }
    }
    return [...budget.map(b => b.line), ...extra];
  }, [budget, budgetOverrides]);
  const newTxs              = allTxs.filter(t => !t.inHistory);
  // A row counts as classified if either its Line is set (not "Review") OR it
  // has splits configured — splits override the single line for budgeting,
  // so a Review row with splits is effectively classified across those lines.
  const newClassified       = newTxs.filter(t => t.line !== 'Review' || (t.splits && t.splits.length));
  const stillNeedingReview  = newTxs.length - newClassified.length;

  async function handlePostToHistory() {
    if (!newClassified.length) return;
    setLoading(true);
    setSyncStatus(null);
    try {
      const rows = newClassified.map(t => denormalizeRow(t));
      const res = await sheetFetch(config, null, { action: 'append-history', rows });
      const now = new Date().toISOString();
      const appended = newClassified.map(t => ({
        account: t.account, date: t.date, transactionDate: t.transactionDate,
        description: t.description, originalDesc: t.originalDesc,
        parentCategory: t.parentCategory, bankCategory: t.bankCategory,
        moneyIn: t.moneyIn, moneyOut: t.moneyOut, fee: t.fee, amount: t.amount,
        line: t.line, postedAt: now,
      }));
      const nextHistory = [...history, ...appended];
      setHistory(nextHistory);
      cacheSnapshot({ history: nextHistory });
      const newOv = { ...overrides };
      const newSplitOv = { ...splitOverrides };
      const newBudgetDateOv = { ...budgetDateOverrides };
      for (const t of newClassified) {
        delete newOv[t.hash];
        delete newSplitOv[t.hash];
        delete newBudgetDateOv[t.hash];
      }
      setOverrides(newOv);
      setSplitOverrides(newSplitOv);
      setBudgetDateOverrides(newBudgetDateOv);
      setSyncStatus({ kind: 'ok', message: `Posted ${res.appended} row(s) to history.`, when: new Date() });
    } catch (e) {
      setSyncStatus({ kind: 'err', message: e.message || String(e), when: new Date() });
    } finally {
      setLoading(false);
    }
  }

  async function handleSaveBudget(newBudget, newSettings) {
    setLoading(true);
    setSyncStatus(null);
    try {
      const rows = newBudget.map(b => ({
        Line:       b.line,
        Amount:     b.amount,
        Forecast:   b.forecast || '',
        'L/100':    b.l100     || '',
        'Km/Day':   b.kmPerDay || '',
      }));
      await sheetFetch(config, null, { action: 'save-budget', rows });
      await sheetFetch(config, null, { action: 'save-settings', settings: {
        'Net Income': newSettings.netIncome,
        'Anchor Day': newSettings.anchorDay,
        'Inverted Accounts': (newSettings.invertedAccounts || []).join(','),
      } });
      setBudget(newBudget);
      setSettings(newSettings);
      cacheSnapshot({ budget: newBudget, settings: newSettings });
      setSyncStatus({ kind: 'ok', message: 'Budget saved to Sheet.', when: new Date() });
    } catch (e) {
      setSyncStatus({ kind: 'err', message: e.message || String(e), when: new Date() });
    } finally {
      setLoading(false);
    }
  }

  async function handleEditHistoryLine(hash, newLine) {
    // Functional setState — critical for bulk updates, where multiple calls fire
    // back-to-back. The non-functional form would have each call capture the same
    // pre-update history and last-write-wins, defeating the bulk edit.
    setHistory(h => h.map(t => txHash(t) === hash ? { ...t, line: newLine } : t));
    try {
      await sheetFetch(config, null, { action: 'update-history', hash, line: newLine });
      setSyncStatus({ kind: 'ok', message: 'Updated in history.', when: new Date() });
    } catch (e) {
      // Revert just this row's line if we have a way to know the old value.
      // Per-row revert without tracking is hard; surface the error and let the
      // user re-sync from Sheet if it matters.
      setSyncStatus({ kind: 'err', message: 'Edit failed: ' + (e.message || String(e)), when: new Date() });
    }
  }

  async function handleDeleteHistoryRow(hash, tx) {
    // Same functional-setState reason as handleEditHistoryLine — bulk deletes
    // need each call to see the previous call's filter result.
    setHistory(h => h.filter(t => txHash(t) !== hash));
    // Send both hash (legacy) AND raw match fields. The server prefers match
    // when present — it's more robust than hash across client/server version
    // drift. tx may be undefined for older callers; in that case the server
    // falls back to hash matching.
    const body = { action: 'delete-history', hash };
    if (tx) {
      body.match = {
        postingDate:         tx.date,
        originalDescription: tx.originalDesc || tx.description,
        amount:              tx.amount,
      };
    }
    try {
      await sheetFetch(config, null, body);
      setSyncStatus({ kind: 'ok', message: 'Removed from history.', when: new Date() });
    } catch (e) {
      setSyncStatus({ kind: 'err', message: 'Delete failed: ' + (e.message || String(e)), when: new Date() });
    }
  }

  async function handleFindMergePending() {
    try {
      const res = await sheetFetch(config, null, { action: 'find-pending-merges' });
      const props = res.proposals || [];
      if (!props.length) {
        setSyncStatus({ kind: 'ok', message: 'No pending → cleared merges found.', when: new Date() });
        return;
      }
      setMergeProposals(props);
      // Default: all proposals checked. User unchecks any false positives.
      setMergeApproved(new Set(props.map(p => p.rowIdx)));
    } catch (e) {
      setSyncStatus({ kind: 'err', message: 'Find merges failed: ' + (e.message || String(e)), when: new Date() });
    }
  }

  async function handleMergeTwoSelected(txs) {
    // Pragmatic merge: pick the "loser" (pending if exactly one is tagged
    // (Pending), else the older-dated one) and DELETE it. The winner stays
    // as-is with its date, description, and classification intact.
    console.log('[merge] handler called with txs=', txs);
    if (!txs || txs.length !== 2) {
      console.warn('[merge] aborted — expected 2 txs, got:', txs ? txs.length : 'null');
      setSyncStatus({ kind: 'err', message: 'Merge aborted: needed 2 selected rows, got ' + (txs ? txs.length : 0) + '. Try selecting again.', when: new Date() });
      return;
    }
    console.log('[merge] tx[0]:', { date: txs[0].date, desc: txs[0].description, originalDesc: txs[0].originalDesc, amount: txs[0].amount, inHistory: txs[0].inHistory, hash: txs[0].hash });
    console.log('[merge] tx[1]:', { date: txs[1].date, desc: txs[1].description, originalDesc: txs[1].originalDesc, amount: txs[1].amount, inHistory: txs[1].inHistory, hash: txs[1].hash });
    const isPending = t => /^\s*\(pending\)/i.test(t.originalDesc || '') || /^\s*\(pending\)/i.test(t.description || '');
    let loser, winner;
    const aPending = isPending(txs[0]);
    const bPending = isPending(txs[1]);
    if (aPending && !bPending)      { loser = txs[0]; winner = txs[1]; }
    else if (bPending && !aPending) { loser = txs[1]; winner = txs[0]; }
    else {
      if ((txs[0].date || '') <= (txs[1].date || '')) { loser = txs[0]; winner = txs[1]; }
      else                                            { loser = txs[1]; winner = txs[0]; }
    }
    console.log('[merge] loser:', { date: loser.date, desc: loser.description, inHistory: loser.inHistory, hash: loser.hash });
    console.log('[merge] winner:', { date: winner.date, desc: winner.description, inHistory: winner.inHistory, hash: winner.hash });
    const confirmed = confirm(
      'Merge these two rows?\n\n' +
      'KEEP: ' + winner.date + ' — ' + (winner.description || winner.originalDesc) + '\n' +
      'REMOVE: ' + loser.date + ' — ' + (loser.description || loser.originalDesc) + '\n\n' +
      'The kept row\'s Line classification is preserved.'
    );
    console.log('[merge] confirm result:', confirmed);
    if (!confirmed) {
      setSyncStatus({ kind: 'err', message: 'Merge cancelled.', when: new Date() });
      return;
    }

    // Optimistic UI: drop loser from local state immediately so the user
    // sees the change before the round-trip to the Sheet completes. The
    // loadFromSheet() at the end will reconcile against canonical data.
    if (loser.inHistory) {
      setHistory(h => h.filter(t => txHash(t) !== loser.hash));
    }
    setSyncStatus({ kind: 'ok', message: 'Merging — syncing with Sheet…', when: new Date() });

    try {
      // Step 1: if loser has a meaningful Line and winner doesn't, transfer
      // it. Only matters when winner is in history (raw rows pick up Line
      // via auto-classify, so they don't need a server update).
      const loserLine  = (loser.line  || '').trim();
      const winnerLine = (winner.line || '').trim();
      const winnerIsUnclassified = !winnerLine || winnerLine.toLowerCase() === 'review';
      if (winner.inHistory && loserLine && loserLine.toLowerCase() !== 'review' && winnerIsUnclassified) {
        await sheetFetch(config, null, {
          action: 'update-history',
          hash: winner.hash,
          line: loserLine,
        });
      }

      // Step 2: get rid of the loser. Different paths depending on where
      // the loser lives:
      //   - in history (Transactions tab): real server-side delete
      //   - in Bank Statement only (not yet posted): already hidden locally
      //     above. The raw row stays in the Sheet (next sync would re-fetch
      //     it anyway), but it stops counting toward your budget.
      if (loser.inHistory) {
        console.log('[merge] sending delete-history for loser', loser.hash);
        const delRes = await sheetFetch(config, null, {
          action: 'delete-history',
          hash: loser.hash,
          match: {
            postingDate:         loser.date,
            originalDescription: loser.originalDesc || loser.description,
            description:         loser.description,
            amount:              loser.amount,
          },
        });
        console.log('[merge] delete-history result:', delRes);
        // Also persist a hide for the loser hash — protects against the
        // row being re-imported via a future CSV/PDF sync.
        console.log('[merge] persisting hidden hash to server for safety', loser.hash);
        await addHiddenHash(loser.hash);
      } else {
        console.log('[merge] persisting hidden hash to server (raw row)', loser.hash);
        await addHiddenHash(loser.hash);
      }

      // Blow away the localStorage snapshot cache so the upcoming
      // loadFromSheet definitely overwrites it with fresh server data —
      // not stitches stale cache on top. Keeps bt.config (URL + token)
      // and other settings keys intact; we only nuke the data cache.
      try { localStorage.removeItem(K.cache); } catch (_) {}
      console.log('[merge] reloading sheet…');
      await loadFromSheet();
      console.log('[merge] done');
      setSyncStatus({
        kind: 'ok',
        message: loser.inHistory
          ? 'Merged — removed ' + (loser.description || loser.originalDesc) + ' from history.'
          : 'Merged — hid the Bank Statement duplicate.',
        when: new Date(),
      });
    } catch (e) {
      setSyncStatus({ kind: 'err', message: 'Merge failed: ' + (e.message || String(e)), when: new Date() });
    }
  }

  async function handleApplyMerges() {
    if (!mergeProposals) return;
    const approved = mergeProposals.filter(p => mergeApproved.has(p.rowIdx));
    if (!approved.length) {
      setMergeProposals(null);
      return;
    }
    try {
      const res = await sheetFetch(config, null, { action: 'apply-pending-merges', proposals: approved });
      setSyncStatus({ kind: 'ok', message: 'Merged ' + (res.merged || 0) + ' pending row(s).', when: new Date() });
      setMergeProposals(null);
      setMergeApproved(new Set());
      await loadFromSheet();
    } catch (e) {
      setSyncStatus({ kind: 'err', message: 'Merge failed: ' + (e.message || String(e)), when: new Date() });
    }
  }

  async function handleChatSend(text) {
    if (!text.trim() || chatSending) return;
    const userMsg = { role: 'user', text: text.trim() };
    const nextMessages = [...chatMessages, userMsg];
    setChatMessages(nextMessages);
    setChatSending(true);
    try {
      // Pick which transactions to send based on the scope dropdown. The
      // default ('window') sends what the Dashboard is showing — fast and
      // matches what the user is looking at. Other scopes let them ask
      // questions across more history without leaving the chat.
      const mapTx = t => ({
        date: t.date,
        description: t.description,
        amount: Math.round(t.amount * 100) / 100,
        line: t.line,
      });
      const today = new Date();
      const cutoffISO = (days) => {
        const d = new Date(today); d.setDate(today.getDate() - days);
        return toISO(d);
      };

      let scopeTxs, scopeFrom, scopeTo, scopeLabel;
      if (chatScope === 'last30') {
        scopeFrom = cutoffISO(30); scopeTo = toISO(today);
        scopeTxs = allTxs.filter(t => effectiveDate(t) >= scopeFrom);
        scopeLabel = 'last 30 days';
      } else if (chatScope === 'last90') {
        scopeFrom = cutoffISO(90); scopeTo = toISO(today);
        scopeTxs = allTxs.filter(t => effectiveDate(t) >= scopeFrom);
        scopeLabel = 'last 90 days';
      } else if (chatScope === 'all') {
        scopeFrom = ''; scopeTo = '';
        scopeTxs = allTxs;
        scopeLabel = 'all available history';
      } else {
        // default: 'window'
        scopeFrom = dateRange.from; scopeTo = dateRange.to;
        scopeTxs = windowTxs;
        scopeLabel = 'current cycle window';
      }

      // Hard cap so we don't blow the context window on big histories OR
      // burn through the per-minute token quota on the free tier. 150 rows
      // ≈ 3-5K tokens per turn, which keeps a normal chat session well
      // within free-tier limits (10 RPM, ~250K TPM on gemini-2.5-flash).
      // For questions that need more rows ("show me all my Pick n Pay txs"),
      // widen the chat scope or narrow the dashboard window first.
      const MAX_TX_IN_PROMPT = 150;
      // Send the MOST RECENT rows when truncating, since that's what users
      // most commonly ask about (txs come pre-sorted newest-first in allTxs).
      const txs = scopeTxs.slice(0, MAX_TX_IN_PROMPT).map(mapTx);
      const truncated = scopeTxs.length > MAX_TX_IN_PROMPT;

      const res = await sheetFetch(config, null, {
        action: 'chat',
        messages: nextMessages.map(m => ({ role: m.role, text: m.text })),
        context: {
          budget,
          settings: { netIncome: settings.netIncome, anchorDay: settings.anchorDay },
          windowFrom: scopeFrom,
          windowTo: scopeTo,
          scopeLabel,
          truncated,
          totalCount: scopeTxs.length,
          transactions: txs,
        },
      });
      const reply = res && res.message ? res.message : '(no reply)';
      setChatMessages([...nextMessages, { role: 'assistant', text: reply }]);
    } catch (e) {
      setChatMessages([...nextMessages, { role: 'assistant', text: 'Error: ' + (e.message || String(e)), error: true }]);
    } finally {
      setChatSending(false);
    }
  }

  async function handleUpdateBudgetDate(hash, budgetDate) {
    // budgetDate is 'YYYY-MM-DD' or null/empty to clear.
    // In-history rows write straight to Sheet; new rows go to local
    // budgetDateOverrides state until posted.
    const isInHistory = history.some(t => txHash(t) === hash);
    const cleaned = budgetDate || null;
    if (isInHistory) {
      setHistory(h => h.map(t => txHash(t) === hash ? { ...t, budgetDate: cleaned } : t));
      try {
        await sheetFetch(config, null, { action: 'update-budget-date', hash, budgetDate: cleaned || '' });
        setSyncStatus({ kind: 'ok', message: cleaned ? 'Cycle override saved.' : 'Cycle override cleared.', when: new Date() });
      } catch (e) {
        setSyncStatus({ kind: 'err', message: 'Cycle override failed: ' + (e.message || String(e)), when: new Date() });
      }
    } else {
      setBudgetDateOverrides(o => {
        const n = { ...o };
        if (cleaned) n[hash] = cleaned;
        else         delete n[hash];
        return n;
      });
    }
  }

  async function handleUpdateSplits(hash, splits) {
    // splits is an array of {line, amount} or null/empty to clear.
    // In-history rows write straight to the Sheet. New (unposted) rows live
    // in local splitOverrides state and get serialised into Splits column
    // when the user clicks Post to history.
    const isInHistory = history.some(t => txHash(t) === hash);
    const cleaned = splits && splits.length ? splits : null;
    if (isInHistory) {
      setHistory(h => h.map(t => txHash(t) === hash ? { ...t, splits: cleaned } : t));
      try {
        await sheetFetch(config, null, { action: 'update-splits', hash, splits: serializeSplits(splits) });
        setSyncStatus({ kind: 'ok', message: cleaned ? 'Splits saved.' : 'Splits cleared.', when: new Date() });
      } catch (e) {
        setSyncStatus({ kind: 'err', message: 'Split update failed: ' + (e.message || String(e)), when: new Date() });
      }
    } else {
      // Local-only — staged until the row is posted to history.
      setSplitOverrides(o => {
        const n = { ...o };
        if (cleaned) n[hash] = cleaned;
        else         delete n[hash];
        return n;
      });
    }
  }

  // Save just the settings (used by per-account "flip sign" toggles in Cashflow
  // card so we don't need to re-save the whole budget for a one-line change).
  async function handleSaveSettings(newSettings) {
    const prev = settings;
    setSettings(newSettings);
    try {
      await sheetFetch(config, null, { action: 'save-settings', settings: {
        'Net Income': newSettings.netIncome,
        'Anchor Day': newSettings.anchorDay,
        'Inverted Accounts': (newSettings.invertedAccounts || []).join(','),
      } });
      cacheSnapshot({ settings: newSettings });
    } catch (e) {
      setSettings(prev);
      setSyncStatus({ kind: 'err', message: 'Settings save failed: ' + (e.message || String(e)), when: new Date() });
    }
  }

  async function handleSaveBudgetOverrides(newOverrides) {
    const prev = budgetOverrides;
    setBudgetOverrides(newOverrides);
    try {
      const rows = newOverrides.map(o => ({ Cycle: o.cycle, Line: o.line, Amount: o.amount }));
      await sheetFetch(config, null, { action: 'save-budget-overrides', rows });
      cacheSnapshot({ budgetOverrides: newOverrides });
      setSyncStatus({ kind: 'ok', message: 'Overrides saved.', when: new Date() });
    } catch (e) {
      setBudgetOverrides(prev);
      setSyncStatus({ kind: 'err', message: 'Overrides save failed: ' + (e.message || String(e)), when: new Date() });
    }
  }

  // Merge default budget with per-cycle overrides for a given cycle key.
  // Lines that exist only as overrides (e.g. one-off "Mission Trip") are
  // appended at the end. Returns an array with the same shape as `budget`.
  function effectiveBudgetForCycle(cycleStartISO) {
    const overrideMap = {};
    for (const o of budgetOverrides) {
      if (o.cycle === cycleStartISO) overrideMap[o.line] = o.amount;
    }
    const result = budget.map(b => ({
      ...b,  // preserve forecast, l100, kmPerDay etc — only Amount can be overridden per cycle
      amount: overrideMap[b.line] !== undefined ? overrideMap[b.line] : b.amount,
      overridden: overrideMap[b.line] !== undefined,
    }));
    for (const line of Object.keys(overrideMap)) {
      if (!result.find(b => b.line === line)) {
        result.push({ line, amount: overrideMap[line], overridden: true, addedOnly: true });
      }
    }
    return result;
  }

  async function handleSaveRules(newRules) {
    setLoading(true);
    setSyncStatus(null);
    try {
      const rows = newRules.map(r => ({ Line: r.line, Type: r.type, Value: r.value }));
      await sheetFetch(config, null, { action: 'save-rules', rows });
      setRules(newRules);
      cacheSnapshot({ rules: newRules });
      setSyncStatus({ kind: 'ok', message: 'Rules saved to Sheet.', when: new Date() });
    } catch (e) {
      setSyncStatus({ kind: 'err', message: e.message || String(e), when: new Date() });
    } finally {
      setLoading(false);
    }
  }

  const setOverride   = (hash, line) => setOverrides(o => ({ ...o, [hash]: line }));
  const clearOverride = (hash)       => setOverrides(o => { const n = { ...o }; delete n[hash]; return n; });

  const configured = !!(config.sheetUrl && config.sheetToken);

  return (
    <div className="min-h-screen text-stone-900">
      <header style={{ backgroundColor: '#1A2540' }} className="border-b border-stone-300">
        <div className="max-w-7xl mx-auto px-6 py-5 text-stone-100">
          <div className="flex items-baseline justify-between flex-wrap gap-3">
            <div>
              <h1 className="font-display text-2xl font-medium tracking-tight flex items-center gap-2"><span className="text-2xl leading-none">🪙</span>CapiTracker</h1>
              <p className="text-stone-400 text-xs mt-0.5 tracking-wide uppercase">To Keep The Budget Lekker</p>
            </div>
            <div className="text-right text-xs text-stone-300">
              {configured ? (
                <>
                  <div className="font-num">{history.length} in history · {newTxs.length} new · {allCycles.length} cycles</div>
                  <div className="text-stone-400">Anchor day {settings.anchorDay} · net <span className={privateMode ? 'blur-sm select-none' : ''}>R{(settings.netIncome || 0).toLocaleString('en-ZA')}</span></div>
                </>
              ) : <div className="text-stone-400">No Sheet connection yet</div>}
            </div>
          </div>
        </div>
      </header>

      {syncStatus && (
        <div className="max-w-7xl mx-auto px-6 pt-3">
          <div className={`text-xs px-3 py-2 flex items-center justify-between gap-2 border ${syncStatus.kind === 'err' ? 'bg-red-50 text-red-800 border-red-200' : 'bg-emerald-50 text-emerald-800 border-emerald-200'}`}>
            <div className="flex items-center gap-2">
              {syncStatus.kind === 'err' ? <IconAlert className="w-3.5 h-3.5" /> : <IconCheck className="w-3.5 h-3.5" />}
              <span>{syncStatus.message}</span>
              <span className="text-stone-500 font-num">{syncStatus.when ? syncStatus.when.toLocaleTimeString('en-ZA') : ''}</span>
            </div>
            <button onClick={() => setSyncStatus(null)} className="hover:opacity-70"><IconX className="w-3.5 h-3.5" /></button>
          </div>
        </div>
      )}

      {mergeProposals && (
        <MergeReviewModal
          proposals={mergeProposals}
          approved={mergeApproved}
          setApproved={setMergeApproved}
          onApply={handleApplyMerges}
          onCancel={() => { setMergeProposals(null); setMergeApproved(new Set()); }}
        />
      )}

      <div className="max-w-7xl mx-auto px-6 pt-4">
        <Uploader
          onFiles={handleFiles}
          fileNames={fileNames}
          error={importError}
          clear={() => { setCsvRows([]); setFileNames([]); }}
          configured={configured}
          loading={loading}
          onSyncCsv={() => loadFromSheet({ pullMode: 'csv' })}
          onSyncPdf={() => loadFromSheet({ pullMode: 'pdf' })}
          onReload={() => loadFromSheet()}
          onMergePending={handleFindMergePending}
        />
      </div>

      <div className="max-w-7xl mx-auto px-6 mt-6 border-b border-stone-300">
        <nav className="flex gap-1 flex-wrap">
          <TabBtn id="dashboard"    cur={tab} set={setTab} Icon={IconChart} label="Dashboard" />
          <TabBtn id="transactions" cur={tab} set={setTab} Icon={IconFile}  label={`Transactions${newTxs.length ? ` · ${newTxs.length} new` : ''}`} />
          <TabBtn id="rules"        cur={tab} set={setTab} Icon={IconList}  label="Rules" />
          <TabBtn id="budget"       cur={tab} set={setTab} Icon={IconCog}   label="Budget" />
          <TabBtn id="setup"        cur={tab} set={setTab} Icon={IconLink}  label={configured ? 'Setup' : 'Setup — start here'} />
        </nav>
      </div>

      <main className="max-w-7xl mx-auto px-6 py-7">
        {tab === 'dashboard'    && <Dashboard
                                      budget={budget}
                                      budgetOverrides={budgetOverrides}
                                      effectiveBudgetForCycle={effectiveBudgetForCycle}
                                      actuals={actuals}
                                      settings={settings}
                                      dateRange={dateRange}
                                      setDateRange={setDateRange}
                                      defaultRange={defaultRange}
                                      windowTxs={windowTxs}
                                      allCycles={allCycles}
                                      cycleActuals={cycleActuals}
                                      hasData={allTxs.length > 0}
                                      privateMode={privateMode}
                                      setPrivateMode={setPrivateMode}
                                      rawStatements={rawStatements}
                                      onSaveSettings={handleSaveSettings}

                                      setBalanceOverride={setBalanceOverride}

                                    />}
        {tab === 'transactions' && <Transactions
                                      allTxs={allTxs}
                                      lineNames={lineNames}
                                      overrides={overrides}
                                      setOverride={setOverride}
                                      clearOverride={clearOverride}
                                      anchorDay={settings.anchorDay}
                                      onPostToHistory={handlePostToHistory}
                                      onEditHistoryLine={handleEditHistoryLine}
                                      onDeleteHistoryRow={handleDeleteHistoryRow}
                                      onMergeTwoSelected={handleMergeTwoSelected}
                                      onUpdateSplits={handleUpdateSplits}
                                      onUpdateBudgetDate={handleUpdateBudgetDate}
                                      posting={loading}
                                      newCount={newTxs.length}
                                      newClassifiedCount={newClassified.length}
                                      stillNeedingReview={stillNeedingReview}
                                    />}
        {tab === 'rules'        && <RulesEditor
                                      rules={rules}
                                      lineNames={lineNames}
                                      onSave={handleSaveRules}
                                      saving={loading}
                                    />}
        {tab === 'budget'       && <BudgetEditor
                                      budget={budget}
                                      budgetOverrides={budgetOverrides}
                                      onSaveOverrides={handleSaveBudgetOverrides}
                                      anchorDay={settings.anchorDay}
                                      settings={settings}
                                      onSave={handleSaveBudget}
                                      saving={loading}
                                    />}
        {tab === 'setup'        && <SetupPanel
                                      config={config}
                                      setConfig={setConfig}
                                      onSync={() => loadFromSheet({ pull: true })}
                                      onReload={() => loadFromSheet()}
                                      loading={loading}
                                      hasData={allTxs.length > 0}
                                    />}
      </main>

      <footer className="max-w-7xl mx-auto px-6 pb-10 text-xs text-stone-500">
        Sheet is canonical. localStorage caches the last snapshot for offline view. Overrides live locally until you post to history.
      </footer>

      {/* Floating chat toggle + panel — opt-in to AI by setting GEMINI_API_KEY */}
      {configured && (
        <button
          onClick={() => setChatOpen(!chatOpen)}
          title="Ask CapiTracker AI about your budget"
          className="fixed bottom-5 right-5 w-12 h-12 rounded-full bg-slate-800 hover:bg-slate-700 text-white shadow-lg flex items-center justify-center z-40">
          <span className="text-xl leading-none">{chatOpen ? '×' : '💬'}</span>
        </button>
      )}
      {chatOpen && configured && (
        <ChatBot
          messages={chatMessages}
          sending={chatSending}
          scope={chatScope}
          setScope={setChatScope}
          onSend={handleChatSend}
          onClose={() => setChatOpen(false)}
          onClear={() => setChatMessages([])}
        />
      )}
    </div>
  );
}

/* ============================================================================
   ChatBot — slide-in panel that talks to the user's Gemini via Apps Script.
   Requires GEMINI_API_KEY set as a Script Property; if not set, the first
   send will surface a clear error.
   ========================================================================== */
function ChatBot({ messages, sending, scope, setScope, onSend, onClose, onClear }) {
  const [input, setInput] = useState('');
  const listRef = React.useRef(null);

  // Auto-scroll to the latest message
  useEffect(() => {
    if (listRef.current) listRef.current.scrollTop = listRef.current.scrollHeight;
  }, [messages, sending]);

  const submit = () => {
    if (!input.trim() || sending) return;
    onSend(input);
    setInput('');
  };

  const scopeLabels = {
    'window':  'This cycle',
    'last30':  'Last 30 days',
    'last90':  'Last 90 days',
    'all':     'All history',
  };

  const suggested = [
    "How much have I spent on Eating Out this cycle?",
    "What's my biggest expense this cycle?",
    "Am I on track with my budget?",
    "Which budget lines am I over on?",
  ];

  return (
    <div className="fixed bottom-20 right-5 w-96 max-w-[calc(100vw-2.5rem)] bg-white border border-stone-300 rounded-sm shadow-xl z-40 flex flex-col"
         style={{ maxHeight: 'calc(100vh - 7rem)' }}>
      <div className="px-4 py-2.5 border-b border-stone-200 bg-slate-800 text-stone-100">
        <div className="flex items-center justify-between mb-1.5">
          <div>
            <div className="font-display text-sm">🪙 CapiTracker AI</div>
            <div className="text-[10px] text-stone-400">Asks Gemini using your transactions as context</div>
          </div>
          <div className="flex items-center gap-2">
            {messages.length > 0 && (
              <button onClick={onClear} className="text-[10px] uppercase tracking-wider text-stone-400 hover:text-stone-100">Clear</button>
            )}
            <button onClick={onClose} className="text-stone-400 hover:text-stone-100 text-xl leading-none px-1">×</button>
          </div>
        </div>
        <div className="flex items-center gap-2">
          <span className="text-[10px] uppercase tracking-wider text-stone-400">Scope:</span>
          <select value={scope} onChange={e => setScope(e.target.value)}
                  className="text-xs bg-slate-700 border border-slate-600 text-stone-100 px-2 py-0.5">
            {Object.entries(scopeLabels).map(([v, label]) => (
              <option key={v} value={v}>{label}</option>
            ))}
          </select>
        </div>
      </div>

      <div ref={listRef} className="flex-1 overflow-y-auto px-4 py-3 space-y-3" style={{ minHeight: '20rem' }}>
        {messages.length === 0 && (
          <div className="text-xs text-stone-500 space-y-2">
            <div>Ask anything about your budget. Examples:</div>
            <div className="flex flex-col gap-1.5">
              {suggested.map((s, i) => (
                <button key={i} onClick={() => onSend(s)}
                        className="text-left px-2 py-1.5 border border-stone-200 hover:bg-stone-50 text-stone-700 text-xs rounded-sm">
                  {s}
                </button>
              ))}
            </div>
            <div className="text-[10px] text-stone-400 pt-2 border-t border-stone-100">
              Privacy: your transactions are sent to Google's Gemini API for each question. No training, 30-day retention then deletion. Disable by removing GEMINI_API_KEY from Script Properties.
            </div>
          </div>
        )}
        {messages.map((m, i) => (
          <div key={i} className={m.role === 'user' ? 'flex justify-end' : 'flex justify-start'}>
            <div className={`max-w-[85%] px-3 py-2 text-sm rounded-sm whitespace-pre-wrap ${
              m.role === 'user' ? 'bg-slate-800 text-stone-100'
              : m.error ? 'bg-red-50 text-red-800 border border-red-200'
              : 'bg-stone-100 text-stone-800'
            }`}>
              {m.text}
            </div>
          </div>
        ))}
        {sending && (
          <div className="flex justify-start">
            <div className="bg-stone-100 text-stone-500 text-xs px-3 py-2 italic">Thinking…</div>
          </div>
        )}
      </div>

      <div className="px-3 py-2 border-t border-stone-200 flex items-center gap-2">
        <input
          value={input}
          onChange={e => setInput(e.target.value)}
          onKeyDown={e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submit(); } }}
          placeholder="Ask about your budget…"
          disabled={sending}
          className="flex-1 px-2 py-1.5 border border-stone-300 text-sm disabled:opacity-50"
        />
        <button onClick={submit} disabled={sending || !input.trim()}
                className="px-3 py-1.5 text-xs uppercase tracking-wider font-medium border border-slate-800 bg-slate-800 text-white hover:bg-slate-700 disabled:opacity-50">
          Send
        </button>
      </div>
    </div>
  );
}
