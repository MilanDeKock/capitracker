/* ============================================================================
   Forecast panel — inline expansion under a Budget vs Actual row.
   Shows where the line is expected to land by payday, based on the line's
   Forecast type configured in the Budget tab.
   ========================================================================== */
function ForecastPanel({ line, actual, daysElapsed, daysLeft, daysInCycle, petrolPrice, petrolError }) {
  const type = line.forecast || '';
  const absActual = Math.abs(actual);
  const budgetAmt = line.amount || 0;
  const remaining = budgetAmt - absActual;

  if (type === 'daily') {
    const dailyBurn = daysElapsed > 0 ? absActual / daysElapsed : 0;
    const projected = absActual + (dailyBurn * daysLeft);
    const projOverBy = projected - budgetAmt;
    return (
      <div className="grid grid-cols-2 md:grid-cols-4 gap-4 text-sm">
        <Field label="Day in cycle">{daysElapsed} of {daysInCycle} ({daysLeft} left)</Field>
        <Field label="Daily burn so far">{fmt(dailyBurn)}/day</Field>
        <Field label="Projected by payday">
          <span className={projected > budgetAmt ? 'text-red-700 font-num' : 'text-emerald-700 font-num'}>{fmt(projected)}</span>
        </Field>
        <Field label={projOverBy > 0 ? 'Will overspend by' : 'Will save'}>
          <span className={projOverBy > 0 ? 'text-red-700 font-num' : 'text-emerald-700 font-num'}>{fmt(Math.abs(projOverBy))}</span>
        </Field>
      </div>
    );
  }

  if (type === 'fixed') {
    const paid = absActual > 0;
    return (
      <div className="grid grid-cols-2 md:grid-cols-3 gap-4 text-sm">
        <Field label="Type">Fixed debit (one-off this cycle)</Field>
        <Field label="Status">
          {paid
            ? <span className="text-emerald-700">Paid — R{fmt(absActual)}</span>
            : <span className="text-amber-700">Still to debit ({daysLeft} days left)</span>}
        </Field>
        <Field label="Remaining commitment">
          <span className="font-num">{paid ? fmt(0) : fmt(remaining > 0 ? remaining : budgetAmt)}</span>
        </Field>
      </div>
    );
  }

  if (type === 'petrol') {
    const l100 = Number(line.l100) || 0;
    const kmPerDay = Number(line.kmPerDay) || 0;
    const litresPerDay = (l100 * kmPerDay) / 100;
    const price = petrolPrice ? Number(petrolPrice.price) : null;
    const dailyCost = price ? litresPerDay * price : null;
    const projected = price ? absActual + (dailyCost * daysLeft) : null;
    const projOverBy = projected != null ? projected - budgetAmt : null;
    return (
      <div className="space-y-3">
        <div className="text-[11px] text-stone-500">
          Live coastal price from Astron Energy (cached 6h).{' '}
          {price ? <>Currently <span className="font-num text-stone-800">R{price.toFixed(2)}/L</span>{petrolPrice && petrolPrice.asOf ? <> · as of {new Date(petrolPrice.asOf).toLocaleString('en-ZA')}</> : null}.</>
                 : petrolError ? <span className="text-red-700">price unavailable: {petrolError}</span>
                                : <span>fetching…</span>}
        </div>
        <div className="grid grid-cols-2 md:grid-cols-4 gap-4 text-sm">
          <Field label="Your usage">{l100 || '–'} L/100 · {kmPerDay || '–'} km/day</Field>
          <Field label="Daily cost">{dailyCost != null ? fmt(dailyCost) + '/day' : '–'}</Field>
          <Field label="Projected by payday">
            {projected != null
              ? <span className={projected > budgetAmt ? 'text-red-700 font-num' : 'text-emerald-700 font-num'}>{fmt(projected)}</span>
              : '–'}
          </Field>
          <Field label={projOverBy != null && projOverBy > 0 ? 'Will overspend by' : 'Will save'}>
            {projOverBy != null
              ? <span className={projOverBy > 0 ? 'text-red-700 font-num' : 'text-emerald-700 font-num'}>{fmt(Math.abs(projOverBy))}</span>
              : '–'}
          </Field>
        </div>
        {(!l100 || !kmPerDay) && (
          <div className="text-xs text-amber-800 bg-amber-50 border border-amber-200 px-3 py-2">
            Set <strong>L/100</strong> and <strong>km/day</strong> for this line in the Budget tab to enable petrol forecasting.
          </div>
        )}
      </div>
    );
  }

  return (
    <div className="text-xs text-stone-500">
      No forecast set. Edit this line on the Budget tab and pick a Forecast type (Daily burn, Fixed debit, or Petrol).
    </div>
  );
}

/* ============================================================================
   Dashboard
   ========================================================================== */
function Dashboard({ budget: defaultBudget, budgetOverrides, effectiveBudgetForCycle, actuals, settings, dateRange, setDateRange, defaultRange, windowTxs, allCycles, cycleActuals, hasData, privateMode, setPrivateMode, rawStatements, onSaveSettings, balanceOverride, setBalanceOverride, onFetchPetrolPrice }) {
  if (!hasData) return <EmptyState />;

  // Resolve the budget for the currently-viewed cycle (defaults + any per-cycle
  // overrides). All downstream computations and tables read from this `budget`,
  // so overrides flow through to Budget vs Actual, Cashflow, Running watch, etc.
  // without any other code needing to know about overrides.
  const currentCycleKey = cycleKey(dateRange.from, settings.anchorDay);
  const budget = effectiveBudgetForCycle
    ? effectiveBudgetForCycle(currentCycleKey)
    : defaultBudget;
  const hasOverridesForCycle = budget.some(b => b.overridden);

  const stepCycle = (dir) => {
    const cur = parseISO(dateRange.from);
    if (!cur) return;
    const newStart = new Date(cur.getFullYear(), cur.getMonth() + dir, cur.getDate());
    const newEndExcl = new Date(newStart.getFullYear(), newStart.getMonth() + 1, newStart.getDate());
    const newEndIncl = new Date(newEndExcl);
    newEndIncl.setDate(newEndIncl.getDate() - 1);
    setDateRange({ from: toISO(newStart), to: toISO(newEndIncl) });
  };

  const totalBudget = budget.reduce((s, b) => s + b.amount, 0);
  const totalActual = budget.filter(b => b.line !== 'Reimbursable').reduce((s, b) => s + (actuals[b.line] || 0), 0);
  const gap         = settings.netIncome - totalActual;
  const budgetGap   = settings.netIncome - totalBudget;

  // ===== Cashflow: latest balance per account + outstanding commitments =====
  const invertedAccounts = (settings.invertedAccounts || []);
  const isAccountInverted = (acc) => invertedAccounts.includes(acc);

  // Group raw statement rows by account, keep the most recent (by date) for each.
  // Sheet rows preserve a Balance column; history rows don't, so use rawStatements.
  const latestBalances = useMemo(() => {
    const result = {};
    for (const r of (rawStatements || [])) {
      if (r.balance === null || r.balance === undefined || !isFinite(r.balance)) continue;
      const acc = r.account || '(unlabelled)';
      if (!result[acc] || (r.date || '') > result[acc].date) {
        result[acc] = { account: acc, balance: r.balance, date: r.date || '' };
      }
    }
    return Object.values(result).sort((a, b) => a.account.localeCompare(b.account));
  }, [rawStatements]);

  const effectiveBalances = latestBalances.map(b => ({
    ...b,
    effective: isAccountInverted(b.account) ? -b.balance : b.balance,
  }));

  const computedCashPosition = effectiveBalances.reduce((s, b) => s + b.effective, 0);
  // If the user manually adjusted their balance to reflect real-life lag,
  // honour it. They can clear it any time.
  const cashPosition = (balanceOverride && Number.isFinite(balanceOverride.amount))
    ? balanceOverride.amount
    : computedCashPosition;
  const balanceIsAdjusted = !!(balanceOverride && Number.isFinite(balanceOverride.amount));
  const [editingBalance, setEditingBalance] = useState(false);
  const [balanceDraft, setBalanceDraft] = useState('');

  // Outstanding = future commitments still to leave the bank this cycle.
  // Overspend already came out of bank balance, so it's not added again here.
  const outstandingCommitments = budget.reduce((s, b) => s + Math.max(0, b.amount - (actuals[b.line] || 0)), 0);

  const freeToSpend = cashPosition - outstandingCommitments;

  const latestSyncDate = latestBalances.reduce((d, b) => (b.date && b.date > d ? b.date : d), '');

  const toggleAccountInverted = (acc) => {
    const next = invertedAccounts.includes(acc)
      ? invertedAccounts.filter(a => a !== acc)
      : [...invertedAccounts, acc];
    if (onSaveSettings) onSaveSettings({ ...settings, invertedAccounts: next });
  };

  const [cashflowExpanded, setCashflowExpanded] = useState(false);
  // Cashflow only makes sense for the current cycle — Bank balance / Outstanding
  // / Free now are inherently "right now" numbers. Hide when the user has
  // navigated to a previous or future cycle so they don't misread historical
  // budget remainders as current cash position.
  const isCurrentCycle = dateRange.from === defaultRange.from && dateRange.to === defaultRange.to;

  // ===== Forecast panel state (per budget line) =====
  // Click a budget line on the Budget vs Actual table to expand a forecast.
  // Logic uses the line's Forecast type set in the Budget tab:
  //   daily  — extrapolate from current burn rate to payday
  //   fixed  — show as one-off debit (paid / unpaid)
  //   petrol — multiply live coastal price by your L/100 + km/day
  const [expandedBudgetLine, setExpandedBudgetLine] = useState(null);
  const [petrolPrice, setPetrolPrice] = useState(null); // {price, asOf} or null
  const [petrolError, setPetrolError] = useState(null);
  // Pull live coastal petrol price once per session when the user opens any
  // petrol-forecast line. Cached server-side for 6h, so this only really
  // hits Astron a few times a day across all users.
  useEffect(() => {
    if (!expandedBudgetLine || !onFetchPetrolPrice) return;
    const exp = budget.find(b => b.line === expandedBudgetLine);
    if (!exp || exp.forecast !== 'petrol' || petrolPrice || petrolError) return;
    let cancelled = false;
    (async () => {
      try {
        const res = await onFetchPetrolPrice();
        if (!cancelled && res && res.ok && res.price) {
          setPetrolPrice({ price: res.price, asOf: res.asOf });
        } else if (!cancelled) {
          setPetrolError(res && res.error ? res.error : 'price unavailable');
        }
      } catch (e) {
        if (!cancelled) setPetrolError(e.message || String(e));
      }
    })();
    return () => { cancelled = true; };
  }, [expandedBudgetLine, budget, petrolPrice, petrolError, onFetchPetrolPrice]);

  // Days helpers — used by the daily-burn and petrol forecasts.
  const todayISO = toISO(new Date());
  const cycleStart = isCurrentCycle ? defaultRange.from : dateRange.from;
  const cycleEnd   = isCurrentCycle ? defaultRange.to   : dateRange.to;
  const cycleStartDate = parseISO(cycleStart);
  const cycleEndDate   = parseISO(cycleEnd);
  const todayDate      = parseISO(todayISO);
  const daysInCycle  = cycleStartDate && cycleEndDate ? Math.max(1, Math.round((cycleEndDate - cycleStartDate) / 86400000) + 1) : 30;
  const daysElapsed  = cycleStartDate && todayDate    ? Math.max(1, Math.min(daysInCycle, Math.round((todayDate - cycleStartDate) / 86400000) + 1)) : 1;
  const daysLeft     = Math.max(0, daysInCycle - daysElapsed);
  // By-cycle table is collapsed by default — useful but noisy day-to-day.
  // Persist so the user's preference sticks across reloads.
  const [byCycleExpanded, _setByCycleExpanded] = useState(() => loadLS(K.byCycleExpanded, false));
  const setByCycleExpanded = (v) => { _setByCycleExpanded(v); saveLS(K.byCycleExpanded, v); };

  // Running watch — user picks any budget line; falls back gracefully if the
  // saved line no longer exists (e.g. user renamed/removed it).
  const budgetLineNames = budget.map(b => b.line);
  const [storedWatchLine, _setWatchLine] = useState(() => loadLS(K.watchLine, null));
  const setWatchLine = (v) => { _setWatchLine(v); saveLS(K.watchLine, v); };
  const watchLine = budgetLineNames.includes(storedWatchLine)
    ? storedWatchLine
    : (budgetLineNames.includes('Bok Fonds') ? 'Bok Fonds' : (budgetLineNames[0] || ''));
  // Build the watched-line activity list. Spends (negative) add to the running
  // total; credits/income (positive) subtract. Split rows contribute only their
  // portion of the watched line, with the row's sign preserved.
  const watchTx = windowTxs.flatMap(t => {
    if (!t.amount) return [];
    if (t.splits && t.splits.length) {
      const match = t.splits.find(s => s.line === watchLine);
      if (!match) return [];
      const signed = t.amount < 0 ? -Math.abs(match.amount) : Math.abs(match.amount);
      return [{ ...t, amount: signed, description: `${t.description} (split)` }];
    }
    return t.line === watchLine ? [t] : [];
  }).sort((a, b) => effectiveDate(a).localeCompare(effectiveDate(b)));
  const watchBudget = budget.find(b => b.line === watchLine)?.amount || 0;
  let watchRun = 0;
  const watchWithRun = watchTx.map(t => { watchRun -= t.amount; return { ...t, running: watchRun }; });

  return (
    <div className="space-y-6">
      <div className="bg-white border border-stone-300 rounded-sm p-4 flex items-center gap-3 flex-wrap">
        <div className="text-xs uppercase tracking-wider text-stone-500">Window</div>
        <input type="date" value={dateRange.from} onChange={e => setDateRange({ ...dateRange, from: e.target.value })} className="px-2 py-1 border border-stone-300 text-sm font-num" />
        <span className="text-stone-400">→</span>
        <input type="date" value={dateRange.to} onChange={e => setDateRange({ ...dateRange, to: e.target.value })} className="px-2 py-1 border border-stone-300 text-sm font-num" />
        <div className="flex items-center gap-1 ml-2">
          <button onClick={() => stepCycle(-1)} className="px-2 py-1 text-xs border border-stone-300 hover:bg-stone-100">← prev cycle</button>
          <button onClick={() => setDateRange(defaultRange)} className="px-2 py-1 text-xs border border-stone-300 hover:bg-stone-100">current</button>
          <button onClick={() => stepCycle(1)} className="px-2 py-1 text-xs border border-stone-300 hover:bg-stone-100">next cycle →</button>
        </div>
        <div className="ml-auto flex items-center gap-3">
          <span className="text-xs text-stone-500">{windowTxs.length} txs · anchor day {settings.anchorDay}</span>
          <button
            onClick={() => setPrivateMode(!privateMode)}
            title={privateMode ? 'Show amounts' : 'Hide amounts'}
            className="p-1.5 border border-stone-300 text-stone-600 hover:bg-stone-100 hover:text-stone-900">
            {privateMode ? <IconEyeOff className="w-4 h-4" /> : <IconEye className="w-4 h-4" />}
          </button>
        </div>
      </div>

      {latestBalances.length > 0 && isCurrentCycle && (
        <div className="bg-white border border-stone-300 rounded-sm overflow-hidden">
          <div className="px-5 py-3 border-b border-stone-200 flex items-center justify-between flex-wrap gap-2">
            <div>
              <h2 className="font-display text-lg">Cashflow</h2>
              <div className="text-xs text-stone-500 mt-0.5">What's actually free to spend, after the bills still to leave the bank this cycle.</div>
            </div>
            <button onClick={() => setCashflowExpanded(!cashflowExpanded)}
                    className="text-xs uppercase tracking-wider text-stone-500 hover:text-stone-900">
              {cashflowExpanded ? 'collapse ▲' : 'breakdown ▼'}
            </button>
          </div>
          <div className="grid grid-cols-3 gap-px bg-stone-200">
            <div className="bg-white px-5 py-4">
              <div className="text-xs uppercase tracking-wider text-stone-500 mb-1 flex items-center justify-between gap-2">
                <span>Bank balance{balanceIsAdjusted && <span className="ml-1.5 text-indigo-700 normal-case tracking-normal">· adjusted</span>}</span>
                {!editingBalance && (
                  <button onClick={() => { setBalanceDraft(String(cashPosition)); setEditingBalance(true); }}
                          title="Adjust to your real-time bank balance (statement balance may lag actual)"
                          className="text-[11px] uppercase tracking-wider px-2 py-0.5 border border-stone-300 text-stone-600 hover:bg-stone-100 hover:text-stone-900 hover:border-stone-500">
                    ✎ {balanceIsAdjusted ? 'edit' : 'adjust'}
                  </button>
                )}
              </div>
              {editingBalance ? (
                <div className="flex items-center gap-1">
                  <span className="text-stone-500">R</span>
                  <input type="number" value={balanceDraft} onChange={e => setBalanceDraft(e.target.value)}
                         onKeyDown={e => {
                           if (e.key === 'Enter') {
                             const n = parseFloat(balanceDraft);
                             if (Number.isFinite(n)) setBalanceOverride({ amount: n, setAtMS: Date.now() });
                             setEditingBalance(false);
                           } else if (e.key === 'Escape') {
                             setEditingBalance(false);
                           }
                         }}
                         autoFocus
                         className="px-2 py-1 border border-indigo-400 text-xl font-num w-32" />
                  <button onClick={() => {
                            const n = parseFloat(balanceDraft);
                            if (Number.isFinite(n)) setBalanceOverride({ amount: n, setAtMS: Date.now() });
                            setEditingBalance(false);
                          }}
                          className="text-[10px] uppercase tracking-wider px-2 py-1 border border-slate-800 bg-slate-800 text-white hover:bg-slate-700">
                    Set
                  </button>
                  <button onClick={() => setEditingBalance(false)}
                          className="text-[10px] uppercase tracking-wider px-2 py-1 text-stone-500 hover:text-stone-900">
                    Cancel
                  </button>
                </div>
              ) : (
                <button onClick={() => { setBalanceDraft(String(cashPosition)); setEditingBalance(true); }}
                        title="Click to adjust to your real-time bank balance"
                        className={`text-2xl font-num text-left hover:underline decoration-dotted underline-offset-4 ${cashPosition < 0 ? 'text-red-700' : balanceIsAdjusted ? 'text-indigo-800' : 'text-stone-900'} ${privateMode ? 'blur-sm select-none' : ''}`}>
                  {fmt(cashPosition)}
                </button>
              )}
              <div className="text-xs text-stone-500 mt-1 flex items-center gap-2 flex-wrap">
                {balanceIsAdjusted ? (
                  <>
                    <span>manually set</span>
                    <button onClick={() => setBalanceOverride(null)} className="text-stone-500 hover:text-red-700 underline">use {fmt(computedCashPosition)} from statement instead</button>
                  </>
                ) : (
                  <span>across {latestBalances.length} account{latestBalances.length === 1 ? '' : 's'} · click to adjust</span>
                )}
              </div>
            </div>
            <div className="bg-white px-5 py-4">
              <div className="text-xs uppercase tracking-wider text-stone-500 mb-1">Outstanding</div>
              <div className={`text-2xl font-num text-stone-700 ${privateMode ? 'blur-sm select-none' : ''}`}>−{fmt(outstandingCommitments)}</div>
              <div className="text-xs text-stone-500 mt-1">budgeted but unspent</div>
            </div>
            <div className="bg-white px-5 py-4">
              <div className="text-xs uppercase tracking-wider text-stone-500 mb-1">Free now</div>
              <div className={`text-2xl font-num ${freeToSpend < 0 ? 'text-red-700' : 'text-emerald-700'} ${privateMode ? 'blur-sm select-none' : ''}`}>{fmt(freeToSpend)}</div>
              <div className="text-xs text-stone-500 mt-1">cash minus commitments</div>
            </div>
          </div>

          {cashflowExpanded && (
            <div className="px-5 py-4 border-t border-stone-200 space-y-5">
              <div>
                <div className="text-xs uppercase tracking-wider text-stone-500 mb-2 flex items-center justify-between flex-wrap gap-2">
                  <span>Accounts</span>
                  <span className="normal-case tracking-normal text-stone-500 text-[11px]">Each account's balance is from its most recent synced transaction. Stale accounts get older as time passes — re-sync to refresh.</span>
                </div>
                <table className="w-full text-sm">
                  <tbody>
                    {effectiveBalances.map(b => {
                      const inv = isAccountInverted(b.account);
                      const parsed = parseISO(b.date);
                      const ageDays = parsed ? Math.floor((Date.now() - parsed.getTime()) / (1000 * 60 * 60 * 24)) : null;
                      const staleClass = ageDays == null ? '' : ageDays > 14 ? 'text-red-700' : ageDays > 7 ? 'text-amber-700' : 'text-stone-500';
                      return (
                        <tr key={b.account} className="border-b border-stone-100">
                          <td className="py-1.5">
                            <div className="text-xs text-stone-700">{b.account}</div>
                            <div className={`text-[10px] ${staleClass}`}>
                              as of {b.date || '—'}{ageDays != null && ageDays >= 1 ? ` (${ageDays}d ago)` : ageDays === 0 ? ' (today)' : ''}
                            </div>
                          </td>
                          <td className={`py-1.5 text-right font-num text-xs ${b.balance < 0 ? 'text-red-700' : ''} ${privateMode ? 'blur-sm select-none' : ''}`}>{fmt(b.balance)}</td>
                          <td className="py-1.5 text-right pr-2">
                            <button onClick={() => toggleAccountInverted(b.account)}
                                    title={inv ? 'Sign inverted — click to revert' : 'Flip sign for this account. Use if your bank represents credit-card debt with the opposite convention.'}
                                    className={`text-[10px] uppercase tracking-wider px-1.5 py-0.5 border ${inv ? 'border-indigo-300 bg-indigo-50 text-indigo-800' : 'border-stone-300 text-stone-500 hover:bg-stone-100'}`}>
                              {inv ? '⇅ inverted' : '⇅ flip'}
                            </button>
                          </td>
                          <td className={`py-1.5 text-right font-num font-medium ${b.effective < 0 ? 'text-red-700' : ''} ${privateMode ? 'blur-sm select-none' : ''}`}>{fmt(b.effective)}</td>
                        </tr>
                      );
                    })}
                    <tr className="font-medium bg-stone-50">
                      <td className="py-2 pl-1">Cash position</td><td></td><td></td>
                      <td className={`py-2 text-right font-num ${cashPosition < 0 ? 'text-red-700' : ''} ${privateMode ? 'blur-sm select-none' : ''}`}>{fmt(cashPosition)}</td>
                    </tr>
                  </tbody>
                </table>
                {effectiveBalances.some(b => {
                  const p = parseISO(b.date); if (!p) return false;
                  return Math.floor((Date.now() - p.getTime()) / 86400000) > 7;
                }) && (
                  <div className="text-[11px] text-amber-800 bg-amber-50 border border-amber-200 px-3 py-2 mt-2">
                    One or more accounts haven't had a fresh statement in over a week. Email yourself a current statement for each stale account, then click <strong>Sync CSV</strong> or <strong>Sync PDF</strong> to refresh. Or use the <strong>adjust</strong> button on Bank balance for a manual override.
                  </div>
                )}
              </div>

              <div>
                <div className="text-xs uppercase tracking-wider text-stone-500 mb-2">Outstanding by budget line</div>
                <table className="w-full text-sm">
                  <tbody>
                    {budget.map(b => {
                      const act = actuals[b.line] || 0;
                      const remaining = b.amount - act;
                      if (b.amount === 0 && act === 0) return null;
                      return (
                        <tr key={b.line} className="border-b border-stone-100 text-xs">
                          <td className="py-1.5 text-stone-700">{b.line}</td>
                          <td className={`py-1.5 text-right font-num text-stone-500 ${privateMode ? 'blur-sm select-none' : ''}`}>R{b.amount.toLocaleString('en-ZA')} budget</td>
                          <td className={`py-1.5 text-right font-num text-stone-500 ${privateMode ? 'blur-sm select-none' : ''}`}>{fmt(act)} spent</td>
                          <td className={`py-1.5 text-right font-num font-medium ${remaining < 0 ? 'text-red-700' : remaining > 0 ? 'text-stone-900' : 'text-stone-500'} ${privateMode ? 'blur-sm select-none' : ''}`}>
                            {remaining > 0 ? `${fmt(remaining)} still due` : remaining < 0 ? `${fmt(Math.abs(remaining))} over` : '—'}
                          </td>
                        </tr>
                      );
                    })}
                    <tr className="font-medium bg-stone-50 text-xs">
                      <td className="py-2 pl-1">Total outstanding (under-budget lines only)</td><td></td><td></td>
                      <td className={`py-2 text-right font-num ${privateMode ? 'blur-sm select-none' : ''}`}>{fmt(outstandingCommitments)}</td>
                    </tr>
                  </tbody>
                </table>
              </div>

              {latestSyncDate && (
                <div className="text-[11px] text-stone-500 italic">
                  Balances as of {latestSyncDate}. Hit <strong>Sync CSV</strong> or <strong>Sync PDF</strong> for fresh data.
                </div>
              )}
            </div>
          )}
        </div>
      )}

      <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
        <KPI label="Net income"            value={settings.netIncome} tone="neutral"                                                              blurred={privateMode} />
        <KPI label="Budgeted spend"        value={totalBudget}        tone="neutral" sub={`Surplus on paper: ${fmtSigned(budgetGap)}`}            blurred={privateMode} />
        <KPI label="Actual spend (window)" value={totalActual}        tone={totalActual > totalBudget ? 'over' : 'under'} sub={`${prettyDate(dateRange.from)} → ${prettyDate(dateRange.to)}`} blurred={privateMode} />
        <KPI label="Real gap"              value={gap}                tone={gap < 0 ? 'over' : 'under'} sub={gap < 0 ? 'spending exceeds income' : 'within income'}                              blurred={privateMode} />
      </div>

      <div className="bg-white border border-stone-300 rounded-sm overflow-hidden">
        <div className="px-5 py-3 border-b border-stone-200 flex items-center justify-between">
          <h2 className="font-display text-lg">Budget vs Actual (selected window)</h2>
          <div className="text-xs text-stone-500">{prettyDate(dateRange.from)} → {prettyDate(dateRange.to)}</div>
        </div>
        <table className="w-full text-sm">
          <thead>
            <tr className="text-xs uppercase tracking-wider text-stone-500 border-b border-stone-200">
              <th className="text-left px-5 py-2 font-medium">Line</th>
              <th className="text-right px-3 py-2 font-medium">Budget</th>
              <th className="text-right px-3 py-2 font-medium">Actual</th>
              <th className="text-right px-3 py-2 font-medium">Variance</th>
              <th className="text-right px-3 py-2 font-medium">%</th>
              <th className="text-center px-5 py-2 font-medium">Status</th>
            </tr>
          </thead>
          <tbody>
            {budget.map(b => {
              const act = actuals[b.line] || 0;
              const variance = b.amount - act;
              const pct = b.amount > 0 ? (act / b.amount) : 0;
              let status = '—';
              if (b.amount > 0) {
                if (act > b.amount * 1.05) status = 'OVER';
                else if (act < b.amount * 0.95) status = 'under';
                else status = 'on track';
              }
              const isExpanded = expandedBudgetLine === b.line;
              const hasForecast = b.forecast === 'daily' || b.forecast === 'fixed' || b.forecast === 'petrol';
              return (
                <React.Fragment key={b.line}>
                  <tr className={`border-b border-stone-100 hover:bg-stone-50 ${isCurrentCycle ? 'cursor-pointer' : ''} ${isExpanded ? 'bg-amber-50' : ''}`}
                      onClick={isCurrentCycle ? () => setExpandedBudgetLine(isExpanded ? null : b.line) : undefined}
                      title={isCurrentCycle ? 'Click for forecast' : ''}>
                    <td className="px-5 py-2">
                      {b.line}
                      {hasForecast && <span className="ml-1.5 text-[9px] uppercase tracking-wider text-stone-400">{isExpanded ? '▲' : '▼'}</span>}
                    </td>
                    <td className="px-3 py-2 text-right font-num text-stone-700">{fmt(b.amount)}</td>
                    <td className="px-3 py-2 text-right font-num">{fmt(act)}</td>
                    <td className={`px-3 py-2 text-right font-num ${variance < 0 ? 'text-red-700' : 'text-stone-700'}`}>{fmtSigned(variance)}</td>
                    <td className="px-3 py-2 text-right font-num text-stone-500 text-xs">{b.amount > 0 ? `${(pct * 100).toFixed(0)}%` : '–'}</td>
                    <td className="px-5 py-2 text-center"><StatusPill status={status} /></td>
                  </tr>
                  {isExpanded && isCurrentCycle && (
                    <tr className="border-b border-stone-200 bg-amber-50/60">
                      <td colSpan="6" className="px-5 py-3">
                        <ForecastPanel
                          line={b}
                          actual={act}
                          daysElapsed={daysElapsed}
                          daysLeft={daysLeft}
                          daysInCycle={daysInCycle}
                          petrolPrice={petrolPrice}
                          petrolError={petrolError}
                        />
                      </td>
                    </tr>
                  )}
                </React.Fragment>
              );
            })}
          </tbody>
        </table>
      </div>

      {watchLine && (
        <div className="bg-white border border-stone-300 rounded-sm overflow-hidden">
          <div className="px-5 py-3 border-b border-stone-200 flex items-start gap-3 flex-wrap">
            <div className="min-w-0">
              <h2 className="font-display text-lg">Running watch</h2>
              <div className="text-xs text-stone-500 mt-0.5">
                Track running spend for one budget line.
                {watchBudget > 0 && <> Red row = running total has passed R{watchBudget.toLocaleString()} for the selected window.</>}
              </div>
            </div>
            <div className="ml-auto flex items-center gap-2">
              <label className="text-xs uppercase tracking-wider text-stone-500">Line</label>
              <select
                value={watchLine}
                onChange={e => setWatchLine(e.target.value)}
                className="px-2 py-1 border border-stone-300 text-sm bg-white">
                {budget.map(b => (
                  <option key={b.line} value={b.line}>{b.line}</option>
                ))}
              </select>
            </div>
          </div>
          {watchWithRun.length === 0 ? (
            <div className="px-5 py-8 text-center text-sm text-stone-500">
              No transactions tagged to <span className="font-medium text-stone-700">{watchLine}</span> in this cycle yet.
            </div>
          ) : (
            <div className="max-h-96 overflow-y-auto">
              <table className="w-full text-sm">
                <thead className="sticky top-0 bg-white">
                  <tr className="text-xs uppercase tracking-wider text-stone-500 border-b border-stone-200">
                    <th className="text-left px-5 py-2 font-medium">Date</th>
                    <th className="text-left px-3 py-2 font-medium">Description</th>
                    <th className="text-right px-3 py-2 font-medium">Amount</th>
                    <th className="text-right px-5 py-2 font-medium">Running</th>
                  </tr>
                </thead>
                <tbody>
                  {watchWithRun.map((t, i) => {
                    const over   = watchBudget > 0 && t.running > watchBudget;
                    const credit = t.amount > 0;
                    return (
                      <tr key={t.hash || i} className={`border-b border-stone-100 ${over ? 'bg-red-50' : ''}`}>
                        <td className="px-5 py-1.5 font-num text-stone-600 text-xs">{effectiveDate(t)}</td>
                        <td className="px-3 py-1.5 truncate max-w-md">{t.description}</td>
                        <td className={`px-3 py-1.5 text-right font-num ${credit ? 'text-emerald-700' : 'text-stone-900'}`}>
                          {credit ? '−' : ''}{fmt(Math.abs(t.amount))}
                        </td>
                        <td className={`px-5 py-1.5 text-right font-num font-medium ${over ? 'text-red-700' : ''}`}>{fmt(t.running)}</td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          )}
        </div>
      )}

      {allCycles.length > 1 && (
        <div className="bg-white border border-stone-300 rounded-sm overflow-hidden">
          <button onClick={() => setByCycleExpanded(!byCycleExpanded)}
                  className="w-full px-5 py-3 border-b border-stone-200 flex items-center justify-between hover:bg-stone-50">
            <div className="text-left">
              <h2 className="font-display text-lg">By cycle</h2>
              <div className="text-xs text-stone-500 mt-0.5">Pay-cycle totals (anchor day {settings.anchorDay})</div>
            </div>
            <span className="text-xs uppercase tracking-wider text-stone-500">
              {byCycleExpanded ? 'collapse ▲' : 'expand ▼'}
            </span>
          </button>
          {byCycleExpanded && (
            <div className="overflow-x-auto">
              <table className="w-full text-sm">
                <thead>
                  <tr className="text-xs uppercase tracking-wider text-stone-500 border-b border-stone-200">
                    <th className="text-left px-5 py-2 font-medium">Line</th>
                    {allCycles.map(c => <th key={c} className="text-right px-3 py-2 font-medium whitespace-nowrap">{prettyCycle(c, settings.anchorDay)}</th>)}
                  </tr>
                </thead>
                <tbody>
                  {budget.map(b => (
                    <tr key={b.line} className="border-b border-stone-100">
                      <td className="px-5 py-1.5">{b.line}</td>
                      {allCycles.map(c => (
                        <td key={c} className="px-3 py-1.5 text-right font-num">
                          {fmt(cycleActuals[c]?.[b.line] || 0)}
                        </td>
                      ))}
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

/* ============================================================================
   Transactions
   ========================================================================== */
function Transactions({ allTxs, lineNames, overrides, setOverride, clearOverride, anchorDay, onPostToHistory, onEditHistoryLine, onDeleteHistoryRow, onMergeTwoSelected, onUpdateSplits, onUpdateBudgetDate, posting, newCount, newClassifiedCount, stillNeedingReview }) {
  const [filterLine, setFL]     = useState('');
  const [filterCycle, setFC]    = useState('');
  const [filterStatus, setFS]   = useState('');
  const [search, setSearch]     = useState('');
  const [selected, setSelected] = useState(() => new Set());
  const [bulkLine, setBulkLine] = useState('');
  const [splitModalTx, setSplitModalTx] = useState(null);
  const [cycleEditorTx, setCycleEditorTx] = useState(null);

  const cycles = useMemo(() => {
    const s = new Set();
    for (const t of allTxs) if (t.date) s.add(cycleKey(t.date, anchorDay));
    return Array.from(s).sort().reverse();
  }, [allTxs, anchorDay]);

  const filtered = useMemo(() => allTxs
    .filter(t => !filterLine   || t.line === filterLine)
    .filter(t => !filterCycle  || cycleKey(t.date, anchorDay) === filterCycle)
    .filter(t => !filterStatus || (filterStatus === 'new' && !t.inHistory) || (filterStatus === 'history' && t.inHistory))
    .filter(t => !search       || (t.description || '').toLowerCase().includes(search.toLowerCase()) || (t.originalDesc || '').toLowerCase().includes(search.toLowerCase())),
    [allTxs, filterLine, filterCycle, filterStatus, search, anchorDay]);

  // Bulk-select helpers — operate on the *visible* (after-filter, after-slice) set
  const visible = filtered.slice(0, 500);
  const visibleHashes = visible.map(t => t.hash);
  const allVisibleSelected = visible.length > 0 && visibleHashes.every(h => selected.has(h));
  const someVisibleSelected = visibleHashes.some(h => selected.has(h));
  const selectedInHistoryCount = useMemo(
    () => allTxs.reduce((n, t) => n + (selected.has(t.hash) && t.inHistory ? 1 : 0), 0),
    [allTxs, selected]
  );

  // "Merge selected" eligibility: any two rows with matching amounts.
  // They can be both in history, both still in Bank Statement (unposted),
  // or one of each — the merge handler chooses the right action per side
  // (delete from history, or hide the raw row locally).
  const mergePair = useMemo(() => {
    if (selected.size !== 2) return null;
    const picks = allTxs.filter(t => selected.has(t.hash));
    if (picks.length !== 2) return null;
    if ((picks[0].amount || 0).toFixed(2) !== (picks[1].amount || 0).toFixed(2)) return null;
    return picks;
  }, [selected, allTxs]);

  const toggleOne = (hash) => {
    const next = new Set(selected);
    if (next.has(hash)) next.delete(hash); else next.add(hash);
    setSelected(next);
  };
  const toggleAllVisible = () => {
    const next = new Set(selected);
    if (allVisibleSelected) visibleHashes.forEach(h => next.delete(h));
    else                    visibleHashes.forEach(h => next.add(h));
    setSelected(next);
  };
  const clearSelection = () => setSelected(new Set());

  const applyBulkLine = () => {
    if (!bulkLine || !selected.size) return;
    for (const t of allTxs) {
      if (!selected.has(t.hash)) continue;
      if (t.inHistory) onEditHistoryLine(t.hash, bulkLine);
      else             setOverride(t.hash, bulkLine);
    }
    setSelected(new Set());
    setBulkLine('');
  };

  const deleteSelectedFromHistory = () => {
    if (!selectedInHistoryCount) return;
    if (!confirm(`Delete ${selectedInHistoryCount} row${selectedInHistoryCount === 1 ? '' : 's'} from history? This removes them from your Google Sheet.`)) return;
    for (const t of allTxs) {
      if (selected.has(t.hash) && t.inHistory) onDeleteHistoryRow(t.hash, t);
    }
    setSelected(new Set());
  };

  if (!allTxs.length) return <EmptyState />;

  return (
    <div className="space-y-4">
      <div className="bg-white border border-stone-300 rounded-sm p-4 flex items-center gap-3 flex-wrap">
        <button
          onClick={onPostToHistory}
          disabled={posting || newClassifiedCount === 0}
          className={`px-4 py-2 text-xs uppercase tracking-wider font-medium border flex items-center gap-1.5 ${newClassifiedCount > 0 && !posting ? 'border-slate-800 bg-slate-800 text-white hover:bg-slate-700' : 'border-stone-300 text-stone-400 cursor-not-allowed'}`}>
          <IconUpload className="w-3.5 h-3.5" />
          {posting ? 'Posting…' : `Post ${newClassifiedCount} classified row${newClassifiedCount === 1 ? '' : 's'} to history`}
        </button>
        <div className="text-xs text-stone-600">
          {newCount === 0
            ? 'Nothing new — everything visible is already in history.'
            : stillNeedingReview > 0
              ? <>still <span className="text-amber-700 font-medium">{stillNeedingReview}</span> tagged "Review" — classify them before posting</>
              : <>all {newClassifiedCount} new rows ready to post</>}
        </div>
      </div>

      <div className="bg-white border border-stone-300 rounded-sm overflow-hidden">
        <div className="px-5 py-3 border-b border-stone-200 flex items-center justify-between flex-wrap gap-2">
          <h2 className="font-display text-lg">Transactions</h2>
          <div className="flex items-center gap-2 flex-wrap text-xs">
            <input value={search} onChange={e => setSearch(e.target.value)} placeholder="Search description…" className="px-2 py-1 border border-stone-300 text-sm w-44" />
            <select value={filterCycle} onChange={e => setFC(e.target.value)} className="px-2 py-1 border border-stone-300 text-sm">
              <option value="">All cycles</option>{cycles.map(c => <option key={c} value={c}>{prettyCycle(c, anchorDay)}</option>)}
            </select>
            <select value={filterLine} onChange={e => setFL(e.target.value)} className="px-2 py-1 border border-stone-300 text-sm">
              <option value="">All lines</option>{lineNames.map(l => <option key={l}>{l}</option>)}
            </select>
            <select value={filterStatus} onChange={e => setFS(e.target.value)} className="px-2 py-1 border border-stone-300 text-sm">
              <option value="">All status</option>
              <option value="new">New (not posted)</option>
              <option value="history">In history</option>
            </select>
            <span className="text-stone-500 font-num">{filtered.length} of {allTxs.length}</span>
          </div>
        </div>
        {selected.size > 0 && (
          <div className="px-5 py-3 border-b border-stone-200 bg-amber-50 flex items-center gap-3 flex-wrap">
            <span className="text-xs font-medium text-stone-800">{selected.size} selected</span>
            <div className="flex items-center gap-2">
              <span className="text-xs uppercase tracking-wider text-stone-500">Apply line:</span>
              <select value={bulkLine} onChange={e => setBulkLine(e.target.value)} className="px-2 py-1 border border-stone-300 text-sm bg-white">
                <option value="">— pick a line —</option>
                {lineNames.map(l => <option key={l} value={l}>{l}</option>)}
                <option value="Salary">Salary</option>
                <option value="Other Income">Other Income</option>
              </select>
              <button onClick={applyBulkLine} disabled={!bulkLine}
                      className={`px-3 py-1 text-xs uppercase tracking-wider font-medium border ${bulkLine ? 'border-slate-800 bg-slate-800 text-white hover:bg-slate-700' : 'border-stone-300 text-stone-400 cursor-not-allowed'}`}>
                Apply
              </button>
            </div>
            {selectedInHistoryCount > 0 && (
              <button onClick={deleteSelectedFromHistory}
                      className="px-3 py-1 text-xs uppercase tracking-wider font-medium border border-red-300 text-red-700 hover:bg-red-50 flex items-center gap-1.5">
                <IconTrash className="w-3.5 h-3.5" />
                Delete {selectedInHistoryCount} from history
              </button>
            )}
            {mergePair && (
              <button onClick={() => { onMergeTwoSelected(mergePair); setSelected(new Set()); }}
                      title="Treat these two as the same transaction: the pending row adopts the cleared row's date and description; the cleared row is removed."
                      className="px-3 py-1 text-xs uppercase tracking-wider font-medium border border-amber-700 bg-amber-700 text-white hover:bg-amber-800">
                Merge 2 selected →
              </button>
            )}
            <button onClick={clearSelection} className="ml-auto px-3 py-1 text-xs uppercase tracking-wider text-stone-500 hover:text-stone-900">
              Clear
            </button>
          </div>
        )}
        <div className="overflow-x-auto" style={{ maxHeight: '70vh', overflowY: 'auto' }}>
          <table className="w-full text-sm">
            <thead className="sticky top-0 bg-white z-10">
              <tr className="text-xs uppercase tracking-wider text-stone-500 border-b border-stone-200">
                <th className="px-3 py-2 w-8">
                  <input type="checkbox"
                         checked={allVisibleSelected}
                         ref={el => { if (el) el.indeterminate = !allVisibleSelected && someVisibleSelected; }}
                         onChange={toggleAllVisible}
                         className="cursor-pointer"
                         title={allVisibleSelected ? 'Deselect all visible' : 'Select all visible'} />
                </th>
                <th className="text-left px-5 py-2 font-medium">Date</th>
                <th className="text-left px-3 py-2 font-medium">Account</th>
                <th className="text-left px-3 py-2 font-medium">Description</th>
                <th className="text-left px-3 py-2 font-medium">Bank cat</th>
                <th className="text-right px-3 py-2 font-medium">Amount</th>
                <th className="text-left px-5 py-2 font-medium">Budget line</th>
              </tr>
            </thead>
            <tbody>
              {filtered.slice(0, 500).map((t) => {
                const overridden = !!overrides[t.hash];
                const isSelected = selected.has(t.hash);
                return (
                  <tr key={t.hash} className={`border-b border-stone-100 ${isSelected ? 'bg-amber-50' : t.inHistory ? 'bg-stone-50/60' : 'hover:bg-stone-50'}`}>
                    <td className="px-3 py-1.5 w-8">
                      <input type="checkbox" checked={isSelected} onChange={() => toggleOne(t.hash)}
                             className="cursor-pointer" />
                    </td>
                    <td className="px-5 py-1.5 font-num text-xs">
                      <div className="text-stone-600">{t.date}</div>
                      {(() => {
                        const naturalCycle = cycleKey(t.date, anchorDay);
                        const effCycle = cycleKey(effectiveDate(t), anchorDay);
                        const overrideActive = naturalCycle !== effCycle;
                        return (
                          <button onClick={() => setCycleEditorTx(t)}
                                  className={`mt-0.5 text-[10px] px-1.5 py-0.5 border ${overrideActive ? 'border-indigo-300 bg-indigo-50 text-indigo-800 hover:bg-indigo-100' : 'border-stone-200 text-stone-500 hover:bg-stone-100 hover:text-stone-700'}`}
                                  title="Change which cycle this transaction counts toward">
                            {shortCycleLabel(effCycle)}
                          </button>
                        );
                      })()}
                    </td>
                    <td className="px-3 py-1.5 text-xs text-stone-500">{t.account}</td>
                    <td className="px-3 py-1.5 truncate" style={{ maxWidth: '20rem' }} title={`${t.description}${t.originalDesc && t.originalDesc !== t.description ? '\n' + t.originalDesc : ''}`}>{t.description}</td>
                    <td className="px-3 py-1.5 text-xs text-stone-500">{t.bankCategory}</td>
                    <td className={`px-3 py-1.5 text-right font-num ${t.amount < 0 ? 'text-stone-900' : 'text-emerald-700'}`}>{fmt(t.amount, 2)}</td>
                    <td className="px-5 py-1.5">
                      {t.inHistory ? (
                        <div className="flex items-center gap-2">
                          {t.splits && t.splits.length ? (
                            <button onClick={() => setSplitModalTx(t)}
                                    className="px-2 py-1 border border-indigo-300 bg-indigo-50 text-indigo-800 text-xs font-medium hover:bg-indigo-100 flex items-center gap-1.5 max-w-xs"
                                    title={t.splits.map(s => `${s.line}: R${Math.abs(s.amount).toLocaleString('en-ZA')}`).join('\n') + '\n\nClick to edit'}>
                              <IconSplit className="w-3.5 h-3.5 flex-shrink-0" />
                              <span className="truncate">{t.splits.map(s => `${s.line} R${Math.abs(s.amount).toLocaleString('en-ZA')}`).join(' + ')}</span>
                            </button>
                          ) : (
                            <>
                              <select value={t.line} onChange={e => onEditHistoryLine(t.hash, e.target.value)}
                                      className="px-2 py-1 border border-stone-300 bg-white text-xs font-medium">
                                {lineNames.includes(t.line) ? null : <option value={t.line}>{t.line}</option>}
                                {lineNames.map(l => <option key={l} value={l}>{l}</option>)}
                                <option value="Salary">Salary</option>
                                <option value="Other Income">Other Income</option>
                              </select>
                              <button onClick={() => setSplitModalTx(t)}
                                      className="text-stone-400 hover:text-indigo-700 p-0.5"
                                      title="Split this transaction across multiple budget lines">
                                <IconSplit className="w-3.5 h-3.5" />
                              </button>
                            </>
                          )}
                          <span className="inline-block px-1.5 py-0.5 text-[10px] uppercase tracking-wider bg-stone-200 text-stone-600 border border-stone-300">in history</span>
                          <button onClick={() => { if (confirm('Remove this row from history? This deletes it from the Google Sheet.')) onDeleteHistoryRow(t.hash, t); }}
                                  className="text-stone-400 hover:text-red-700" title="Remove from history">
                            <IconTrash className="w-3.5 h-3.5" />
                          </button>
                        </div>
                      ) : (
                        <div className="flex items-center gap-2">
                          {t.splits && t.splits.length ? (
                            <button onClick={() => setSplitModalTx(t)}
                                    className="px-2 py-1 border border-indigo-300 bg-indigo-50 text-indigo-800 text-xs font-medium hover:bg-indigo-100 flex items-center gap-1.5 max-w-xs"
                                    title={t.splits.map(s => `${s.line}: R${Math.abs(s.amount).toLocaleString('en-ZA')}`).join('\n') + '\n\nStaged — saves to Sheet on Post to history.\nClick to edit.'}>
                              <IconSplit className="w-3.5 h-3.5 flex-shrink-0" />
                              <span className="truncate">{t.splits.map(s => `${s.line} R${Math.abs(s.amount).toLocaleString('en-ZA')}`).join(' + ')}</span>
                            </button>
                          ) : (
                            <>
                              <select value={t.line} onChange={e => setOverride(t.hash, e.target.value)}
                                      className={`px-2 py-1 border text-xs font-medium ${
                                        t.line === 'Review' ? 'border-red-400 bg-red-50'
                                        : overridden ? 'border-amber-400 bg-amber-50'
                                        : 'border-stone-300 bg-white'
                                      }`}>
                                {lineNames.includes(t.line) ? null : <option value={t.line}>{t.line}</option>}
                                {lineNames.map(l => <option key={l} value={l}>{l}</option>)}
                                <option value="Salary">Salary</option>
                                <option value="Other Income">Other Income</option>
                              </select>
                              <button onClick={() => setSplitModalTx(t)}
                                      className="text-stone-400 hover:text-indigo-700 p-0.5"
                                      title="Split this transaction across multiple budget lines">
                                <IconSplit className="w-3.5 h-3.5" />
                              </button>
                            </>
                          )}
                          {overridden && <button onClick={() => clearOverride(t.hash)} title="Clear override" className="text-amber-700 hover:text-amber-900"><IconX className="w-3.5 h-3.5" /></button>}
                        </div>
                      )}
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
          {filtered.length > 500 && <div className="px-5 py-2 text-xs text-stone-500 bg-stone-50">Showing first 500 of {filtered.length} — narrow filters to see the rest.</div>}
        </div>
      </div>

      {splitModalTx && (
        <SplitModal
          tx={splitModalTx}
          lineNames={lineNames}
          onClose={() => setSplitModalTx(null)}
          onSave={(splits) => { onUpdateSplits(splitModalTx.hash, splits); setSplitModalTx(null); }}
        />
      )}

      {cycleEditorTx && (
        <CycleEditor
          tx={cycleEditorTx}
          anchorDay={anchorDay}
          onClose={() => setCycleEditorTx(null)}
          onSave={(budgetDate) => { onUpdateBudgetDate(cycleEditorTx.hash, budgetDate); setCycleEditorTx(null); }}
        />
      )}
    </div>
  );
}

/* ============================================================================
   Merge review modal — shown when "Merge pending" finds candidates. Lists
   each pending row alongside its proposed cleared counterpart. User ticks/
   unticks each pair, clicks Apply. Server applies only the approved set.
   ========================================================================== */
function MergeReviewModal({ proposals, approved, setApproved, onApply, onCancel }) {
  const toggle = (rowIdx) => {
    setApproved(prev => {
      const next = new Set(prev);
      if (next.has(rowIdx)) next.delete(rowIdx); else next.add(rowIdx);
      return next;
    });
  };
  const checkAll  = () => setApproved(new Set(proposals.map(p => p.rowIdx)));
  const uncheckAll = () => setApproved(new Set());
  const approvedCount = proposals.filter(p => approved.has(p.rowIdx)).length;

  return (
    <div className="fixed inset-0 bg-black/40 flex items-center justify-center z-50 p-4">
      <div className="bg-white border border-stone-300 rounded-sm max-w-3xl w-full max-h-[85vh] flex flex-col">
        <div className="px-5 py-3 border-b border-stone-200">
          <h2 className="font-display text-lg">Merge pending → cleared</h2>
          <div className="text-xs text-stone-500 mt-0.5">
            Tick the pairs you want to merge. The pending row's posting date and description will be replaced with the cleared values. Your budget line classification is preserved.
          </div>
        </div>
        <div className="px-5 py-2 border-b border-stone-200 flex items-center justify-between text-xs">
          <div>
            <span className="text-stone-500">{approvedCount} of {proposals.length} selected</span>
          </div>
          <div className="flex gap-2">
            <button onClick={checkAll}   className="uppercase tracking-wider text-stone-600 hover:text-stone-900">Select all</button>
            <span className="text-stone-300">|</span>
            <button onClick={uncheckAll} className="uppercase tracking-wider text-stone-600 hover:text-stone-900">None</button>
          </div>
        </div>
        <div className="flex-1 overflow-y-auto">
          {proposals.map(p => {
            const isOn = approved.has(p.rowIdx);
            const amt = (p.pending && p.pending.amount) || 0;
            return (
              <label key={p.rowIdx} className={`block px-5 py-3 border-b border-stone-100 cursor-pointer hover:bg-stone-50 ${isOn ? '' : 'opacity-50'}`}>
                <div className="flex items-start gap-3">
                  <input type="checkbox" checked={isOn} onChange={() => toggle(p.rowIdx)} className="mt-1" />
                  <div className="flex-1 min-w-0">
                    <div className="flex items-center gap-2 text-[10px] uppercase tracking-wider text-stone-500 mb-1">
                      <span>{p.pending.account || 'no account'}</span>
                      <span>·</span>
                      <span className={amt < 0 ? 'text-red-700' : 'text-emerald-700'}>{fmt(amt)}</span>
                      {p.pending.line && <><span>·</span><span className="text-stone-700">{p.pending.line}</span></>}
                      <span>·</span>
                      <span>{Math.round(p.daysApart)} day{Math.round(p.daysApart) === 1 ? '' : 's'} apart</span>
                    </div>
                    <div className="text-sm flex items-baseline gap-2">
                      <span className="font-num text-xs text-stone-500 w-20">{p.pending.postingDate}</span>
                      <span className="text-stone-700">{p.pending.description}</span>
                    </div>
                    <div className="text-sm flex items-baseline gap-2">
                      <span className="font-num text-xs text-emerald-700 w-20">→ {p.cleared.postingDate}</span>
                      <span className="text-stone-900">{p.cleared.description || p.cleared.originalDesc}</span>
                    </div>
                  </div>
                </div>
              </label>
            );
          })}
        </div>
        <div className="px-5 py-3 border-t border-stone-200 flex items-center justify-end gap-2">
          <button onClick={onCancel}
                  className="px-3 py-1.5 text-xs uppercase tracking-wider text-stone-600 hover:text-stone-900">
            Cancel
          </button>
          <button onClick={onApply} disabled={approvedCount === 0}
                  className="px-3 py-1.5 text-xs uppercase tracking-wider font-medium border border-amber-700 bg-amber-700 text-white hover:bg-amber-800 disabled:opacity-40 disabled:cursor-not-allowed">
            Apply {approvedCount} merge{approvedCount === 1 ? '' : 's'}
          </button>
        </div>
      </div>
    </div>
  );
}

/* ============================================================================
   Cycle editor — move a transaction into a different pay cycle without
   touching its actual Posting Date. Internally we store a Budget Date in
   the picked cycle so all the existing date-based math keeps working.
   ========================================================================== */
function CycleEditor({ tx, anchorDay, onClose, onSave }) {
  const naturalCycleStart = cycleKey(tx.date, anchorDay);
  const currentCycleStart = cycleKey(effectiveDate(tx), anchorDay);
  const prevCycleStart    = shiftCycle(naturalCycleStart, -1);
  const nextCycleStart    = shiftCycle(naturalCycleStart, 1);
  const hasOverride       = !!tx.budgetDate;

  const optionClass = (isSelected) =>
    `w-full text-left px-3 py-2 border text-sm hover:bg-stone-50 ${
      isSelected ? 'border-indigo-400 bg-indigo-50' : 'border-stone-300'
    }`;

  return (
    <div className="fixed inset-0 bg-black/40 flex items-center justify-center z-50 p-4" onClick={onClose}>
      <div className="bg-white rounded-sm shadow-xl border border-stone-300 max-w-sm w-full" onClick={e => e.stopPropagation()}>
        <div className="px-5 py-3 border-b border-stone-200 flex items-center justify-between">
          <h3 className="font-display text-lg">Move to cycle</h3>
          <button onClick={onClose} className="text-stone-400 hover:text-stone-900"><IconX className="w-4 h-4" /></button>
        </div>
        <div className="px-5 py-4">
          <div className="text-xs text-stone-500 mb-1">{tx.date}</div>
          <div className="text-sm text-stone-700 mb-3 truncate">{tx.description}</div>
          <div className="text-xs text-stone-500 mb-3">
            Currently counts toward: <span className="font-medium text-stone-800">{prettyCycle(currentCycleStart, anchorDay)}</span>
          </div>

          <div className="space-y-2">
            <button onClick={() => onSave(prevCycleStart)}
                    className={optionClass(currentCycleStart === prevCycleStart)}>
              <div className="flex items-center justify-between gap-3">
                <span>← Previous cycle</span>
                <span className="text-xs text-stone-500 font-num">{prettyCycle(prevCycleStart, anchorDay)}</span>
              </div>
            </button>
            <button onClick={() => onSave(null)}
                    className={optionClass(!hasOverride)}>
              <div className="flex items-center justify-between gap-3">
                <span>Default <span className="text-stone-500 text-xs">(by actual date)</span></span>
                <span className="text-xs text-stone-500 font-num">{prettyCycle(naturalCycleStart, anchorDay)}</span>
              </div>
            </button>
            <button onClick={() => onSave(nextCycleStart)}
                    className={optionClass(currentCycleStart === nextCycleStart)}>
              <div className="flex items-center justify-between gap-3">
                <span>Next cycle →</span>
                <span className="text-xs text-stone-500 font-num">{prettyCycle(nextCycleStart, anchorDay)}</span>
              </div>
            </button>
          </div>

          <p className="text-[11px] text-stone-500 mt-3 leading-relaxed">
            The transaction's actual Posting Date never changes. We just remap which pay cycle it counts toward in budgets and dashboards.
          </p>
        </div>
      </div>
    </div>
  );
}

/* ============================================================================
   Split modal — break a single transaction's amount across N budget lines.
   ========================================================================== */
function SplitModal({ tx, lineNames, onClose, onSave }) {
  const totalAbs = Math.abs(tx.amount);
  const [draft, setDraft] = useState(() => {
    if (tx.splits && tx.splits.length) {
      return tx.splits.map(s => ({ line: s.line, amount: String(Math.abs(s.amount)) }));
    }
    // Default scaffold: two empty rows, the first preselects the current line.
    return [
      { line: tx.line && lineNames.includes(tx.line) ? tx.line : (lineNames[0] || ''), amount: '' },
      { line: '', amount: '' },
    ];
  });

  const updateRow = (i, field, value) => setDraft(draft.map((d, j) => j === i ? { ...d, [field]: value } : d));
  const addRow    = ()              => setDraft([...draft, { line: lineNames[0] || '', amount: '' }]);
  const removeRow = (i)             => setDraft(draft.filter((_, j) => j !== i));

  const draftSum  = draft.reduce((s, d) => s + (Math.abs(Number(d.amount)) || 0), 0);
  const remaining = totalAbs - draftSum;
  const isBalanced = Math.abs(remaining) < 0.005;
  const validRows = draft.filter(d => d.line && Number(d.amount) > 0);
  const canSave   = isBalanced && validRows.length >= 1;
  const hadSplits = !!(tx.splits && tx.splits.length);

  return (
    <div className="fixed inset-0 bg-black/40 flex items-center justify-center z-50 p-4" onClick={onClose}>
      <div className="bg-white rounded-sm shadow-xl border border-stone-300 max-w-lg w-full" onClick={e => e.stopPropagation()}>
        <div className="px-5 py-3 border-b border-stone-200 flex items-center justify-between">
          <h3 className="font-display text-lg">Split transaction</h3>
          <button onClick={onClose} className="text-stone-400 hover:text-stone-900"><IconX className="w-4 h-4" /></button>
        </div>
        <div className="px-5 py-4">
          <div className="text-xs text-stone-500 uppercase tracking-wider mb-1">{tx.date}</div>
          <div className="text-sm text-stone-700 mb-1 truncate">{tx.description}</div>
          <div className="font-num text-2xl mb-4">R{totalAbs.toLocaleString('en-ZA', { maximumFractionDigits: 2 })}</div>

          <div className="space-y-2 mb-3">
            {draft.map((d, i) => (
              <div key={i} className="flex items-center gap-2">
                <select value={d.line} onChange={e => updateRow(i, 'line', e.target.value)}
                        className="px-2 py-1.5 border border-stone-300 text-sm bg-white flex-1">
                  <option value="">— pick a line —</option>
                  {lineNames.map(l => <option key={l} value={l}>{l}</option>)}
                </select>
                <input type="number" step="0.01" value={d.amount}
                       onChange={e => updateRow(i, 'amount', e.target.value)}
                       placeholder="0.00"
                       className="px-2 py-1.5 border border-stone-300 text-sm font-num w-28 text-right" />
                <button onClick={() => removeRow(i)} disabled={draft.length <= 1}
                        className="text-stone-400 hover:text-red-700 disabled:opacity-30 disabled:cursor-not-allowed" title="Remove this split">
                  <IconX className="w-4 h-4" />
                </button>
              </div>
            ))}
          </div>

          <button onClick={addRow}
                  className="text-xs uppercase tracking-wider text-stone-600 hover:text-stone-900 flex items-center gap-1.5 mb-4">
            <IconPlus className="w-3.5 h-3.5" /> Add another split
          </button>

          <div className={`text-sm font-num px-3 py-2 border ${isBalanced ? 'bg-emerald-50 text-emerald-800 border-emerald-200' : 'bg-amber-50 text-amber-800 border-amber-200'}`}>
            {isBalanced
              ? <>✓ Balanced — splits total R{draftSum.toLocaleString('en-ZA', { maximumFractionDigits: 2 })}</>
              : remaining > 0
                ? <>Still <strong>R{remaining.toLocaleString('en-ZA', { maximumFractionDigits: 2 })}</strong> unallocated</>
                : <>Over by <strong>R{Math.abs(remaining).toLocaleString('en-ZA', { maximumFractionDigits: 2 })}</strong></>}
          </div>
        </div>
        <div className="px-5 py-3 border-t border-stone-200 flex items-center gap-2 flex-wrap">
          {hadSplits && (
            <button onClick={() => { if (confirm('Clear all splits and revert this transaction to its single budget line?')) onSave([]); }}
                    className="px-3 py-1.5 text-xs uppercase tracking-wider font-medium border border-stone-300 text-stone-600 hover:bg-stone-100">
              Clear splits
            </button>
          )}
          <button onClick={onClose}
                  className="ml-auto px-3 py-1.5 text-xs uppercase tracking-wider text-stone-500 hover:text-stone-900">
            Cancel
          </button>
          <button onClick={() => canSave && onSave(validRows.map(d => ({ line: d.line, amount: Math.abs(Number(d.amount)) })))}
                  disabled={!canSave}
                  className={`px-4 py-1.5 text-xs uppercase tracking-wider font-medium border ${canSave ? 'border-slate-800 bg-slate-800 text-white hover:bg-slate-700' : 'border-stone-300 text-stone-400 cursor-not-allowed'}`}>
            Save splits
          </button>
        </div>
      </div>
    </div>
  );
}

              {lineNames.map(l => <option key={l}>{l}</option>)}

            <IconPlus className="w-3.5 h-3.5" />Add

        <div className="px-5 py-3 border-b border-stone-200 flex items-center justify-between">

          {dirty && <span className="text-xs text-amber-700">unsaved changes</span>}
        </div>
        <table className="w-full text-sm">
          <thead>
            <tr className="text-xs uppercase tracking-wider text-stone-500 border-b border-stone-200">
              <th className="text-left px-5 py-2 font-medium" style={{ width: '3rem' }}>#</th>
              <th className="text-left px-3 py-2 font-medium">Budget line</th>
              <th className="text-left px-3 py-2 font-medium">Type</th>

            </tr>
          </thead>
