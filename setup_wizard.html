<body>
<div id="root"></div>

<script type="text/babel" data-presets="env,react">
const { useState, useMemo, useEffect } = React;

/* ============================================================================
   Apps Script template — the user's token will be substituted in
   ========================================================================== */
const APPS_SCRIPT_TEMPLATE = String.raw`/**
 * CapiTracker — Budget Tracker Apps Script
 * Generated by the setup wizard. Don't share the SHARED_TOKEN below — it's the
 * password between your browser app and your Sheet.
 *
 * Three things this script does:
 *   1. onOpen()  — pulls statement attachments (CSV from yourself, or PDF
 *                  from your bank when AI mode is enabled) into the
 *                  "Bank Statement" tab.
 *   2. doGet(e)  — returns JSON of all tabs to the CapiTracker app.
 *   3. doPost(e) — handles writes (append history, save budget/rules/settings).
 */

// ============================================================================
// CONFIG
// ============================================================================
const SHARED_TOKEN = '__TOKEN__';
// We accept statements from yourself (forwarded CSVs) and from any major
// SA bank's automated sender (Capitec, FNB, Standard Bank, Nedbank, etc.).
const GMAIL_QUERY  = '(from:me OR from:capitecbank.co.za OR from:fnb.co.za OR from:standardbank.co.za OR from:nedbank.co.za OR from:absa.co.za OR from:tymebank.co.za OR from:investec.com OR from:discoverybank.co.za) newer_than:30d has:attachment';

// ============================================================================
// TAB DEFINITIONS
// ============================================================================
const T_RAW       = 'Bank Statement';
const T_HISTORY   = 'Transactions';
const T_BUDGET    = 'Budget';
const T_OVERRIDES = 'Budget Overrides';  // per-cycle adjustments to budget lines
const T_RULES     = 'Rules';
const T_SETTINGS  = 'Settings';

const HEADERS = {
  [T_RAW]:       ['Nr','Account','Posting Date','Transaction Date','Description','Original Description','Parent Category','Category','Money In','Money Out','Fee','Balance'],
  [T_HISTORY]:   ['Account','Posting Date','Transaction Date','Description','Original Description','Parent Category','Category','Money In','Money Out','Fee','Line','Splits','Budget Date','Posted At'],
  [T_BUDGET]:    ['Line','Amount'],
  [T_OVERRIDES]: ['Cycle','Line','Amount'],
  [T_RULES]:     ['Line','Type','Value'],
  [T_SETTINGS]:  ['Key','Value'],
};

// ============================================================================
// DEFAULTS (seeded on first run only)
// ============================================================================
const DEFAULT_BUDGET = [
  ['Rent', 0],            ['Transport', 0],
  ['Groceries', 0],       ['Utilities', 0],
  ['Subscriptions', 0],   ['Eating Out', 0],
  ['Savings', 0],         ['Medical', 0],
  ['Insurance', 0],       ['Personal', 0],
  ['Reimbursable', 0],    ['Review', 0],
];

const DEFAULT_RULES = [
  ['Rent',          'desc', 'landlord-name-here'],
  ['Subscriptions', 'desc', 'netflix'],
  ['Subscriptions', 'desc', 'spotify'],
  ['Groceries',     'cat',  'Groceries'],
  ['Transport',     'cat',  'Fuel'],
  ['Utilities',     'cat',  'Electricity'],
  ['Eating Out',    'cat',  'Restaurants'],
  ['Eating Out',    'cat',  'Takeaways'],
  ['Medical',       'cat',  'Pharmacy'],
];

const DEFAULT_SETTINGS = [
  ['Net Income', 0],
  ['Anchor Day', 25],
];

// ============================================================================
// LIFECYCLE
// ============================================================================
function onOpen() {
  ensureTabs_();
  try { pullStatements_(); }
  catch (e) { Logger.log('Email pull failed: ' + e); }
}

function ensureTabs_() {
  const ss = SpreadsheetApp.getActiveSpreadsheet();
  for (const tabName of [T_RAW, T_HISTORY, T_BUDGET, T_OVERRIDES, T_RULES, T_SETTINGS]) {
    if (ss.getSheetByName(tabName)) continue;
    const sheet = ss.insertSheet(tabName);
    const h = HEADERS[tabName];
    sheet.getRange(1, 1, 1, h.length).setValues([h]).setFontWeight('bold');
    sheet.setFrozenRows(1);
    seedDefaults_(sheet, tabName);
  }
  migrateSchema_();
}

// Add any HEADERS columns that don't exist yet in pre-existing tabs.
// Idempotent — safe to call on every load. Lets us evolve the schema
// (e.g. adding "Splits" later) without breaking users' existing sheets.
function migrateSchema_() {
  const ss = SpreadsheetApp.getActiveSpreadsheet();
  for (const tabName of Object.keys(HEADERS)) {
    const sheet = ss.getSheetByName(tabName);
    if (!sheet) continue;
    const expected = HEADERS[tabName];
    const lastCol = Math.max(sheet.getLastColumn(), 1);
    const existing = sheet.getRange(1, 1, 1, lastCol).getValues()[0].map(v => String(v).trim());
    for (const h of expected) {
      if (existing.includes(h)) continue;
      const newCol = sheet.getLastColumn() + 1;
      sheet.getRange(1, newCol).setValue(h).setFontWeight('bold');
      existing.push(h);
    }
  }
}

function seedDefaults_(sheet, tabName) {
  let rows = null;
  if (tabName === T_BUDGET)        rows = DEFAULT_BUDGET;
  else if (tabName === T_RULES)    rows = DEFAULT_RULES;
  else if (tabName === T_SETTINGS) rows = DEFAULT_SETTINGS;
  if (rows && rows.length) {
    sheet.getRange(2, 1, rows.length, rows[0].length).setValues(rows);
  }
}

// ============================================================================
// EMAIL PULL — gathers statement attachments from Gmail and writes T_RAW.
// Handles both:
//   - CSV: account_statement_*.csv (user-forwarded from Capitec app)
//   - PDF: account_statement.pdf etc. (sent directly by Capitec, parsed
//          by Gemini if GEMINI_API_KEY is set in Script Properties)
// ============================================================================
// How many PDF statements to parse per Sync. Each PDF costs ~2-3 minutes
// of Gemini time, and Apps Script web app calls cap at 6 minutes total.
const MAX_PDFS_PER_SYNC = 1;

// mode = 'all' | 'csv' | 'pdf' — controls which attachments get processed.
// CSV is fast; PDF goes through Gemini and can take minutes. Buttons in the
// app split these so users on one source aren't waiting for the other.
function pullStatements_(mode) {
  mode = mode || 'all';
  const includeCsv = (mode === 'all' || mode === 'csv');
  const includePdf = (mode === 'all' || mode === 'pdf');

  const ss = SpreadsheetApp.getActiveSpreadsheet();
  const sheet = ss.getSheetByName(T_RAW);
  if (!sheet) return;

  const threads = GmailApp.search(GMAIL_QUERY, 0, 30);
  const collected = [];
  const seenHashes = new Set();
  let csvCount = 0, pdfCount = 0, pdfTxCount = 0, pdfsParsed = 0;
  const aiEnabled = includePdf && !!PropertiesService.getScriptProperties().getProperty('GEMINI_API_KEY');

  for (const thread of threads) {
    for (const msg of thread.getMessages()) {
      for (const att of msg.getAttachments()) {
        const name = (att.getName() || '').toLowerCase();
        if (att.isGoogleType && att.isGoogleType()) continue;

        // ---- CSV path ----
        if (includeCsv && name.startsWith('account_statement') && name.endsWith('.csv')) {
          csvCount++;
          let csv;
          try { csv = Utilities.parseCsv(att.getDataAsString()); }
          catch (e) { Logger.log('CSV parse failed for ' + name + ': ' + e); continue; }
          if (csv.length < 2) continue;

          const idx = {};
          csv[0].forEach((h, i) => { idx[String(h).trim()] = i; });

          for (let r = 1; r < csv.length; r++) {
            const row = csv[r];
            const postingDate = row[idx['Posting Date']];
            if (!postingDate) continue;
            const out = HEADERS[T_RAW].map(h => {
              if (h === 'Nr') return '';
              if (idx[h] === undefined) return '';
              return row[idx[h]];
            });
            const desc = normalizeDesc_(row[idx['Original Description']] || row[idx['Description']]);
            const mi = Number(row[idx['Money In']]) || 0;
            const mo = Number(row[idx['Money Out']]) || 0;
            const fe = Number(row[idx['Fee']]) || 0;
            const txnDate = row[idx['Transaction Date']];
            const hash = (txnDate || postingDate) + '|' + desc + '|' + (mi + mo + fe).toFixed(2);
            if (seenHashes.has(hash)) continue;
            seenHashes.add(hash);
            collected.push(out);
          }
          continue;
        }

        // ---- PDF path (AI-parsed) ----
        if (name.endsWith('.pdf') && aiEnabled && isBankStatementPdf_(att, msg)) {
          pdfCount++;
          if (pdfsParsed >= MAX_PDFS_PER_SYNC) {
            Logger.log('Skipping PDF (limit ' + MAX_PDFS_PER_SYNC + ' reached): ' + att.getName());
            continue;
          }
          Logger.log('Parsing PDF: ' + att.getName() + ' (' + Math.round(att.getSize() / 1024) + 'KB)');
          try {
            const txs = parseStatementPdf_(att);
            for (const tx of txs) {
              if (!tx.postingDate) continue;
              const mi = Number(tx.moneyIn) || 0;
              const mo = Number(tx.moneyOut) || 0;
              const fe = Number(tx.fee) || 0;
              const desc = normalizeDesc_(tx.originalDescription || tx.description);
              const hash = (tx.transactionDate || tx.postingDate) + '|' + desc + '|' + (mi + mo + fe).toFixed(2);
              if (seenHashes.has(hash)) continue;
              seenHashes.add(hash);
              const out = HEADERS[T_RAW].map(h => {
                if (h === 'Nr')                  return '';
                if (h === 'Account')             return String(tx.accountNumber || '').trim();
                if (h === 'Posting Date')        return tx.postingDate || '';
                if (h === 'Transaction Date')    return tx.transactionDate || tx.postingDate || '';
                if (h === 'Description')         return tx.description || '';
                if (h === 'Original Description')return tx.originalDescription || tx.description || '';
                if (h === 'Parent Category')     return '';
                if (h === 'Category')            return '';
                if (h === 'Money In')            return mi;
                if (h === 'Money Out')           return mo;
                if (h === 'Fee')                 return fe;
                if (h === 'Balance')             return Number(tx.balance) || 0;
                return '';
              });
              collected.push(out);
              pdfTxCount++;
            }
            pdfsParsed++;
          } catch (e) {
            Logger.log('PDF parse failed for ' + name + ': ' + e);
          }
          continue;
        }
      }
    }
  }

  const pdIdx = HEADERS[T_RAW].indexOf('Posting Date');
  collected.sort((a, b) => String(a[pdIdx]).localeCompare(String(b[pdIdx])));
  collected.forEach((row, i) => { row[0] = i + 1; });

  sheet.clearContents();
  const h = HEADERS[T_RAW];
  sheet.getRange(1, 1, 1, h.length).setValues([h]).setFontWeight('bold');
  if (collected.length) {
    sheet.getRange(2, 1, collected.length, h.length).setValues(collected);
  }
  Logger.log('Pulled ' + collected.length + ' rows [mode=' + mode + ']. CSV files: ' + csvCount + ', PDF files: ' + pdfCount + ' (' + pdfTxCount + ' tx from AI parsing)' + (includePdf && !aiEnabled ? ' [AI disabled — set GEMINI_API_KEY]' : ''));
}

const BANK_DOMAINS_ = [
  'capitec', 'fnb', 'standardbank', 'nedbank', 'absa', 'tymebank',
  'investec', 'discovery', 'sbsa',
];
function isBankStatementPdf_(att, msg) {
  const name = (att.getName() || '').toLowerCase();
  if (name.includes('statement') || name.startsWith('account_')) return true;
  const from = (msg.getFrom() || '').toLowerCase();
  return BANK_DOMAINS_.some(d => from.includes(d));
}

// ============================================================================
// WEB APP — doGet / doPost
// ============================================================================
function doGet(e) {
  const params = (e && e.parameter) || {};
  if (!checkToken_(params.token)) return jsonOut_({ ok: false, error: 'bad token' });
  try { migrateSchema_(); } catch (_) {}
  const action = params.action || 'load';
  try {
    if (action === 'load') return jsonOut_(loadAll_());
    if (action === 'pull')     { pullStatements_('all'); return jsonOut_(loadAll_()); }
    if (action === 'pull-csv') { pullStatements_('csv'); return jsonOut_(loadAll_()); }
    if (action === 'pull-pdf') { pullStatements_('pdf'); return jsonOut_(loadAll_()); }
    if (action === 'ping') return jsonOut_({ ok: true, message: 'pong' });
    return jsonOut_({ ok: false, error: 'unknown action: ' + action });
  } catch (err) {
    return jsonOut_({ ok: false, error: String(err) });
  }
}

function doPost(e) {
  let body;
  try { body = JSON.parse(e && e.postData && e.postData.contents); }
  catch (_) { return jsonOut_({ ok: false, error: 'bad json' }); }
  if (!body) return jsonOut_({ ok: false, error: 'no body' });
  if (!checkToken_(body.token)) return jsonOut_({ ok: false, error: 'bad token' });
  try { migrateSchema_(); } catch (_) {}

  try {
    switch (body.action) {
      case 'append-history':
        return jsonOut_(appendHistory_(body.rows || []));
      case 'update-history':
        return jsonOut_(updateHistoryLine_(body.hash, body.line));
      case 'update-splits':
        return jsonOut_(updateHistorySplits_(body.hash, body.splits || ''));
      case 'update-budget-date':
        return jsonOut_(updateHistoryBudgetDate_(body.hash, body.budgetDate || ''));
      case 'delete-history':
        return jsonOut_(deleteHistoryRow_(body));
      case 'find-pending-merges':
        return jsonOut_(findPendingMerges_());
      case 'apply-pending-merges':
        return jsonOut_(applyPendingMerges_(body.proposals || []));
      case 'merge-two-rows':
        return jsonOut_(mergeTwoRows_(body.pending, body.cleared));
      case 'save-budget':
        return jsonOut_(overwriteTab_(T_BUDGET, body.rows || []));
      case 'save-budget-overrides':
        return jsonOut_(overwriteTab_(T_OVERRIDES, body.rows || []));
      case 'save-rules':
        return jsonOut_(overwriteTab_(T_RULES, body.rows || []));
      case 'save-settings':
        return jsonOut_(overwriteSettings_(body.settings || {}));
      case 'chat':
        return jsonOut_(chatWithGemini_(body.messages || [], body.context || {}));
      default:
        return jsonOut_({ ok: false, error: 'unknown action: ' + body.action });
    }
  } catch (err) {
    return jsonOut_({ ok: false, error: String(err) });
  }
}

// Prefer the token stored in Script Properties (encrypted, never in code).
// Falls back to the SHARED_TOKEN constant above for backwards compatibility.
function getSharedToken_() {
  return PropertiesService.getScriptProperties().getProperty('SHARED_TOKEN') || SHARED_TOKEN;
}

function checkToken_(t) {
  const expected = getSharedToken_();
  return t && expected && t === expected && expected !== '__TOKEN__';
}

function jsonOut_(obj) {
  return ContentService.createTextOutput(JSON.stringify(obj)).setMimeType(ContentService.MimeType.JSON);
}

// ============================================================================
// READ HELPERS
// ============================================================================
function loadAll_() {
  return {
    ok: true,
    rawStatements:    readTab_(T_RAW),
    transactions:     readTab_(T_HISTORY),
    budget:           readTab_(T_BUDGET),
    budgetOverrides:  readTab_(T_OVERRIDES),
    rules:            readTab_(T_RULES),
    settings:         readSettings_(),
  };
}

function readTab_(name) {
  const sheet = SpreadsheetApp.getActiveSpreadsheet().getSheetByName(name);
  if (!sheet) return [];
  const data = sheet.getDataRange().getValues();
  if (data.length < 2) return [];
  const headers = data[0].map(String);
  const tz = Session.getScriptTimeZone();
  const out = [];
  for (let r = 1; r < data.length; r++) {
    if (data[r].every(v => v === '' || v === null)) continue;
    const obj = {};
    for (let c = 0; c < headers.length; c++) {
      let v = data[r][c];
      if (v instanceof Date) v = Utilities.formatDate(v, tz, 'yyyy-MM-dd');
      obj[headers[c]] = v;
    }
    out.push(obj);
  }
  return out;
}

function readSettings_() {
  const rows = readTab_(T_SETTINGS);
  const out = {};
  rows.forEach(r => { if (r.Key !== undefined && r.Key !== '') out[String(r.Key)] = r.Value; });
  return out;
}

// ============================================================================
// WRITE HELPERS
// ============================================================================
function appendHistory_(rows) {
  if (!rows.length) return { ok: true, appended: 0 };
  const sheet = SpreadsheetApp.getActiveSpreadsheet().getSheetByName(T_HISTORY);
  const existing = readTab_(T_HISTORY);
  const existingHashes = new Set(existing.map(hashRow_));
  const headers = HEADERS[T_HISTORY];
  const now = new Date().toISOString();

  const fresh = rows.filter(r => !existingHashes.has(hashRow_(r)));
  if (!fresh.length) return { ok: true, appended: 0 };

  const arr = fresh.map(r => headers.map(h => {
    if (h === 'Posted At') return now;
    return r[h] !== undefined ? r[h] : '';
  }));
  sheet.getRange(sheet.getLastRow() + 1, 1, arr.length, headers.length).setValues(arr);
  return { ok: true, appended: arr.length };
}

function findHistoryRowByHash_(hash) {
  const sheet = SpreadsheetApp.getActiveSpreadsheet().getSheetByName(T_HISTORY);
  if (!sheet) return { sheet: null, rowIdx: -1, headers: null };
  const data = sheet.getDataRange().getValues();
  if (data.length < 2) return { sheet, rowIdx: -1, headers: null };
  const headers = data[0].map(String);
  const tz = Session.getScriptTimeZone();
  for (let r = 1; r < data.length; r++) {
    const obj = {};
    for (let c = 0; c < headers.length; c++) {
      let v = data[r][c];
      if (v instanceof Date) v = Utilities.formatDate(v, tz, 'yyyy-MM-dd');
      obj[headers[c]] = v;
    }
    if (hashRow_(obj) === hash) return { sheet, rowIdx: r + 1, headers };
  }
  return { sheet, rowIdx: -1, headers };
}

function updateHistoryLine_(hash, line) {
  if (!hash || !line) return { ok: false, error: 'hash and line required' };
  const { sheet, rowIdx, headers } = findHistoryRowByHash_(hash);
  if (rowIdx < 0) return { ok: false, error: 'row not found' };
  const lineCol = headers.indexOf('Line');
  if (lineCol < 0) return { ok: false, error: 'no Line column' };
  sheet.getRange(rowIdx, lineCol + 1).setValue(line);
  return { ok: true };
}

// Splits is stored as a pipe-delimited string: "Line1:Amount1|Line2:Amount2".
// Empty string clears the splits and reverts the row to using its single Line.
function updateHistorySplits_(hash, splits) {
  if (!hash) return { ok: false, error: 'hash required' };
  const { sheet, rowIdx, headers } = findHistoryRowByHash_(hash);
  if (rowIdx < 0) return { ok: false, error: 'row not found' };
  const splitsCol = headers.indexOf('Splits');
  if (splitsCol < 0) return { ok: false, error: 'no Splits column — older sheet, reopen to migrate' };
  sheet.getRange(rowIdx, splitsCol + 1).setValue(splits || '');
  return { ok: true };
}

// Budget Date overrides the cycle a row falls into for budgeting purposes,
// without changing its actual Posting Date. Empty string clears the override.
function updateHistoryBudgetDate_(hash, budgetDate) {
  if (!hash) return { ok: false, error: 'hash required' };
  const { sheet, rowIdx, headers } = findHistoryRowByHash_(hash);
  if (rowIdx < 0) return { ok: false, error: 'row not found' };
  const col = headers.indexOf('Budget Date');
  if (col < 0) return { ok: false, error: 'no Budget Date column — older sheet, reopen to migrate' };
  sheet.getRange(rowIdx, col + 1).setValue(budgetDate || '');
  return { ok: true };
}

// Accepts either { hash } or { match: { postingDate, originalDescription,
// amount } }. Field match is more robust than hash across version drift.
function deleteHistoryRow_(req) {
  if (!req) return { ok: false, error: 'no request' };
  if (req.match) return deleteHistoryByMatch_(req.match);
  if (!req.hash) return { ok: false, error: 'provide hash or match' };
  let deleted = 0;
  while (true) {
    const { sheet, rowIdx } = findHistoryRowByHash_(req.hash);
    if (rowIdx < 0) break;
    sheet.deleteRow(rowIdx);
    deleted++;
    if (deleted > 50) break;
  }
  if (deleted === 0) return { ok: false, error: 'row not found by hash' };
  return { ok: true, deleted };
}

function deleteHistoryByMatch_(m) {
  const sheet = SpreadsheetApp.getActiveSpreadsheet().getSheetByName(T_HISTORY);
  if (!sheet) return { ok: false, error: 'no Transactions tab' };
  const data = sheet.getDataRange().getValues();
  if (data.length < 2) return { ok: false, error: 'no rows' };
  const h = data[0].map(String);
  const tz = Session.getScriptTimeZone();
  const pdCol = h.indexOf('Posting Date');
  const odCol = h.indexOf('Original Description');
  const dCol  = h.indexOf('Description');
  const miCol = h.indexOf('Money In');
  const moCol = h.indexOf('Money Out');
  const feCol = h.indexOf('Fee');
  const targetDate   = String(m.postingDate || '');
  const targetDesc   = normalizeDesc_(m.originalDescription || m.description);
  const targetAmount = Number(m.amount || 0).toFixed(2);
  let deleted = 0;
  for (let r = data.length - 1; r >= 1; r--) {
    let pd = data[r][pdCol];
    if (pd instanceof Date) pd = Utilities.formatDate(pd, tz, 'yyyy-MM-dd');
    pd = String(pd || '');
    const rowDesc = normalizeDesc_(data[r][odCol] || data[r][dCol]);
    const mi = Number(data[r][miCol]) || 0;
    const mo = Number(data[r][moCol]) || 0;
    const fe = Number(data[r][feCol]) || 0;
    const rowAmt = (mi + mo + fe).toFixed(2);
    if (pd === targetDate && rowDesc === targetDesc && rowAmt === targetAmount) {
      sheet.deleteRow(r + 1);
      deleted++;
      if (deleted > 50) break;
    }
  }
  if (deleted === 0) return { ok: false, error: 'no row matched' };
  return { ok: true, deleted };
}

// True if a description marks the row as still-pending.
function isPendingDesc_(s) {
  return /^\s*\(pending\)\s*/i.test(String(s || ''));
}

// Find pending rows that have a cleared counterpart. Returns proposals; does
// NOT modify the sheet. User-in-the-loop confirmation catches false positives
// (e.g. two real different purchases that happen to share account + amount).
function findPendingMerges_() {
  const ss = SpreadsheetApp.getActiveSpreadsheet();
  const txnsSheet = ss.getSheetByName(T_HISTORY);
  const rawSheet  = ss.getSheetByName(T_RAW);
  if (!txnsSheet || !rawSheet) return { ok: false, error: 'tabs missing' };
  const txnsData = txnsSheet.getDataRange().getValues();
  const rawData  = rawSheet.getDataRange().getValues();
  if (txnsData.length < 2) return { ok: true, proposals: [] };
  const tH = txnsData[0].map(String);
  const rH = rawData[0].map(String);
  const tz = Session.getScriptTimeZone();
  const tCol = (n) => tH.indexOf(n);
  const rCol = (n) => rH.indexOf(n);
  const fmtDate = v => {
    if (v instanceof Date) return Utilities.formatDate(v, tz, 'yyyy-MM-dd');
    return String(v || '').slice(0, 10);
  };
  const daysBetween = (a, b) => {
    if (!a || !b) return Infinity;
    return Math.abs((new Date(a) - new Date(b)) / 86400000);
  };
  // Cleared candidates come from Bank Statement (T_RAW) OR Transactions tab
  // itself — the user may have posted both versions to history already.
  const clearedByKey = {};
  const pushC = (e) => {
    const k = e.account + '|' + e.amount;
    if (!clearedByKey[k]) clearedByKey[k] = [];
    clearedByKey[k].push(e);
  };
  if (rawData.length > 1) {
    for (let r = 1; r < rawData.length; r++) {
      const desc = String(rawData[r][rCol('Original Description')] || rawData[r][rCol('Description')] || '');
      if (isPendingDesc_(desc)) continue;
      const acc = String(rawData[r][rCol('Account')] || '');
      const mi = Number(rawData[r][rCol('Money In')]) || 0;
      const mo = Number(rawData[r][rCol('Money Out')]) || 0;
      const fe = Number(rawData[r][rCol('Fee')]) || 0;
      pushC({
        source: 'raw', sourceRowIdx: null,
        account: acc, amount: (mi + mo + fe).toFixed(2),
        postingDate:     fmtDate(rawData[r][rCol('Posting Date')]),
        transactionDate: fmtDate(rawData[r][rCol('Transaction Date')] || rawData[r][rCol('Posting Date')]),
        description:     String(rawData[r][rCol('Description')] || ''),
        originalDesc:    String(rawData[r][rCol('Original Description')] || ''),
      });
    }
  }
  for (let r = 1; r < txnsData.length; r++) {
    const desc = String(txnsData[r][tCol('Original Description')] || txnsData[r][tCol('Description')] || '');
    if (isPendingDesc_(desc)) continue;
    const acc = String(txnsData[r][tCol('Account')] || '');
    const mi = Number(txnsData[r][tCol('Money In')]) || 0;
    const mo = Number(txnsData[r][tCol('Money Out')]) || 0;
    const fe = Number(txnsData[r][tCol('Fee')]) || 0;
    pushC({
      source: 'history', sourceRowIdx: r + 1,
      account: acc, amount: (mi + mo + fe).toFixed(2),
      postingDate:     fmtDate(txnsData[r][tCol('Posting Date')]),
      transactionDate: fmtDate(txnsData[r][tCol('Transaction Date')] || txnsData[r][tCol('Posting Date')]),
      description:     String(txnsData[r][tCol('Description')] || ''),
      originalDesc:    String(txnsData[r][tCol('Original Description')] || ''),
    });
  }
  const proposals = [];
  const used = new Set();
  for (let r = 1; r < txnsData.length; r++) {
    const desc = String(txnsData[r][tCol('Original Description')] || txnsData[r][tCol('Description')] || '');
    if (!isPendingDesc_(desc)) continue;
    const acc = String(txnsData[r][tCol('Account')] || '');
    const mi = Number(txnsData[r][tCol('Money In')]) || 0;
    const mo = Number(txnsData[r][tCol('Money Out')]) || 0;
    const fe = Number(txnsData[r][tCol('Fee')]) || 0;
    const amount = mi + mo + fe;
    const amt = amount.toFixed(2);
    const txnDate = fmtDate(txnsData[r][tCol('Transaction Date')] || txnsData[r][tCol('Posting Date')]);
    const pendingPostingDate = fmtDate(txnsData[r][tCol('Posting Date')]);
    const lineVal = tCol('Line') >= 0 ? String(txnsData[r][tCol('Line')] || '') : '';
    const key = acc + '|' + amt;
    const candidates = clearedByKey[key] || [];
    let best = null, bestDelta = Infinity, bestIdx = -1;
    for (let i = 0; i < candidates.length; i++) {
      const id = key + '|' + i;
      if (used.has(id)) continue;
      const delta = daysBetween(txnDate, candidates[i].transactionDate);
      if (delta <= 7 && delta < bestDelta) {
        best = candidates[i]; bestDelta = delta; bestIdx = i;
      }
    }
    if (!best) continue;
    used.add(key + '|' + bestIdx);
    proposals.push({
      rowIdx: r + 1,
      pending: { postingDate: pendingPostingDate, description: desc, amount, account: acc, line: lineVal },
      cleared: { source: best.source, sourceRowIdx: best.sourceRowIdx, postingDate: best.postingDate, transactionDate: best.transactionDate, description: best.description, originalDesc: best.originalDesc },
      daysApart: bestDelta,
    });
  }
  return { ok: true, proposals };
}

// Apply only the proposals the user has approved. Deletes any cleared
// rows that came from the Transactions tab (source='history') after the
// pending row has adopted their values. Deletes happen bottom-up so the
// indices stay valid.
function applyPendingMerges_(proposals) {
  if (!proposals || !proposals.length) return { ok: true, merged: 0 };
  const txnsSheet = SpreadsheetApp.getActiveSpreadsheet().getSheetByName(T_HISTORY);
  if (!txnsSheet) return { ok: false, error: 'no Transactions tab' };
  const headers = txnsSheet.getRange(1, 1, 1, txnsSheet.getLastColumn()).getValues()[0].map(String);
  const tCol = (n) => headers.indexOf(n);
  let merged = 0;
  const toDelete = [];
  for (const p of proposals) {
    if (!p.rowIdx || !p.cleared) continue;
    const odCol = tCol('Original Description');
    const dCol  = tCol('Description');
    if (odCol < 0 && dCol < 0) continue;
    const checkRange = txnsSheet.getRange(p.rowIdx, 1, 1, txnsSheet.getLastColumn()).getValues()[0];
    const checkDesc = String((odCol >= 0 ? checkRange[odCol] : '') || (dCol >= 0 ? checkRange[dCol] : ''));
    if (!isPendingDesc_(checkDesc)) continue;
    if (tCol('Posting Date')         >= 0) txnsSheet.getRange(p.rowIdx, tCol('Posting Date') + 1).setValue(p.cleared.postingDate);
    if (tCol('Transaction Date')     >= 0 && p.cleared.transactionDate) txnsSheet.getRange(p.rowIdx, tCol('Transaction Date') + 1).setValue(p.cleared.transactionDate);
    if (tCol('Description')          >= 0 && p.cleared.description)    txnsSheet.getRange(p.rowIdx, tCol('Description') + 1).setValue(p.cleared.description);
    if (tCol('Original Description') >= 0 && p.cleared.originalDesc)   txnsSheet.getRange(p.rowIdx, tCol('Original Description') + 1).setValue(p.cleared.originalDesc);
    if (p.cleared.source === 'history' && p.cleared.sourceRowIdx && p.cleared.sourceRowIdx !== p.rowIdx) {
      toDelete.push(p.cleared.sourceRowIdx);
    }
    merged++;
  }
  toDelete.sort((a, b) => b - a);
  for (const idx of toDelete) {
    try { txnsSheet.deleteRow(idx); } catch (_) {}
  }
  return { ok: true, merged };
}

// Manual two-row merge: user selected one pending + one cleared row.
function mergeTwoRows_(pending, cleared) {
  if (!pending || !cleared) return { ok: false, error: 'need pending and cleared' };
  const sheet = SpreadsheetApp.getActiveSpreadsheet().getSheetByName(T_HISTORY);
  if (!sheet) return { ok: false, error: 'no Transactions tab' };
  const data = sheet.getDataRange().getValues();
  if (data.length < 2) return { ok: false, error: 'no rows' };
  const headers = data[0].map(String);
  const tz = Session.getScriptTimeZone();
  const pdCol = headers.indexOf('Posting Date');
  const tdCol = headers.indexOf('Transaction Date');
  const odCol = headers.indexOf('Original Description');
  const dCol  = headers.indexOf('Description');
  const miCol = headers.indexOf('Money In');
  const moCol = headers.indexOf('Money Out');
  const feCol = headers.indexOf('Fee');
  const fmtDate = v => {
    if (v instanceof Date) return Utilities.formatDate(v, tz, 'yyyy-MM-dd');
    return String(v || '');
  };
  const matchRow = (target) => {
    const tDate = String(target.postingDate || '');
    const tDesc = String(target.originalDescription || target.description || '').toLowerCase().trim();
    const tAmt  = Number(target.amount || 0).toFixed(2);
    for (let r = 1; r < data.length; r++) {
      const pd = fmtDate(data[r][pdCol]);
      const rd = String(data[r][odCol] || data[r][dCol] || '').toLowerCase().trim();
      const mi = Number(data[r][miCol]) || 0;
      const mo = Number(data[r][moCol]) || 0;
      const fe = Number(data[r][feCol]) || 0;
      const ra = (mi + mo + fe).toFixed(2);
      if (pd === tDate && rd === tDesc && ra === tAmt) return r + 1;
    }
    return -1;
  };
  const pIdx = matchRow(pending);
  const cIdx = matchRow(cleared);
  if (pIdx < 0) return { ok: false, error: 'pending row not found in Transactions tab' };
  if (cIdx < 0) return { ok: false, error: 'cleared row not found in Transactions tab' };
  if (pIdx === cIdx) return { ok: false, error: 'same row picked twice' };
  const clearedRow = sheet.getRange(cIdx, 1, 1, headers.length).getValues()[0];
  const newPostingDate     = pdCol >= 0 ? fmtDate(clearedRow[pdCol]) : '';
  const newTransactionDate = tdCol >= 0 ? fmtDate(clearedRow[tdCol]) : '';
  const newDesc            = dCol  >= 0 ? String(clearedRow[dCol]  || '') : '';
  const newOriginalDesc    = odCol >= 0 ? String(clearedRow[odCol] || '') : '';
  if (pdCol >= 0 && newPostingDate)     sheet.getRange(pIdx, pdCol + 1).setValue(newPostingDate);
  if (tdCol >= 0 && newTransactionDate) sheet.getRange(pIdx, tdCol + 1).setValue(newTransactionDate);
  if (dCol  >= 0 && newDesc)            sheet.getRange(pIdx, dCol  + 1).setValue(newDesc);
  if (odCol >= 0 && newOriginalDesc)    sheet.getRange(pIdx, odCol + 1).setValue(newOriginalDesc);
  sheet.deleteRow(cIdx);
  return { ok: true, merged: 1 };
}

// Strip transient bank markers (e.g. Capitec's "(Pending)" prefix on
// un-cleared rows) so the same transaction hashes the same whether it
// was imported as pending or after it cleared.
function normalizeDesc_(s) {
  return String(s || '').toLowerCase().replace(/^\s*\(pending\)\s*/i, '').trim();
}

// Anchor on Transaction Date — it stays stable when Capitec shifts a row's
// Posting Date as it clears from pending to settled.
function hashRow_(r) {
  const mi = Number(r['Money In']) || 0;
  const mo = Number(r['Money Out']) || 0;
  const fe = Number(r['Fee']) || 0;
  const desc = normalizeDesc_(r['Original Description'] || r['Description']);
  const dateKey = r['Transaction Date'] || r['Posting Date'];
  return [dateKey, desc, (mi + mo + fe).toFixed(2)].join('|');
}

function overwriteTab_(name, rows) {
  const ss = SpreadsheetApp.getActiveSpreadsheet();
  let sheet = ss.getSheetByName(name);
  const headers = HEADERS[name];
  // Self-heal: if the tab doesn't exist (e.g. user hasn't reloaded the Sheet
  // since a new tab was added in a script update), create it now.
  if (!sheet) {
    sheet = ss.insertSheet(name);
    sheet.setFrozenRows(1);
  }
  sheet.clearContents();
  sheet.getRange(1, 1, 1, headers.length).setValues([headers]).setFontWeight('bold');
  if (rows.length) {
    const arr = rows.map(r => headers.map(h => r[h] !== undefined ? r[h] : ''));
    sheet.getRange(2, 1, arr.length, headers.length).setValues(arr);
  }
  return { ok: true, saved: rows.length };
}

function overwriteSettings_(obj) {
  const rows = Object.keys(obj).map(k => ({ Key: k, Value: obj[k] }));
  return overwriteTab_(T_SETTINGS, rows);
}

// AI PDF PARSING + CHAT (opt-in) — sends PDF statements and chat prompts to
// Google Gemini. Free tier covers ~1500 PDFs/day. Privacy: only the bytes
// you opt into are sent (PDFs you sync, chat questions you ask).
//
// ENABLE:
//   1. Get a free key from https://aistudio.google.com (~30 seconds, no card)
//   2. Apps Script editor → gear icon (Project Settings) → Script properties →
//      add: GEMINI_API_KEY = <your AIza... key>
//   3. Save & redeploy
//   4. Run testPdfParse() once to confirm parsing works
// ============================================================================
const GEMINI_MODEL = 'gemini-2.5-flash';

const GEMINI_PROMPT = [
  'You are parsing a South African bank statement into structured transaction data.',
  'The statement could be from any SA bank — Capitec, FNB, Standard Bank, Nedbank, ABSA, TymeBank, Investec, Discovery, or similar. Layouts and terminology vary; infer the structure from context.',
  '',
  'BEFORE you list transactions, find the ACCOUNT NUMBER for this statement. It is on the first page or in a header/summary block, NOT inside the transaction rows themselves. Labels to look for: "Account number", "Account no.", "Acc no", "Card number", or similar. Copy it as a string (digits only — strip spaces, dashes, label text). Every transaction object in your response should include this same accountNumber value.',
  '',
  'For each transaction row, extract:',
  '- accountNumber (header-level account number; SAME on every row in this response)',
  '- postingDate (YYYY-MM-DD)',
  '- transactionDate (YYYY-MM-DD; same as posting date if not separately shown)',
  '- description (the merchant or transaction description, cleaned up)',
  '- originalDescription (raw description verbatim)',
  '- moneyIn  (POSITIVE number for deposits/credits, 0 otherwise)',
  '- moneyOut (NEGATIVE number for debits/spending, 0 otherwise)',
  '- fee      (NEGATIVE number for fees, 0 otherwise)',
  '- balance  (running balance after the transaction)',
  '',
  'Many SA banks use a single signed Amount column or Debit/Credit columns. Map them onto moneyIn / moneyOut / fee with the sign rules above.',
  '',
  'Skip header rows, footer rows, page numbers, totals, summary lines, and anything that is not an actual transaction.',
  '',
  'CRITICAL: moneyOut and fee MUST be NEGATIVE numbers. A R100 debit appears as moneyOut: -100. A R5 fee appears as fee: -5. Positive moneyOut values break downstream budget math.',
  '',
  'If you cannot find an account number, return accountNumber as an empty string — do not invent one.',
  '',
  'Return a JSON array.',
].join('\n');

const GEMINI_TX_SCHEMA = {
  type: 'ARRAY',
  items: {
    type: 'OBJECT',
    properties: {
      accountNumber:       { type: 'STRING' },
      postingDate:         { type: 'STRING' },
      transactionDate:     { type: 'STRING' },
      description:         { type: 'STRING' },
      originalDescription: { type: 'STRING' },
      moneyIn:             { type: 'NUMBER' },
      moneyOut:            { type: 'NUMBER' },
      fee:                 { type: 'NUMBER' },
      balance:             { type: 'NUMBER' },
    },
    required: ['postingDate', 'description'],
  },
};

function getGeminiKey_() {
  const key = PropertiesService.getScriptProperties().getProperty('GEMINI_API_KEY');
  if (!key) throw new Error('No GEMINI_API_KEY in Script Properties. See comment above for setup.');
  return key;
}

// Shared retry wrapper for transient Gemini failures (503 overload,
// 429 rate-limit, 500/502/504 blips). Up to 3 attempts with 1s/2s backoff.
function geminiFetch_(url, payload) {
  let lastErr = null;
  for (let attempt = 0; attempt < 3; attempt++) {
    if (attempt > 0) Utilities.sleep(1000 * attempt);
    const res = UrlFetchApp.fetch(url, {
      method: 'post', contentType: 'application/json',
      payload: payload, muteHttpExceptions: true,
    });
    const code = res.getResponseCode();
    if (code === 200) return res;
    const isRetryable = (code === 503 || code === 429 || code === 500 || code === 502 || code === 504);
    lastErr = 'Gemini API ' + code + ': ' + res.getContentText().slice(0, 400);
    if (!isRetryable) throw new Error(lastErr);
  }
  if (lastErr && lastErr.indexOf('503') >= 0) {
    throw new Error('Gemini is overloaded right now (retried 3 times). Please try again in a minute.');
  }
  throw new Error(lastErr || 'Gemini unreachable');
}

// Conversational budget assistant. Same GEMINI_API_KEY as PDF parsing.
function chatWithGemini_(messages, context) {
  const apiKey = getGeminiKey_();
  if (!messages.length) return { ok: false, error: 'no messages' };

  const systemPrompt = buildChatSystemPrompt_(context);

  const contents = [];
  for (let i = 0; i < messages.length; i++) {
    const m = messages[i];
    const role = m.role === 'assistant' ? 'model' : 'user';
    const text = (i === 0 && role === 'user') ? (systemPrompt + '\n\n' + m.text) : m.text;
    contents.push({ role, parts: [{ text }] });
  }

  const body = {
    contents,
    generationConfig: { temperature: 0.3, maxOutputTokens: 4000 },
  };

  const url = 'https://generativelanguage.googleapis.com/v1beta/models/' + GEMINI_MODEL + ':generateContent?key=' + apiKey;
  const res = geminiFetch_(url, JSON.stringify(body));
  const data = JSON.parse(res.getContentText());
  const cand = data.candidates && data.candidates[0];
  let text = cand && cand.content && cand.content.parts && cand.content.parts.map(p => p.text || '').join('') || '';
  const finish = cand && cand.finishReason;
  if (finish === 'MAX_TOKENS') {
    text += '\n\n— answer truncated at the token limit. Ask a more specific question, or "continue" to get the rest.';
  } else if (finish === 'SAFETY' || finish === 'RECITATION' || finish === 'BLOCKLIST') {
    text += '\n\n— Gemini stopped because of a content filter (finishReason: ' + finish + '). Try rephrasing.';
  }
  return { ok: true, message: text };
}

function buildChatSystemPrompt_(ctx) {
  const lines = [];
  lines.push("You are CapiTracker's friendly budget assistant. The user banks in South Africa and is asking questions about their personal budget.");
  lines.push("");
  lines.push("SCOPE RULES (important):");
  lines.push("- The user picks a SCOPE for the chat (e.g. 'This cycle', 'Last 30 days', 'Last 90 days', 'All history'). Only transactions in that scope are provided in this prompt.");
  lines.push("- Treat 'now', 'so far', 'this month' as referring to the current scope.");
  lines.push("- If the user explicitly asks about a period outside the current scope, say plainly: 'My current scope is <scope> (<dates>). Change the chat scope dropdown at the top of the chat and ask me again, and I'll have that data.'");
  lines.push("- Never invent numbers for periods outside the scope. Always work from the data below.");
  lines.push("");
  lines.push("STYLE:");
  lines.push("- Be concise. Use ZAR formatting (R1 234,56 with en-ZA locale).");
  lines.push("- Answer specifically with numbers when you can.");
  lines.push("- Say 'I don't have that info' rather than guessing.");
  lines.push("");

  if (ctx.budget && ctx.budget.length) {
    lines.push('BUDGET (per pay cycle):');
    for (const b of ctx.budget) lines.push('- ' + b.line + ': R' + b.amount);
    lines.push('');
  }
  if (ctx.settings) {
    lines.push('SETTINGS: net income R' + (ctx.settings.netIncome || 0) + '/cycle, pay-cycle anchor day ' + (ctx.settings.anchorDay || 25) + '.');
    lines.push('');
  }
  const scopeName = ctx.scopeLabel || 'current cycle';
  if (ctx.windowFrom && ctx.windowTo) {
    lines.push('SCOPE: ' + scopeName + ' — ' + ctx.windowFrom + ' to ' + ctx.windowTo + '.');
  } else {
    lines.push('SCOPE: ' + scopeName + ' (all available history).');
  }
  lines.push('');
  if (ctx.transactions && ctx.transactions.length) {
    const hdr = 'TRANSACTIONS IN SCOPE (' + ctx.transactions.length + (ctx.truncated ? ' shown, ' + ctx.totalCount + ' total — truncated for prompt size' : '') + ', csv-like — date | description | amount | budget line):';
    lines.push(hdr);
    for (const t of ctx.transactions) {
      lines.push(t.date + ' | ' + (t.description || '') + ' | ' + (t.amount || 0) + ' | ' + (t.line || ''));
    }
    lines.push('');
  } else {
    lines.push('TRANSACTIONS IN SCOPE: none provided.');
    lines.push('');
  }
  return lines.join('\n');
}

function parseStatementPdf_(pdfBlob) {
  const apiKey = getGeminiKey_();
  const pdfBase64 = Utilities.base64Encode(pdfBlob.getBytes());
  const body = {
    contents: [{
      parts: [
        { inlineData: { mimeType: 'application/pdf', data: pdfBase64 } },
        { text: GEMINI_PROMPT },
      ],
    }],
    generationConfig: {
      responseMimeType: 'application/json',
      responseSchema: GEMINI_TX_SCHEMA,
      temperature: 0.0,
    },
  };
  const url = 'https://generativelanguage.googleapis.com/v1beta/models/' + GEMINI_MODEL + ':generateContent?key=' + apiKey;
  const res = geminiFetch_(url, JSON.stringify(body));
  const data = JSON.parse(res.getContentText());
  const cand = data.candidates && data.candidates[0];
  const text = cand && cand.content && cand.content.parts && cand.content.parts[0] && cand.content.parts[0].text;
  if (!text) throw new Error('Unexpected Gemini response shape');
  try { return JSON.parse(text); }
  catch (e) { throw new Error('Gemini returned non-JSON: ' + text.slice(0, 500)); }
}

// Run from the editor to verify AI parsing on a recent PDF.
function testPdfParse() {
  const threads = GmailApp.search('(from:me OR from:noreply@capitecbank.co.za) newer_than:90d has:attachment', 0, 30);
  for (const wantStatement of [true, false]) {
    for (const thread of threads) {
      for (const msg of thread.getMessages()) {
        for (const att of msg.getAttachments()) {
          const name = (att.getName() || '').toLowerCase();
          if (!name.endsWith('.pdf')) continue;
          if (wantStatement && !name.includes('statement') && !name.includes('capitec')) continue;
          Logger.log('Parsing: ' + att.getName() + ' (' + Math.round(att.getSize() / 1024) + 'KB)');
          try {
            const txs = parseStatementPdf_(att);
            Logger.log('Parsed ' + txs.length + ' transactions. First 5:');
            Logger.log(JSON.stringify(txs.slice(0, 5), null, 2));
          } catch (e) {
            Logger.log('FAILED: ' + e);
          }
          return;
        }
      }
    }
  }
  Logger.log('No bank-statement PDFs found in Gmail (last 90 days).');
}

// List every PDF in your Gmail so you can debug what testPdfParse picks.
function listGmailPdfs() {
  const threads = GmailApp.search('(from:me OR from:noreply@capitecbank.co.za) newer_than:90d has:attachment', 0, 30);
  let count = 0;
  for (const thread of threads) {
    for (const msg of thread.getMessages()) {

      }

  if (count === 0) Logger.log('No PDFs found.');
}

function generateToken() {
  const arr = new Uint8Array(24);
  crypto.getRandomValues(arr);
  return Array.from(arr).map(b => b.toString(16).padStart(2, '0')).join('');
}

const TOTAL_STEPS = 5;

/* ============================================================================
   Wizard
   ========================================================================== */
function Wizard() {
  const [step, setStep] = useState(0); // 0 = welcome, 1..5 steps, 6 = success
  const [token] = useState(() => {
    const cached = sessionStorage.getItem('capitracker.wizard.token');
    if (cached) return cached;
    const t = generateToken();
    sessionStorage.setItem('capitracker.wizard.token', t);
    return t;
  });
  const [copied, setCopied] = useState(false);
  const [sheetUrl, setSheetUrl] = useState('');
  const [confirms, setConfirms] = useState({ sheet: false, pasted: false, deployed: false });
  const [test, setTest] = useState({ kind: 'idle', message: '' });

  const script = useMemo(() => APPS_SCRIPT_TEMPLATE.replace('__TOKEN__', token), [token]);

  const copyScript = async () => {
    try {
      await navigator.clipboard.writeText(script);
      setCopied(true);
      setTimeout(() => setCopied(false), 2500);
    } catch {
      const ta = document.createElement('textarea');
      ta.value = script;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      setCopied(true);
      setTimeout(() => setCopied(false), 2500);
    }
  };

  const runTest = async () => {
    const url = sheetUrl.trim();
    if (!url || !url.endsWith('/exec')) {
      setTest({ kind: 'err', message: "URL should end with /exec. Did you copy the right one?" });
      return;
    }
    setTest({ kind: 'testing', message: 'Pinging your Apps Script…' });
    try {
      const res = await fetch(`${url}?token=${encodeURIComponent(token)}&action=ping`, { redirect: 'follow' });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || 'returned ok:false');
      // Save to localStorage so main app picks it up
      try {
        localStorage.setItem('bt.config', JSON.stringify({ sheetUrl: url, sheetToken: token }));
      } catch {}
      setTest({ kind: 'ok', message: 'Connected. Your URL & token are saved in this browser.' });
      setTimeout(() => setStep(6), 900);
    } catch (e) {
      setTest({ kind: 'err', message: `Couldn't reach your script: ${e.message || String(e)}` });
    }
  };

  /* -------- Welcome (step 0) -------- */
  if (step === 0) {
    return (
      <Layout step={0}>
        <div className="text-center py-8">
          <div className="text-6xl mb-3">🪙</div>
          <h1 className="font-display text-4xl mb-3 tracking-tight">CapiTracker</h1>
          <p className="text-stone-600 max-w-md mx-auto mb-1">To Keep the Budget Lekker.</p>
          <p className="text-xs text-stone-500 max-w-md mx-auto mb-8">A free, open-source budget tracker built for South African bank statements (currently Capitec). Pay-cycle aware. Your data stays in your own Google Sheet — no servers, no signups, no subscriptions.</p>
          <div className="text-left bg-white border border-stone-300 rounded-sm p-5 max-w-md mx-auto mb-6">
            <h3 className="text-xs uppercase tracking-wider text-stone-500 mb-3">What this wizard does</h3>
            <ol className="text-sm text-stone-700 space-y-1.5 pl-4 list-decimal">
              <li>Creates a Google Sheet you own.</li>
              <li>Gives you a custom script to paste in (with a unique token).</li>
              <li>Walks you through deploying it as a web app.</li>
              <li>Tests the connection. Done.</li>
            </ol>
            <div className="text-xs text-stone-500 mt-4">~5 minutes. No signup. Free.</div>
          </div>
          <button onClick={() => setStep(1)} className="px-6 py-2.5 text-xs uppercase tracking-wider font-medium border border-slate-800 bg-slate-800 text-white hover:bg-slate-700 inline-flex items-center gap-2">
            Begin setup <IconArrow className="w-3.5 h-3.5" />
          </button>
        </div>
      </Layout>
    );
  }

  /* -------- Step 1: Create Sheet -------- */
  if (step === 1) {
    return (
      <Layout step={1}>
        <StepHeader n={1} total={TOTAL_STEPS} title="Create your Google Sheet" />
        <p className="text-sm text-stone-700">CapiTracker stores everything in a Google Sheet you own and control. We never see your data — it lives entirely in your Google account.</p>

        <div className="my-5">
          <a href="https://sheets.google.com/create" target="_blank" rel="noopener" className="inline-flex items-center gap-2 px-4 py-2 text-xs uppercase tracking-wider font-medium border border-slate-800 bg-slate-800 text-white hover:bg-slate-700">
            <IconExt className="w-3.5 h-3.5" />Open Google Sheets
          </a>
          <span className="ml-3 text-xs text-stone-500">opens in a new tab</span>
        </div>

        <Tip>Name it something memorable — e.g. "CapiTracker Budget" or "Budget 2026". You'll be coming back to it.</Tip>

        <Confirm
          label="I've created the sheet"
          checked={confirms.sheet}
          onChange={v => setConfirms({ ...confirms, sheet: v })}
        />

        <NavFooter
          onBack={() => setStep(0)}
          onNext={() => setStep(2)}
          nextDisabled={!confirms.sheet}
        />
      </Layout>
    );
  }

  /* -------- Step 2: Copy the script -------- */
  if (step === 2) {
    return (
      <Layout step={2}>
        <StepHeader n={2} total={TOTAL_STEPS} title="Copy your script" />
        <p className="text-sm text-stone-700">
          This is the code that pulls bank statements from your Gmail and powers CapiTracker. It's signed with the token below — a unique password we just generated for you. <strong>Anyone without this token can't touch your sheet.</strong>
        </p>

        <div className="mt-4 mb-3 flex items-center justify-between gap-3">
          <div className="text-xs text-stone-500">Your token (already baked into the script):</div>
          <div className="font-num text-xs bg-stone-100 px-2 py-1 border border-stone-200 break-all max-w-xs truncate">{token.slice(0, 16)}…</div>
        </div>

        <div className="border border-stone-300 bg-stone-900 text-stone-100 max-h-80 overflow-auto">
          <pre className="code p-4">{script}</pre>
        </div>

        <div className="mt-4 flex items-center gap-3">
          <button onClick={copyScript} className={`px-4 py-2 text-xs uppercase tracking-wider font-medium border inline-flex items-center gap-2 ${copied ? 'border-emerald-700 bg-emerald-700 text-white' : 'border-slate-800 bg-slate-800 text-white hover:bg-slate-700'}`}>
            {copied ? <><IconCheck className="w-3.5 h-3.5" />Copied!</> : <><IconCopy className="w-3.5 h-3.5" />Copy script</>}
          </button>
          <span className="text-xs text-stone-500">{copied ? 'Now jump to the next step.' : 'Click to copy the full script.'}</span>
        </div>

        <NavFooter
          onBack={() => setStep(1)}
          onNext={() => setStep(3)}
          nextDisabled={!copied}
        />
      </Layout>
    );
  }

  /* -------- Step 3: Paste & save -------- */
  if (step === 3) {
    return (
      <Layout step={3}>
        <StepHeader n={3} total={TOTAL_STEPS} title="Paste it into Apps Script" />
        <p className="text-sm text-stone-700">In the Google Sheet you just made, do this:</p>

        <ol className="text-sm text-stone-700 space-y-2 mt-3 pl-5 list-decimal">
          <li>In the top menu, click <strong>Extensions → Apps Script</strong>.</li>
          <li>A new tab opens — the Apps Script editor.</li>
          <li>Delete the placeholder code (you'll see <span className="font-num text-xs bg-stone-100 px-1">function myFunction() &#123;&#125;</span>).</li>
          <li>Paste your copied script (Ctrl+V).</li>
          <li>Click the <strong>disk icon</strong> at the top to save (or press Ctrl+S).</li>
        </ol>

        <ScreenshotPlaceholder caption="Apps Script editor — paste script, then click the disk icon (top-left of the editor) to save." />

        <Confirm
          label="I've pasted and saved the script"
          checked={confirms.pasted}
          onChange={v => setConfirms({ ...confirms, pasted: v })}
        />

        <NavFooter
          onBack={() => setStep(2)}
          onNext={() => setStep(4)}
          nextDisabled={!confirms.pasted}
        />
      </Layout>
    );
  }

  /* -------- Step 4: Deploy -------- */
  if (step === 4) {
    return (
      <Layout step={4}>
        <StepHeader n={4} total={TOTAL_STEPS} title="Deploy your script as a web app" />
        <p className="text-sm text-stone-700">
          Still in the Apps Script editor, deploy the script so CapiTracker can talk to it:
        </p>

        <ol className="text-sm text-stone-700 space-y-2 mt-3 pl-5 list-decimal">
          <li>Click the blue <strong>Deploy</strong> button (top right).</li>
          <li>Choose <strong>New deployment</strong>.</li>
          <li>Click the gear icon ⚙️ and select <strong>Web app</strong>.</li>
          <li>Set <strong>Execute as: Me</strong> and <strong>Who has access: Anyone with the link</strong>.</li>
          <li>Click <strong>Deploy</strong>. Authorize when prompted.</li>
          <li>
            Google may say <em>"this app isn't verified"</em>. That's normal — it's your own script accessing your own data. Click:
            <div className="mt-2 pl-3 border-l-2 border-amber-300 bg-amber-50 py-2 px-3 text-xs text-amber-900">
              <strong>Advanced</strong> → <strong>Go to project (unsafe)</strong> → <strong>Allow</strong>
            </div>
          </li>
          <li>Copy the <strong>Web app URL</strong>. It ends in <span className="font-num text-xs bg-stone-100 px-1">/exec</span>.</li>
        </ol>

        <ScreenshotPlaceholder caption="The Deploy → New deployment dialog with Web app selected, Execute as: Me, Anyone with the link." />

        <Confirm
          label="I've deployed and copied the URL"
          checked={confirms.deployed}
          onChange={v => setConfirms({ ...confirms, deployed: v })}
        />

        <NavFooter
          onBack={() => setStep(3)}
          onNext={() => setStep(5)}
          nextDisabled={!confirms.deployed}
        />
      </Layout>
    );
  }

  /* -------- Step 5: Connect -------- */
  if (step === 5) {
    return (
      <Layout step={5}>
        <StepHeader n={5} total={TOTAL_STEPS} title="Paste your URL & test the connection" />
        <p className="text-sm text-stone-700">Paste the Web app URL you just copied from Apps Script. CapiTracker will fire a test ping to make sure everything's wired up.</p>

        <div className="mt-4 space-y-2">
          <label className="text-xs uppercase tracking-wider text-stone-500">Apps Script web-app URL</label>
          <input
            type="text"
            value={sheetUrl}
            onChange={e => { setSheetUrl(e.target.value); setTest({ kind: 'idle', message: '' }); }}
            placeholder="https://script.google.com/macros/s/.../exec"
            className="w-full px-3 py-2 border border-stone-300 text-sm font-num"
          />
        </div>

        <div className="mt-4">
          <button onClick={runTest} disabled={!sheetUrl || test.kind === 'testing'} className="px-4 py-2 text-xs uppercase tracking-wider font-medium border border-slate-800 bg-slate-800 text-white hover:bg-slate-700 disabled:opacity-50 inline-flex items-center gap-2">
            {test.kind === 'testing' ? 'Testing…' : 'Test connection'}
          </button>
        </div>

        {test.kind === 'err' && (
          <div className="mt-3 px-3 py-2 bg-red-50 text-red-800 border border-red-200 text-xs flex items-start gap-2">
            <IconAlert className="w-3.5 h-3.5 mt-0.5 shrink-0" />
            <div>
              <div className="font-medium">{test.message}</div>
              <div className="mt-1 text-red-700/80">
                Common fixes: make sure you redeployed after pasting, the URL ends in <span className="font-num bg-red-100 px-1">/exec</span>, and you authorised the deploy.
              </div>
            </div>
          </div>
        )}

        {test.kind === 'ok' && (
          <div className="mt-3 px-3 py-2 bg-emerald-50 text-emerald-800 border border-emerald-200 text-xs flex items-center gap-2">
            <IconCheck className="w-3.5 h-3.5" />{test.message}
          </div>
        )}

        <NavFooter
          onBack={() => setStep(4)}
          onNext={runTest}
          nextLabel="Test & finish"
          nextDisabled={!sheetUrl || test.kind === 'testing' || test.kind === 'ok'}
        />
      </Layout>
    );
  }

  /* -------- Success (step 6) -------- */
  return (
    <Layout step={6}>
      <div className="text-center py-12">
        <div className="text-6xl mb-3">🎉</div>
        <h1 className="font-display text-3xl mb-3">You're connected.</h1>
        <p className="text-sm text-stone-600 max-w-md mx-auto mb-6">
          Your Sheet is set up, your script is deployed, and your URL + token are saved in this browser.<br/>
          Time to email yourself a bank statement and watch it flow in.
        </p>

        <div className="bg-white border border-stone-300 rounded-sm p-5 max-w-md mx-auto text-left mb-6">
          <h3 className="text-xs uppercase tracking-wider text-stone-500 mb-3">Your first transactions</h3>
          <ol className="text-sm text-stone-700 space-y-1.5 pl-4 list-decimal">
            <li>Open your banking app, export the last 30 days as CSV.</li>
            <li>Email it <strong>from the same Gmail address</strong> that owns this script (the one you just authorized). Any subject, attach the CSV.</li>
            <li>Open CapiTracker, hit <strong>Sync Gmail</strong>. Done.</li>
          </ol>
          <div className="text-xs text-stone-500 mt-4 pt-3 border-t border-stone-100">
            <strong>Why from the same address?</strong> The script searches its own inbox using <code className="font-num bg-stone-100 px-1">from:me</code>. If you send the CSV from a different Gmail (e.g. work account) to this one, the script won't find it. Either send from this account, or edit <code className="font-num bg-stone-100 px-1">GMAIL_QUERY</code> in the script to <code className="font-num bg-stone-100 px-1">to:me</code>.
          </div>
        </div>

        <div className="bg-indigo-50 border border-indigo-200 rounded-sm p-5 max-w-md mx-auto text-left mb-6">
          <h3 className="text-xs uppercase tracking-wider text-indigo-700 mb-2">Optional power-ups (Script Properties)</h3>
          <p className="text-xs text-stone-700 mb-3">
            Your Apps Script has a built-in <strong>encrypted key-value store</strong> called Script Properties. Two things you can plug in there for extra power:
          </p>

          <p className="text-xs text-stone-500 mb-2"><strong>How to open Script Properties:</strong></p>
          <ol className="text-xs text-stone-700 space-y-1 pl-4 list-decimal mb-4">
            <li>Apps Script editor → click the <strong>⚙️ gear icon</strong> in the left sidebar (Project Settings)</li>
            <li>Scroll to the <strong>"Script properties"</strong> section</li>
            <li>Click <strong>"Add script property"</strong>, enter the key + value, click <strong>Save script properties</strong></li>
          </ol>

          <div className="bg-white rounded-sm border border-indigo-100 p-3 mb-3">
            <div className="text-xs font-medium text-indigo-800 mb-2">1. <code className="font-num bg-stone-100 px-1 text-[10px]">GEMINI_API_KEY</code> — AI PDF parsing for any SA bank</div>
            <p className="text-xs text-stone-600 mb-3">
              Skip CSV forwarding entirely. Capitec, FNB, Standard Bank, Nedbank, ABSA, etc. — Gemini AI extracts transactions directly from the PDF statement your bank emails you.
            </p>

            <p className="text-[11px] uppercase tracking-wider text-stone-500 mb-1">A. Get a free Gemini API key</p>
            <ol className="text-xs text-stone-700 space-y-1.5 pl-4 list-decimal mb-3">
              <li>Open <a href="https://aistudio.google.com/app/apikey" target="_blank" rel="noopener" className="underline text-indigo-700">aistudio.google.com/app/apikey</a> in a new tab.</li>
              <li>Sign in with any Google account (the one tied to your CapiTracker Sheet is easiest).</li>
              <li>Click <strong>"Create API key"</strong> (centre / top of the page).</li>
              <li>If asked to pick a project: choose <strong>"Create API key in new project"</strong>. Free tier — <strong>no billing setup required.</strong></li>
              <li>Copy the key it shows you. It starts with <code className="font-num bg-stone-100 px-1 text-[10px]">AIza…</code> and is ~40 characters long.</li>
            </ol>

            <p className="text-[11px] uppercase tracking-wider text-stone-500 mb-1">B. Plug it into your Apps Script</p>
            <ol className="text-xs text-stone-700 space-y-1.5 pl-4 list-decimal mb-3">
              <li>Open your Apps Script (the one you deployed earlier).</li>
              <li>Click the <strong>⚙️ gear icon</strong> (Project Settings) → scroll to <strong>"Script properties"</strong>.</li>
              <li>Click <strong>"Add script property"</strong>. Property: <code className="font-num bg-stone-100 px-1 text-[10px]">GEMINI_API_KEY</code>, Value: paste your key.</li>
              <li>Click <strong>"Save script properties"</strong>.</li>
              <li>Back in the editor, save (Ctrl+S) and redeploy: <strong>Deploy → Manage deployments → ✏️ → New version → Deploy</strong>.</li>
            </ol>

            <p className="text-[11px] uppercase tracking-wider text-stone-500 mb-1">C. Use it</p>
            <p className="text-xs text-stone-700 mb-3">
              In CapiTracker, click the new <strong>Sync PDF (AI)</strong> button. Confirm the coffee-break prompt. ~3 minutes later, your PDF statement's transactions appear in the Sheet.
            </p>

            <div className="bg-amber-50 border border-amber-200 rounded-sm px-3 py-2 text-[11px] text-amber-900">
              <strong>Free tier limits:</strong> 15 requests/min, ~1,500 PDFs/day. Way more than personal use needs. If you ever hit "Set up billing" in AI Studio — ignore it. Free is fine.
            </div>

            <p className="text-[11px] text-stone-500 mt-2">
              <strong>Privacy:</strong> only your PDF statement bytes go to Google's Gemini API when you click Sync PDF. No training on inputs, 30-day retention then deletion. Your key lives in your own Script Properties (encrypted) — the CapiTracker maintainer never sees it.
            </p>
          </div>

          <div className="bg-white rounded-sm border border-indigo-100 p-3">
            <div className="text-xs font-medium text-indigo-800 mb-1">2. <code className="font-num bg-stone-100 px-1 text-[10px]">SHARED_TOKEN</code> — optional move from code to encrypted store</div>
            <p className="text-xs text-stone-600 mb-2">
              By default your token sits as a constant in the Apps Script code. You can move it to Script Properties for two wins: never visible if you share/screenshot the code, and rotatable without a full redeploy.
            </p>
            <ol className="text-xs text-stone-700 space-y-1 pl-4 list-decimal">
              <li>Add Property <code className="font-num bg-stone-100 px-1 text-[10px]">SHARED_TOKEN</code> = <em>your current token</em></li>
              <li>Optionally clear the <code className="font-num bg-stone-100 px-1 text-[10px]">SHARED_TOKEN = '…'</code> line in the code back to the placeholder string</li>
              <li>That's it — the script picks up the Property automatically. No redeploy needed.</li>
            </ol>
          </div>
        </div>

        <div className="flex items-center justify-center gap-3">
          <a href="budget_tracker.html" className="px-5 py-2.5 text-xs uppercase tracking-wider font-medium border border-slate-800 bg-slate-800 text-white hover:bg-slate-700 inline-flex items-center gap-2">
            Open CapiTracker <IconArrow className="w-3.5 h-3.5" />
          </a>
        </div>
      </div>
    </Layout>
  );
}

/* ============================================================================
   Layout + reusable pieces
   ========================================================================== */
function Layout({ step, children }) {
  return (
    <div className="min-h-screen flex flex-col">
      <header style={{ backgroundColor: '#1A2540' }} className="border-b border-stone-300">
        <div className="max-w-3xl mx-auto px-6 py-4 text-stone-100 flex items-center justify-between">
          <div className="flex items-center gap-3">
            <span className="text-2xl">🪙</span>
            <div>
              <div className="font-display text-lg tracking-tight">CapiTracker</div>
              <div className="text-stone-400 text-xs tracking-wide uppercase">Setup wizard</div>
            </div>
          </div>
          {step > 0 && step < 6 && <ProgressDots current={step} total={TOTAL_STEPS} />}
        </div>
      </header>
      <main className="max-w-3xl mx-auto w-full px-6 py-8 flex-1">
        {children}
      </main>
      <footer className="max-w-3xl mx-auto w-full px-6 pb-6 text-xs text-stone-500">
        Open source · MIT · Your data stays in your Google account
      </footer>
    </div>
  );
}

function ProgressDots({ current, total }) {
  return (
    <div className="flex items-center gap-1.5">
      {Array.from({ length: total }).map((_, i) => {
        const n = i + 1;
        const done = n < current;
        const here = n === current;
        return (
          <div key={n}
            className={`w-2.5 h-2.5 rounded-full transition-colors ${done ? 'bg-emerald-400' : here ? 'bg-stone-100' : 'bg-stone-600'}`}
            title={`Step ${n}`}
          />
        );
      })}
      <div className="ml-2 text-xs text-stone-300 font-num">{current}/{total}</div>
    </div>
  );
}

function StepHeader({ n, total, title }) {
  return (
    <div className="mb-4">
      <div className="text-xs uppercase tracking-wider text-stone-500">Step {n} of {total}</div>
      <h2 className="font-display text-2xl mt-0.5">{title}</h2>
    </div>
  );
}

function Tip({ children }) {
  return (
    <div className="text-xs text-stone-600 bg-stone-100 border-l-2 border-stone-400 px-3 py-2 my-3">
      {children}
    </div>
  );
}

function Confirm({ label, checked, onChange }) {
  return (
    <label className="flex items-center gap-2 mt-6 cursor-pointer text-sm select-none">
      <input
        type="checkbox"
        checked={checked}
        onChange={e => onChange(e.target.checked)}
        className="w-4 h-4 accent-slate-800"
      />
      {label}
    </label>
  );
}

function NavFooter({ onBack, onNext, nextLabel = 'Next', nextDisabled = false }) {
  return (
    <div className="mt-8 pt-5 border-t border-stone-200 flex items-center justify-between">
      <button onClick={onBack} className="px-3 py-1.5 text-xs uppercase tracking-wider font-medium border border-stone-300 text-stone-700 hover:bg-stone-100 inline-flex items-center gap-2">
        <IconBack className="w-3.5 h-3.5" />Back
      </button>
      <button onClick={onNext} disabled={nextDisabled} className={`px-5 py-2 text-xs uppercase tracking-wider font-medium border inline-flex items-center gap-2 ${nextDisabled ? 'border-stone-300 text-stone-400 cursor-not-allowed' : 'border-slate-800 bg-slate-800 text-white hover:bg-slate-700'}`}>
        {nextLabel} <IconArrow className="w-3.5 h-3.5" />
      </button>
    </div>
  );
}

function ScreenshotPlaceholder({ caption }) {
  return (
    <div className="my-4 border border-dashed border-stone-300 bg-stone-50 px-4 py-8 text-center text-xs text-stone-500">
      <div className="font-medium text-stone-700 mb-1">[ screenshot goes here ]</div>
      <div>{caption}</div>
    </div>
  );
}

/* ============================================================================
   Boot
   ========================================================================== */
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<Wizard />);
</script>
</body>
</html>
