<body>
<div id="root"></div>

<script type="text/babel" data-presets="env,react">
const { useState, useMemo, useEffect } = React;

/* ============================================================================
   Apps Script template — the user's token will be substituted in
   ========================================================================== */
const APPS_SCRIPT_TEMPLATE = String.raw`/**
 * CapiTracker — Budget Tracker Apps Script
 * Generated by the setup wizard. Don't share the SHARED_TOKEN below — it's the
 * password between your browser app and your Sheet.
 */

const SHARED_TOKEN = '__TOKEN__';
const GMAIL_QUERY  = 'from:me newer_than:30d has:attachment filename:csv';

const T_RAW      = 'Bank Statement';
const T_HISTORY  = 'Transactions';
const T_BUDGET   = 'Budget';
const T_RULES    = 'Rules';
const T_SETTINGS = 'Settings';

const HEADERS = {
  [T_RAW]:      ['Nr','Account','Posting Date','Transaction Date','Description','Original Description','Parent Category','Category','Money In','Money Out','Fee','Balance'],
  [T_HISTORY]:  ['Account','Posting Date','Transaction Date','Description','Original Description','Parent Category','Category','Money In','Money Out','Fee','Line','Posted At'],
  [T_BUDGET]:   ['Line','Amount'],
  [T_RULES]:    ['Line','Type','Value'],
  [T_SETTINGS]: ['Key','Value'],
};

const DEFAULT_BUDGET = [
  ['Groceries', 3000], ['Rent', 6000], ['Fuel', 2500], ['Eating out', 1200],
  ['Subscriptions', 600], ['Reimbursable', 0], ['Review', 0],
];

const DEFAULT_RULES = [
  ['Groceries',    'cat', 'Groceries'],
  ['Fuel',         'cat', 'Fuel'],
  ['Eating out',   'cat', 'Restaurants'],
  ['Eating out',   'cat', 'Takeaways'],
];

const DEFAULT_SETTINGS = [
  ['Net Income', 25000],
  ['Anchor Day', 25],
];

function onOpen() {
  ensureTabs_();
  try { pullStatements_(); } catch (e) { Logger.log('Email pull failed: ' + e); }
}

function ensureTabs_() {
  const ss = SpreadsheetApp.getActiveSpreadsheet();
  for (const tabName of [T_RAW, T_HISTORY, T_BUDGET, T_RULES, T_SETTINGS]) {
    if (ss.getSheetByName(tabName)) continue;
    const sheet = ss.insertSheet(tabName);
    const h = HEADERS[tabName];
    sheet.getRange(1, 1, 1, h.length).setValues([h]).setFontWeight('bold');
    sheet.setFrozenRows(1);
    let rows = null;
    if (tabName === T_BUDGET)        rows = DEFAULT_BUDGET;
    else if (tabName === T_RULES)    rows = DEFAULT_RULES;
    else if (tabName === T_SETTINGS) rows = DEFAULT_SETTINGS;
    if (rows && rows.length) sheet.getRange(2, 1, rows.length, rows[0].length).setValues(rows);
  }
}

function pullStatements_() {
  const ss = SpreadsheetApp.getActiveSpreadsheet();
  const sheet = ss.getSheetByName(T_RAW);
  if (!sheet) return;
  const threads = GmailApp.search(GMAIL_QUERY, 0, 30);
  const collected = [];
  const seen = new Set();
  for (const t of threads) {
    for (const m of t.getMessages()) {
      for (const att of m.getAttachments()) {
        const name = (att.getName() || '').toLowerCase();
        if (!name.endsWith('.csv')) continue;
        if (att.isGoogleType && att.isGoogleType()) continue;
        let csv; try { csv = Utilities.parseCsv(att.getDataAsString()); } catch (_) { continue; }
        if (csv.length < 2) continue;
        const idx = {}; csv[0].forEach((h, i) => idx[String(h).trim()] = i);
        for (let r = 1; r < csv.length; r++) {
          const row = csv[r];
          const pd = row[idx['Posting Date']];
          if (!pd) continue;
          const out = HEADERS[T_RAW].map(h => h === 'Nr' ? '' : (idx[h] !== undefined ? row[idx[h]] : ''));
          const desc = (row[idx['Original Description']] || row[idx['Description']] || '').toString().toLowerCase();
          const amt = (Number(row[idx['Money In']])||0) + (Number(row[idx['Money Out']])||0) + (Number(row[idx['Fee']])||0);
          const hash = pd + '|' + desc + '|' + amt.toFixed(2);
          if (seen.has(hash)) continue;
          seen.add(hash);
          collected.push(out);
        }
      }
    }
  }
  const pdIdx = HEADERS[T_RAW].indexOf('Posting Date');
  collected.sort((a, b) => String(a[pdIdx]).localeCompare(String(b[pdIdx])));
  collected.forEach((r, i) => r[0] = i + 1);
  sheet.clearContents();
  const h = HEADERS[T_RAW];
  sheet.getRange(1, 1, 1, h.length).setValues([h]).setFontWeight('bold');
  if (collected.length) sheet.getRange(2, 1, collected.length, h.length).setValues(collected);
  Logger.log('Pulled ' + collected.length + ' rows from ' + threads.length + ' threads.');
}

function doGet(e) {
  const p = (e && e.parameter) || {};
  if (!checkToken_(p.token)) return jsonOut_({ ok: false, error: 'bad token' });
  const action = p.action || 'load';
  try {
    if (action === 'load') return jsonOut_(loadAll_());
    if (action === 'pull') { pullStatements_(); return jsonOut_(loadAll_()); }
    if (action === 'ping') return jsonOut_({ ok: true, message: 'pong' });
    return jsonOut_({ ok: false, error: 'unknown action: ' + action });
  } catch (err) { return jsonOut_({ ok: false, error: String(err) }); }
}

function doPost(e) {
  let body;
  try { body = JSON.parse(e && e.postData && e.postData.contents); } catch (_) { return jsonOut_({ ok: false, error: 'bad json' }); }
  if (!body) return jsonOut_({ ok: false, error: 'no body' });
  if (!checkToken_(body.token)) return jsonOut_({ ok: false, error: 'bad token' });
  try {
    switch (body.action) {
      case 'append-history':  return jsonOut_(appendHistory_(body.rows || []));
      case 'update-history':  return jsonOut_(updateHistoryLine_(body.hash, body.line));
      case 'delete-history':  return jsonOut_(deleteHistoryRow_(body.hash));
      case 'save-budget':     return jsonOut_(overwriteTab_(T_BUDGET, body.rows || []));
      case 'save-rules':      return jsonOut_(overwriteTab_(T_RULES, body.rows || []));
      case 'save-settings':   return jsonOut_(overwriteSettings_(body.settings || {}));
      default: return jsonOut_({ ok: false, error: 'unknown action: ' + body.action });
    }
  } catch (err) { return jsonOut_({ ok: false, error: String(err) }); }
}

function checkToken_(t) { return t && SHARED_TOKEN && t === SHARED_TOKEN; }
function jsonOut_(obj)  { return ContentService.createTextOutput(JSON.stringify(obj)).setMimeType(ContentService.MimeType.JSON); }

function loadAll_() {
  return { ok: true,
    rawStatements: readTab_(T_RAW), transactions: readTab_(T_HISTORY),
    budget: readTab_(T_BUDGET), rules: readTab_(T_RULES), settings: readSettings_() };
}

function readTab_(name) {
  const sheet = SpreadsheetApp.getActiveSpreadsheet().getSheetByName(name);
  if (!sheet) return [];
  const data = sheet.getDataRange().getValues();
  if (data.length < 2) return [];
  const headers = data[0].map(String);
  const tz = Session.getScriptTimeZone();
  const out = [];
  for (let r = 1; r < data.length; r++) {
    if (data[r].every(v => v === '' || v === null)) continue;
    const obj = {};
    for (let c = 0; c < headers.length; c++) {
      let v = data[r][c];
      if (v instanceof Date) v = Utilities.formatDate(v, tz, 'yyyy-MM-dd');
      obj[headers[c]] = v;
    }
    out.push(obj);
  }
  return out;
}

function readSettings_() {
  const out = {};
  readTab_(T_SETTINGS).forEach(r => { if (r.Key) out[String(r.Key)] = r.Value; });
  return out;
}

function appendHistory_(rows) {
  if (!rows.length) return { ok: true, appended: 0 };
  const sheet = SpreadsheetApp.getActiveSpreadsheet().getSheetByName(T_HISTORY);
  const existing = readTab_(T_HISTORY);
  const existingHashes = new Set(existing.map(hashRow_));
  const headers = HEADERS[T_HISTORY];
  const now = new Date().toISOString();
  const fresh = rows.filter(r => !existingHashes.has(hashRow_(r)));
  if (!fresh.length) return { ok: true, appended: 0 };
  const arr = fresh.map(r => headers.map(h => h === 'Posted At' ? now : (r[h] !== undefined ? r[h] : '')));
  sheet.getRange(sheet.getLastRow() + 1, 1, arr.length, headers.length).setValues(arr);
  return { ok: true, appended: arr.length };
}

function findHistoryRowByHash_(hash) {
  const sheet = SpreadsheetApp.getActiveSpreadsheet().getSheetByName(T_HISTORY);
  if (!sheet) return { sheet: null, rowIdx: -1, headers: null };
  const data = sheet.getDataRange().getValues();
  if (data.length < 2) return { sheet, rowIdx: -1, headers: null };
  const headers = data[0].map(String);
  const tz = Session.getScriptTimeZone();
  for (let r = 1; r < data.length; r++) {
    const obj = {};
    for (let c = 0; c < headers.length; c++) {
      let v = data[r][c];
      if (v instanceof Date) v = Utilities.formatDate(v, tz, 'yyyy-MM-dd');
      obj[headers[c]] = v;
    }
    if (hashRow_(obj) === hash) return { sheet, rowIdx: r + 1, headers };
  }
  return { sheet, rowIdx: -1, headers };
}

function updateHistoryLine_(hash, line) {
  if (!hash || !line) return { ok: false, error: 'hash and line required' };
  const { sheet, rowIdx, headers } = findHistoryRowByHash_(hash);
  if (rowIdx < 0) return { ok: false, error: 'row not found' };
  const lineCol = headers.indexOf('Line');
  if (lineCol < 0) return { ok: false, error: 'no Line column' };
  sheet.getRange(rowIdx, lineCol + 1).setValue(line);
  return { ok: true };
}

function deleteHistoryRow_(hash) {
  if (!hash) return { ok: false, error: 'hash required' };
  const { sheet, rowIdx } = findHistoryRowByHash_(hash);
  if (rowIdx < 0) return { ok: false, error: 'row not found' };
  sheet.deleteRow(rowIdx);
  return { ok: true };
}

function hashRow_(r) {
  const mi = Number(r['Money In']) || 0;
  const mo = Number(r['Money Out']) || 0;
  const fe = Number(r['Fee']) || 0;
  const desc = (r['Original Description'] || r['Description'] || '').toString().toLowerCase();
  return [r['Posting Date'], desc, (mi + mo + fe).toFixed(2)].join('|');
}

function overwriteTab_(name, rows) {
  const sheet = SpreadsheetApp.getActiveSpreadsheet().getSheetByName(name);
  const headers = HEADERS[name];
  sheet.clearContents();
  sheet.getRange(1, 1, 1, headers.length).setValues([headers]).setFontWeight('bold');
  if (rows.length) {
    const arr = rows.map(r => headers.map(h => r[h] !== undefined ? r[h] : ''));
    sheet.getRange(2, 1, arr.length, headers.length).setValues(arr);
  }
  return { ok: true, saved: rows.length };
}

function overwriteSettings_(obj) {
  const rows = Object.keys(obj).map(k => ({ Key: k, Value: obj[k] }));
  return overwriteTab_(T_SETTINGS, rows);
}
`;

/* ============================================================================
   Icons
   ========================================================================== */
const Icon = ({ d, className = "w-4 h-4" }) => (
  <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">{d}</svg>
);
const IconCheck  = (p) => <Icon {...p} d={<><polyline points="20 6 9 17 4 12"/></>} />;
const IconCopy   = (p) => <Icon {...p} d={<><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></>} />;
const IconExt    = (p) => <Icon {...p} d={<><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></>} />;
const IconArrow  = (p) => <Icon {...p} d={<><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></>} />;
const IconBack   = (p) => <Icon {...p} d={<><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></>} />;
const IconAlert  = (p) => <Icon {...p} d={<><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></>} />;
const IconCoin   = (p) => <Icon {...p} d={<><circle cx="12" cy="12" r="9"/><path d="M9 9h4.5a1.5 1.5 0 0 1 0 3H10a1.5 1.5 0 0 0 0 3h5"/></>} />;

/* ============================================================================
   Helpers
   ========================================================================== */
function generateToken() {
  const arr = new Uint8Array(24);
  crypto.getRandomValues(arr);
  return Array.from(arr).map(b => b.toString(16).padStart(2, '0')).join('');
}

const TOTAL_STEPS = 5;

/* ============================================================================
   Wizard
   ========================================================================== */
function Wizard() {
  const [step, setStep] = useState(0); // 0 = welcome, 1..5 steps, 6 = success
  const [token] = useState(() => {
    const cached = sessionStorage.getItem('capitracker.wizard.token');
    if (cached) return cached;
    const t = generateToken();
    sessionStorage.setItem('capitracker.wizard.token', t);
    return t;
  });
  const [copied, setCopied] = useState(false);
  const [sheetUrl, setSheetUrl] = useState('');
  const [confirms, setConfirms] = useState({ sheet: false, pasted: false, deployed: false });
  const [test, setTest] = useState({ kind: 'idle', message: '' });

  const script = useMemo(() => APPS_SCRIPT_TEMPLATE.replace('__TOKEN__', token), [token]);

  const copyScript = async () => {
    try {
      await navigator.clipboard.writeText(script);
      setCopied(true);
      setTimeout(() => setCopied(false), 2500);
    } catch {
      const ta = document.createElement('textarea');
      ta.value = script;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      setCopied(true);
      setTimeout(() => setCopied(false), 2500);
    }
  };

  const runTest = async () => {
    const url = sheetUrl.trim();
    if (!url || !url.endsWith('/exec')) {
      setTest({ kind: 'err', message: "URL should end with /exec. Did you copy the right one?" });
      return;
    }
    setTest({ kind: 'testing', message: 'Pinging your Apps Script…' });
    try {
      const res = await fetch(`${url}?token=${encodeURIComponent(token)}&action=ping`, { redirect: 'follow' });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || 'returned ok:false');
      // Save to localStorage so main app picks it up
      try {
        localStorage.setItem('bt.config', JSON.stringify({ sheetUrl: url, sheetToken: token }));
      } catch {}
      setTest({ kind: 'ok', message: 'Connected. Your URL & token are saved in this browser.' });
      setTimeout(() => setStep(6), 900);
    } catch (e) {
      setTest({ kind: 'err', message: `Couldn't reach your script: ${e.message || String(e)}` });
    }
  };

  /* -------- Welcome (step 0) -------- */
  if (step === 0) {
    return (
      <Layout step={0}>
        <div className="text-center py-8">
          <div className="text-6xl mb-3">🪙</div>
          <h1 className="font-display text-4xl mb-3 tracking-tight">CapiTracker</h1>
          <p className="text-stone-600 max-w-md mx-auto mb-1">To Keep the Budget Lekker.</p>
          <p className="text-xs text-stone-500 max-w-md mx-auto mb-8">A free, open-source budget tracker built for South African bank statements (currently Capitec). Pay-cycle aware. Your data stays in your own Google Sheet — no servers, no signups, no subscriptions.</p>
          <div className="text-left bg-white border border-stone-300 rounded-sm p-5 max-w-md mx-auto mb-6">
            <h3 className="text-xs uppercase tracking-wider text-stone-500 mb-3">What this wizard does</h3>
            <ol className="text-sm text-stone-700 space-y-1.5 pl-4 list-decimal">
              <li>Creates a Google Sheet you own.</li>
              <li>Gives you a custom script to paste in (with a unique token).</li>
              <li>Walks you through deploying it as a web app.</li>
              <li>Tests the connection. Done.</li>
            </ol>
            <div className="text-xs text-stone-500 mt-4">~5 minutes. No signup. Free.</div>
          </div>
          <button onClick={() => setStep(1)} className="px-6 py-2.5 text-xs uppercase tracking-wider font-medium border border-slate-800 bg-slate-800 text-white hover:bg-slate-700 inline-flex items-center gap-2">
            Begin setup <IconArrow className="w-3.5 h-3.5" />
          </button>
        </div>
      </Layout>
    );
  }

  /* -------- Step 1: Create Sheet -------- */
  if (step === 1) {
    return (
      <Layout step={1}>
        <StepHeader n={1} total={TOTAL_STEPS} title="Create your Google Sheet" />
        <p className="text-sm text-stone-700">CapiTracker stores everything in a Google Sheet you own and control. We never see your data — it lives entirely in your Google account.</p>

        <div className="my-5">
          <a href="https://sheets.google.com/create" target="_blank" rel="noopener" className="inline-flex items-center gap-2 px-4 py-2 text-xs uppercase tracking-wider font-medium border border-slate-800 bg-slate-800 text-white hover:bg-slate-700">
            <IconExt className="w-3.5 h-3.5" />Open Google Sheets
          </a>
          <span className="ml-3 text-xs text-stone-500">opens in a new tab</span>
        </div>

        <Tip>Name it something memorable — e.g. "CapiTracker Budget" or "Budget 2026". You'll be coming back to it.</Tip>

        <Confirm
          label="I've created the sheet"
          checked={confirms.sheet}
          onChange={v => setConfirms({ ...confirms, sheet: v })}
        />

        <NavFooter
          onBack={() => setStep(0)}
          onNext={() => setStep(2)}
          nextDisabled={!confirms.sheet}
        />
      </Layout>
    );
  }

  /* -------- Step 2: Copy the script -------- */
  if (step === 2) {
    return (
      <Layout step={2}>
        <StepHeader n={2} total={TOTAL_STEPS} title="Copy your script" />
        <p className="text-sm text-stone-700">
          This is the code that pulls bank statements from your Gmail and powers CapiTracker. It's signed with the token below — a unique password we just generated for you. <strong>Anyone without this token can't touch your sheet.</strong>
        </p>

        <div className="mt-4 mb-3 flex items-center justify-between gap-3">
          <div className="text-xs text-stone-500">Your token (already baked into the script):</div>
          <div className="font-num text-xs bg-stone-100 px-2 py-1 border border-stone-200 break-all max-w-xs truncate">{token.slice(0, 16)}…</div>
        </div>

        <div className="border border-stone-300 bg-stone-900 text-stone-100 max-h-80 overflow-auto">
          <pre className="code p-4">{script}</pre>
        </div>

        <div className="mt-4 flex items-center gap-3">
          <button onClick={copyScript} className={`px-4 py-2 text-xs uppercase tracking-wider font-medium border inline-flex items-center gap-2 ${copied ? 'border-emerald-700 bg-emerald-700 text-white' : 'border-slate-800 bg-slate-800 text-white hover:bg-slate-700'}`}>
            {copied ? <><IconCheck className="w-3.5 h-3.5" />Copied!</> : <><IconCopy className="w-3.5 h-3.5" />Copy script</>}
          </button>
          <span className="text-xs text-stone-500">{copied ? 'Now jump to the next step.' : 'Click to copy the full script.'}</span>
        </div>

        <NavFooter
          onBack={() => setStep(1)}
          onNext={() => setStep(3)}
          nextDisabled={!copied}
        />
      </Layout>
    );
  }

  /* -------- Step 3: Paste & save -------- */
  if (step === 3) {
    return (
      <Layout step={3}>
        <StepHeader n={3} total={TOTAL_STEPS} title="Paste it into Apps Script" />
        <p className="text-sm text-stone-700">In the Google Sheet you just made, do this:</p>

        <ol className="text-sm text-stone-700 space-y-2 mt-3 pl-5 list-decimal">
          <li>In the top menu, click <strong>Extensions → Apps Script</strong>.</li>
          <li>A new tab opens — the Apps Script editor.</li>
          <li>Delete the placeholder code (you'll see <span className="font-num text-xs bg-stone-100 px-1">function myFunction() &#123;&#125;</span>).</li>
          <li>Paste your copied script (Ctrl+V).</li>
          <li>Click the <strong>disk icon</strong> at the top to save (or press Ctrl+S).</li>
        </ol>

        <ScreenshotPlaceholder caption="Apps Script editor — paste script, then click the disk icon (top-left of the editor) to save." />

        <Confirm
          label="I've pasted and saved the script"
          checked={confirms.pasted}
          onChange={v => setConfirms({ ...confirms, pasted: v })}
        />

        <NavFooter
          onBack={() => setStep(2)}
          onNext={() => setStep(4)}
          nextDisabled={!confirms.pasted}
        />
      </Layout>
    );
  }

  /* -------- Step 4: Deploy -------- */
  if (step === 4) {
    return (
      <Layout step={4}>
        <StepHeader n={4} total={TOTAL_STEPS} title="Deploy your script as a web app" />
        <p className="text-sm text-stone-700">
          Still in the Apps Script editor, deploy the script so CapiTracker can talk to it:
        </p>

        <ol className="text-sm text-stone-700 space-y-2 mt-3 pl-5 list-decimal">
          <li>Click the blue <strong>Deploy</strong> button (top right).</li>
          <li>Choose <strong>New deployment</strong>.</li>
          <li>Click the gear icon ⚙️ and select <strong>Web app</strong>.</li>
          <li>Set <strong>Execute as: Me</strong> and <strong>Who has access: Anyone with the link</strong>.</li>
          <li>Click <strong>Deploy</strong>. Authorize when prompted.</li>
          <li>
            Google may say <em>"this app isn't verified"</em>. That's normal — it's your own script accessing your own data. Click:
            <div className="mt-2 pl-3 border-l-2 border-amber-300 bg-amber-50 py-2 px-3 text-xs text-amber-900">
              <strong>Advanced</strong> → <strong>Go to project (unsafe)</strong> → <strong>Allow</strong>
            </div>
          </li>
          <li>Copy the <strong>Web app URL</strong>. It ends in <span className="font-num text-xs bg-stone-100 px-1">/exec</span>.</li>
        </ol>

        <ScreenshotPlaceholder caption="The Deploy → New deployment dialog with Web app selected, Execute as: Me, Anyone with the link." />

        <Confirm
          label="I've deployed and copied the URL"
          checked={confirms.deployed}
          onChange={v => setConfirms({ ...confirms, deployed: v })}
        />

        <NavFooter
          onBack={() => setStep(3)}
          onNext={() => setStep(5)}
          nextDisabled={!confirms.deployed}
        />
      </Layout>
    );
  }

  /* -------- Step 5: Connect -------- */
  if (step === 5) {
    return (
      <Layout step={5}>
        <StepHeader n={5} total={TOTAL_STEPS} title="Paste your URL & test the connection" />
        <p className="text-sm text-stone-700">Paste the Web app URL you just copied from Apps Script. CapiTracker will fire a test ping to make sure everything's wired up.</p>

        <div className="mt-4 space-y-2">
          <label className="text-xs uppercase tracking-wider text-stone-500">Apps Script web-app URL</label>
          <input
            type="text"
            value={sheetUrl}
            onChange={e => { setSheetUrl(e.target.value); setTest({ kind: 'idle', message: '' }); }}
            placeholder="https://script.google.com/macros/s/.../exec"
            className="w-full px-3 py-2 border border-stone-300 text-sm font-num"
          />
        </div>

        <div className="mt-4">
          <button onClick={runTest} disabled={!sheetUrl || test.kind === 'testing'} className="px-4 py-2 text-xs uppercase tracking-wider font-medium border border-slate-800 bg-slate-800 text-white hover:bg-slate-700 disabled:opacity-50 inline-flex items-center gap-2">
            {test.kind === 'testing' ? 'Testing…' : 'Test connection'}
          </button>
        </div>

        {test.kind === 'err' && (
          <div className="mt-3 px-3 py-2 bg-red-50 text-red-800 border border-red-200 text-xs flex items-start gap-2">
            <IconAlert className="w-3.5 h-3.5 mt-0.5 shrink-0" />
            <div>
              <div className="font-medium">{test.message}</div>
              <div className="mt-1 text-red-700/80">
                Common fixes: make sure you redeployed after pasting, the URL ends in <span className="font-num bg-red-100 px-1">/exec</span>, and you authorised the deploy.
              </div>
            </div>
          </div>
        )}

        {test.kind === 'ok' && (
          <div className="mt-3 px-3 py-2 bg-emerald-50 text-emerald-800 border border-emerald-200 text-xs flex items-center gap-2">
            <IconCheck className="w-3.5 h-3.5" />{test.message}
          </div>
        )}

        <NavFooter
          onBack={() => setStep(4)}
          onNext={runTest}
          nextLabel="Test & finish"
          nextDisabled={!sheetUrl || test.kind === 'testing' || test.kind === 'ok'}
        />
      </Layout>
    );
  }

  /* -------- Success (step 6) -------- */
  return (
    <Layout step={6}>
      <div className="text-center py-12">
        <div className="text-6xl mb-3">🎉</div>
        <h1 className="font-display text-3xl mb-3">You're connected.</h1>
        <p className="text-sm text-stone-600 max-w-md mx-auto mb-6">
          Your Sheet is set up, your script is deployed, and your URL + token are saved in this browser.<br/>
          Time to email yourself a bank statement and watch it flow in.
        </p>

        <div className="bg-white border border-stone-300 rounded-sm p-5 max-w-md mx-auto text-left mb-6">
          <h3 className="text-xs uppercase tracking-wider text-stone-500 mb-3">Your first transactions</h3>
          <ol className="text-sm text-stone-700 space-y-1.5 pl-4 list-decimal">
            <li>Open your banking app, export the last 30 days as CSV.</li>
            <li>Email it to yourself (any subject, attach the CSV).</li>
            <li>Open CapiTracker, hit <strong>Sync Gmail</strong>. Done.</li>
          </ol>
        </div>

        <div className="flex items-center justify-center gap-3">
          <a href="budget_tracker.html" className="px-5 py-2.5 text-xs uppercase tracking-wider font-medium border border-slate-800 bg-slate-800 text-white hover:bg-slate-700 inline-flex items-center gap-2">
            Open CapiTracker <IconArrow className="w-3.5 h-3.5" />
          </a>
        </div>
      </div>
    </Layout>
  );
}

/* ============================================================================
   Layout + reusable pieces
   ========================================================================== */
function Layout({ step, children }) {
  return (
    <div className="min-h-screen flex flex-col">
      <header style={{ backgroundColor: '#1A2540' }} className="border-b border-stone-300">
        <div className="max-w-3xl mx-auto px-6 py-4 text-stone-100 flex items-center justify-between">
          <div className="flex items-center gap-3">
            <span className="text-2xl">🪙</span>
            <div>
              <div className="font-display text-lg tracking-tight">CapiTracker</div>
              <div className="text-stone-400 text-xs tracking-wide uppercase">Setup wizard</div>
            </div>
          </div>
          {step > 0 && step < 6 && <ProgressDots current={step} total={TOTAL_STEPS} />}
        </div>
      </header>
      <main className="max-w-3xl mx-auto w-full px-6 py-8 flex-1">
        {children}
      </main>
      <footer className="max-w-3xl mx-auto w-full px-6 pb-6 text-xs text-stone-500">
        Open source · MIT · Your data stays in your Google account
      </footer>
    </div>
  );
}

function ProgressDots({ current, total }) {
  return (
    <div className="flex items-center gap-1.5">
      {Array.from({ length: total }).map((_, i) => {
        const n = i + 1;
        const done = n < current;
        const here = n === current;
        return (
          <div key={n}
            className={`w-2.5 h-2.5 rounded-full transition-colors ${done ? 'bg-emerald-400' : here ? 'bg-stone-100' : 'bg-stone-600'}`}
            title={`Step ${n}`}
          />
        );
      })}
      <div className="ml-2 text-xs text-stone-300 font-num">{current}/{total}</div>
    </div>
  );
}

function StepHeader({ n, total, title }) {
  return (
    <div className="mb-4">
      <div className="text-xs uppercase tracking-wider text-stone-500">Step {n} of {total}</div>
      <h2 className="font-display text-2xl mt-0.5">{title}</h2>
    </div>
  );
}

function Tip({ children }) {
  return (
    <div className="text-xs text-stone-600 bg-stone-100 border-l-2 border-stone-400 px-3 py-2 my-3">
      {children}
    </div>
  );
}

function Confirm({ label, checked, onChange }) {
  return (
    <label className="flex items-center gap-2 mt-6 cursor-pointer text-sm select-none">
      <input
        type="checkbox"
        checked={checked}
        onChange={e => onChange(e.target.checked)}
        className="w-4 h-4 accent-slate-800"
      />
      {label}
    </label>
  );
}

function NavFooter({ onBack, onNext, nextLabel = 'Next', nextDisabled = false }) {
  return (
    <div className="mt-8 pt-5 border-t border-stone-200 flex items-center justify-between">
      <button onClick={onBack} className="px-3 py-1.5 text-xs uppercase tracking-wider font-medium border border-stone-300 text-stone-700 hover:bg-stone-100 inline-flex items-center gap-2">
        <IconBack className="w-3.5 h-3.5" />Back
      </button>
      <button onClick={onNext} disabled={nextDisabled} className={`px-5 py-2 text-xs uppercase tracking-wider font-medium border inline-flex items-center gap-2 ${nextDisabled ? 'border-stone-300 text-stone-400 cursor-not-allowed' : 'border-slate-800 bg-slate-800 text-white hover:bg-slate-700'}`}>
        {nextLabel} <IconArrow className="w-3.5 h-3.5" />
      </button>
    </div>
  );
}

function ScreenshotPlaceholder({ caption }) {
  return (
    <div className="my-4 border border-dashed border-stone-300 bg-stone-50 px-4 py-8 text-center text-xs text-stone-500">
      <div className="font-medium text-stone-700 mb-1">[ screenshot goes here ]</div>
      <div>{caption}</div>
    </div>
  );
}

/* ============================================================================
   Boot
   ========================================================================== */
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<Wizard />);
</script>
</body>
</html>
